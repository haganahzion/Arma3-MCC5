<\/h1>\n<p>You can go from an empty map to a playable mission in about 10 minutes. You use the editor Mission Wizard, place your squad, play, and open Zeus.<\/p>\n<p>If the mod is not installed yet, start with <a href=\"installation.md\">Installation<\/a>.<\/p>\n<h2>1. Open the editor<\/h2>\n<ol><li>Start Arma 3 with <strong>MCC Sandbox 5<\/strong> and <strong>CBA_A3<\/strong> loaded.<\/li><li>Open <strong>Editor<\/strong> and pick a map. Altis, Stratis, Tanoa or Malden are fine for a first try.<\/li><li>Find <strong>MCC 5<\/strong> in the top menu bar of the editor.<\/li><\/ol>\n<h2>2. Pick the mission area<\/h2>\n<p>The Mission Wizard builds the mission around a spot you choose. The easiest way:<\/p>\n<ol><li>Move the editor camera so the center of the screen looks at a town or area on land.<\/li><\/ol>\n<p>Other ways, if you want more control:<\/p>\n<ul><li>Place a <strong>trigger<\/strong> (or an area marker), size it, and <strong>select it<\/strong> before you generate. The mission is built inside that area.<\/li><li>Or set the wizard to <strong>Whole map<\/strong> and it picks a random town or location.<\/li><\/ul>\n<p>The center of the area must be on land, not in the water.<\/p>\n<h2>3. Set the wizard options<\/h2>\n<ol><li>Open <strong>MCC 5 &gt; Mission Wizard...<\/strong><\/li><li>Under <strong>Factions<\/strong>, set:<ul><li><strong>Enemy Faction<\/strong>, for example OPFOR CSAT (<code>OPF_F<\/code>).<\/li><li><strong>Player Faction<\/strong>, for example BLUFOR NATO (<code>BLU_F<\/code>). It must be on a different side from the enemy.<\/li><li><strong>Civilian Faction<\/strong>, for example <code>CIV_F<\/code>.<\/li><\/ul><\/li><li>Under <strong>Mission area and size<\/strong>, set <strong>Expected Players<\/strong> to the number of people who will play.<\/li><li>Pick a <strong>Difficulty<\/strong>. Medium is the default.<\/li><li>Leave the rest at the defaults for now. You can read about every option on the <a href=\"mission-wizard.md\">Mission Wizard<\/a> page.<\/li><li>If you want a spawn point made for you, set <strong>Player Start<\/strong> to <strong>Respawn marker outside the area<\/strong>.<\/li><li>Close the window with <strong>OK<\/strong>.<\/li><\/ol>\n<h2>4. Generate the mission<\/h2>\n<ol><li>Click <strong>MCC 5 &gt; Generate Mission<\/strong>.<\/li><li>Wait a moment. A notification shows a summary: the operation name, how many objectives, groups and AI units were placed.<\/li><li>The camera moves to the mission area.<\/li><\/ol>\n<p>Everything the wizard made is now normal editor content in a layer called <strong>MCC Mission Wizard<\/strong>. Open the layer list on the left to see it. You can move, edit or delete anything in it.<\/p>\n<p>To undo the whole generation, press <strong>Ctrl+Z<\/strong> once. Or use <strong>MCC 5 &gt; Regenerate Mission (clear + generate)<\/strong> to throw it away and build a new one.<\/p>\n<h2>5. Place your squad<\/h2>\n<p>The wizard places enemies, not you.<\/p>\n<ol><li>Open the asset browser on the right and pick units from your <strong>Player Faction<\/strong>.<\/li><li>Place your squad outside the mission area. If you used <strong>Player Start<\/strong>, put them near the \"MW Start\" respawn marker.<\/li><li>Make one unit the player (<strong>Player<\/strong> in the unit attributes) or make units <strong>Playable<\/strong> for multiplayer.<\/li><\/ol>\n<p>The tasks and briefing are created for the side of the Player Faction. Your units must be on that side to get them.<\/p>\n<h2>6. Play<\/h2>\n<ol><li>Click <strong>Play Scenario<\/strong> (single player) or save and host it in multiplayer.<\/li><li>Read the briefing in the map (Diary). The tasks show which objectives to complete.<\/li><li>Go do them. GAIA controls the enemy groups in their zones.<\/li><\/ol>\n<h2>7. Open Zeus<\/h2>\n<p>MCC users get Zeus automatically. By default that is everyone. A mission maker can limit it with the <strong>Access Rights<\/strong> module. See <a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a>.<\/p>\n<ol><li>Press <strong>Ctrl+Delete<\/strong> (the MCC keybind) or <strong>Y<\/strong> (the normal Zeus key).<\/li><li>Open the <strong>Modules<\/strong> tab on the right. The MCC tools are in the categories that start with <strong>MCC<\/strong>.<\/li><li>Drag a tool onto the map. Its options open.<\/li><\/ol>\n<p>For tools that act on one unit, like <strong>Make Hostage<\/strong>, drop the module onto the unit.<\/p>\n<p>A fun first try: right-click an AI soldier of your side and pick <strong>GAIA: Control Group<\/strong>. GAIA takes over his squad and works through your side's tasks. Pick <strong>Player Control Group<\/strong> to take it back.<\/p>\n<p>All Zeus tools are listed on the <a href=\"zeus-tools.md\">Zeus tools<\/a> page.<\/p>\n<h2>Where to go next<\/h2>\n<ul><li><a href=\"mission-wizard.md\">Mission Wizard<\/a> for every option and what Generate builds<\/li><li><a href=\"eden-editor.md\">Eden editor<\/a> for MCC modules and attributes<\/li><li><a href=\"gaia.md\">GAIA AI<\/a> to control AI with zones and behaviours<\/li><li><a href=\"settings.md\">Settings<\/a> to change how MCC behaves<\/li><\/ul>", "eden-editor": "<h1>Eden editor<\/h1>\n<p>In MCC 5 everything for the mission maker lives in the Eden editor: one top menu, one settings window, MCC modules and two MCC attributes on objects and groups.<\/p>\n<h2>The MCC 5 menu<\/h2>\n<p><strong>MCC 5<\/strong> sits in the top menu bar of the editor. It works with or without 3den Enhanced.<\/p>\n<table><thead><tr><th>Menu item<\/th><th>What it does<\/th><\/tr><\/thead><tbody><tr><td><strong>MCC 5 Mission Settings...<\/strong><\/td><td>Opens the MCC 5 window with every MCC setting for this mission. See <a href=\"#mission-settings-window\">Mission Settings window<\/a>.<\/td><\/tr><tr><td><strong>Mission Wizard...<\/strong><\/td><td>Opens the editor Mission Wizard options. See <a href=\"mission-wizard.md\">Mission Wizard<\/a>.<\/td><\/tr><tr><td><strong>Generate Mission<\/strong><\/td><td>Builds the whole Mission Wizard mission as editor objects.<\/td><\/tr><tr><td><strong>Regenerate Mission (clear + generate)<\/strong><\/td><td>Deletes the last generated mission, then generates a new one.<\/td><\/tr><tr><td><strong>Clear Generated Mission<\/strong><\/td><td>Deletes everything in the \"MCC Mission Wizard\" layers.<\/td><\/tr><tr><td><strong>Place MCC Module<\/strong><\/td><td>Submenu. Places an MCC module at the center of the screen and opens its attributes.<\/td><\/tr><tr><td><strong>Place Settings Module<\/strong><\/td><td>Submenu. Same for the MCC settings modules.<\/td><\/tr><tr><td><strong>In-game: Zeus (Ctrl+Delete / Y) &gt; Modules &gt; MCC<\/strong><\/td><td>A reminder. It only shows a notification about how Zeus works in game.<\/td><\/tr><tr><td><strong>About MCC 5<\/strong><\/td><td>Shows a short notification about where things are.<\/td><\/tr><\/tbody><\/table>\n<h3>Place MCC Module<\/h3>\n<p>Each entry creates the module at the screen center, selects it and opens its attributes.<\/p>\n<ul><li>Mission Wizard (generated at mission start)<\/li><li>Convoy<\/li><li>Fire Mission<\/li><li>Music / Sound<\/li><li>Create Zone<\/li><li>Campaign Init<\/li><li>Capture Point<\/li><li>IED / Suicide Bomber<\/li><li>Evac Vehicle<\/li><li>Intel<\/li><li>Vehicle Respawn<\/li><li>Start Location<\/li><li>Access Rights<\/li><\/ul>\n<h3>Place Settings Module<\/h3>\n<ul><li>General<\/li><li>GAIA<\/li><li>Mission Wizard<\/li><li>Mechanics<\/li><li>Medical System<\/li><\/ul>\n<p>All these modules are also in the normal Eden module browser (<strong>Systems &gt; Modules<\/strong>, under the <strong>(MCC) ...<\/strong> categories). The menu is a shortcut.<\/p>\n<h2>Mission Settings window<\/h2>\n<p><strong>MCC 5 &gt; MCC 5 Mission Settings...<\/strong> opens one window called <strong>MCC 5 Mission Settings<\/strong>. It has:<\/p>\n<ul><li>A first category, <strong>MCC 5<\/strong>, with the main MCC 5 options:<ul><li>Limited Logistics<\/li><li>Mission Wizard: Max Objectives, Mission Size, Max Spawned Units<\/li><li>Campaign: Simultaneous AOs, AO Size, Ambient Groups Cap<\/li><li>GAIA: AI Support Requests, AI Artillery, AI Close Air Support, AI Reinforcements, Coordinated Attacks, Headless Client Balancing<\/li><li>Zeus for MCC Users<\/li><li>Network Security<\/li><\/ul><\/li><li>One more category for each group of MCC CBA settings (General, GAIA, Mission Wizard, Logistics, Mechanics, Medical, Radio, Respawn, User Interface, Role Selection, Classes, Commander Console). These start collapsed.<\/li><\/ul>\n<p>Almost every value starts at <strong>Use addon setting<\/strong> (or an empty box). That means: keep whatever the CBA addon setting says. Only values you change are saved into the mission.<\/p>\n<p>When the mission starts, the server copies the values you changed over the matching CBA settings, for every machine. Each change is written to the RPT as <code>MCC: Eden attribute ...<\/code>. If a mission <code>cba_settings.sqf<\/code> or a server admin forces a setting with \"overwrite mission\" priority, that forced value still wins, and the RPT says so.<\/p>\n<p><strong>Network Security<\/strong> is the one exception. It has no \"Use addon setting\" state. It is Normal by default. See <a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a>.<\/p>\n<p>The full list of settings, with defaults, is on the <a href=\"settings.md\">Settings<\/a> page.<\/p>\n<p>Missions that don't use these Eden attributes can set the same names in <code>description.ext<\/code> instead, for example <code>MCC_logisticsMode = 2;<\/code> or <code>MCC_networkSecurity = 1;<\/code>.<\/p>\n<h2>MCC attributes on objects and groups<\/h2>\n<h3>Objects: MCC: Zeus Editable<\/h3>\n<p>Open the attributes of a unit, vehicle or simulated object. In the <strong>MCC<\/strong> category tick <strong>MCC: Zeus Editable<\/strong>.<\/p>\n<p>At mission start the object, and its crew, is added to every Zeus. Use it for things your Zeus players must be able to move or edit. Default: off.<\/p>\n<h3>Groups: MCC: GAIA Control<\/h3>\n<p>Open the attributes of a group (not a single unit). The <strong>MCC: GAIA Control<\/strong> category has:<\/p>\n<table><thead><tr><th>Attribute<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td><strong>GAIA Zone<\/strong><\/td><td>The MCC zone number this group belongs to. 0 means GAIA does not control the group.<\/td><td>0<\/td><\/tr><tr><td><strong>GAIA Behavior<\/strong><\/td><td>How GAIA uses the group in its zone. See below.<\/td><td>Aggressive<\/td><\/tr><tr><td><strong>GAIA Cache<\/strong><\/td><td>Let GAIA cache (freeze or remove) the group while no player is near.<\/td><td>Off<\/td><\/tr><\/tbody><\/table>\n<p>GAIA Behavior choices:<\/p>\n<ul><li><strong>Aggressive<\/strong>: patrol, and pursue enemies outside the zone (<code>MOVE<\/code>).<\/li><li><strong>Defensive<\/strong>: patrol, stay in the zone (<code>NOFOLLOW<\/code>).<\/li><li><strong>Fortify<\/strong>: occupy buildings and static weapons (<code>FORTIFY<\/code>).<\/li><li><strong>BIS Defence<\/strong> and <strong>BIS Patrol<\/strong> are also listed. The GAIA code only gives special orders for the first three behaviours, so pick one of those if you want GAIA to command the group.<\/li><\/ul>\n<p>The zone number must exist when the mission runs. Zones get numbers in the order they are created, starting at 1. Each <strong>Create Zone<\/strong> module makes one zone at mission start. With several Create Zone modules (or a generated Mission Wizard mission) you can't be sure which zone gets which number, so syncing the group to an <strong>Assign AI to zone<\/strong> module is the safer way. See <a href=\"gaia.md\">GAIA AI<\/a>.<\/p>\n<h2>Eden modules<\/h2>\n<p>MCC modules sit in the Eden module browser under these categories:<\/p>\n<ul><li><strong>(MCC) General<\/strong><\/li><li><strong>(MCC) AI<\/strong><\/li><li><strong>(MCC) Ordnance<\/strong><\/li><li><strong>(MCC) Utility<\/strong><\/li><li><strong>(MCC) Ships Static<\/strong><\/li><li><strong>(MCC) RTS<\/strong><\/li><li><strong>(MCC) Environment<\/strong><\/li><li><strong>(MCC) PvP<\/strong><\/li><\/ul>\n<p>Most modules work by <strong>syncing<\/strong> (right-click the module &gt; Connect &gt; Sync to) to triggers, units or objects. The module's own description in Eden tells you what to sync.<\/p>\n<h3>New in MCC 5<\/h3>\n<p><strong>Mission Wizard<\/strong> (General). Generates a random Mission Wizard mission on the server when the mission starts. It uses the module's own options. See <a href=\"mission-wizard.md#the-mission-wizard-eden-module-runtime\">Mission Wizard<\/a>.<\/p>\n<p><strong>Convoy<\/strong> (AI). Turns synced crewed land vehicles into one convoy that drives to a destination.<\/p>\n<ol><li>Place crewed vehicles and sync them (or their crew) to the module.<\/li><li>Set a destination: a <strong>Destination Marker<\/strong> name, or sync an empty object such as a Game Logic or invisible helipad. Without both, the convoy follows the Eden waypoints of the lead vehicle's group.<\/li><li>Optional: sync a trigger. The convoy starts when the trigger activates. Without a trigger it starts at mission start.<\/li><\/ol>\n<p>Options:<\/p>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Destination Marker<\/td><td>Marker name of the destination<\/td><td>empty<\/td><\/tr><tr><td>Start Delay (s)<\/td><td>Wait after the trigger (or mission start) before moving<\/td><td>0<\/td><\/tr><tr><td>Lead Speed (km/h)<\/td><td>Speed of the lead vehicle, 0 = no limit<\/td><td>40<\/td><\/tr><tr><td>Separation (m)<\/td><td>Distance between vehicles<\/td><td>30<\/td><\/tr><tr><td>HVT Class<\/td><td>Optional unit class. The HVT rides captive and disarmed in the middle vehicle (handcuffed with ACE)<\/td><td>empty<\/td><\/tr><tr><td>Escort Infantry<\/td><td>Fill free cargo seats with infantry of each vehicle's faction<\/td><td>off<\/td><\/tr><tr><td>On Arrival<\/td><td>Stop and hold, Dismount passengers, or Delete the convoy<\/td><td>Stop and hold<\/td><\/tr><\/tbody><\/table>\n<p>The vehicle closest to the destination leads. The module stores <code>MCC_convoyState<\/code> (waiting, moving, arrived, destroyed), <code>MCC_convoyVehicles<\/code> and <code>MCC_convoyHVT<\/code>, so you can check them in triggers.<\/p>\n<p><strong>Fire Mission<\/strong> (Ordnance). Fires artillery at the module position, or at a synced object or unit (its position when the salvo fires).<\/p>\n<ul><li>Sync a trigger to fire when it activates. A repeatable trigger fires it again on every activation. Without a trigger it fires at mission start.<\/li><li>Sync crewed artillery (mortars, howitzers, MLRS) to use real guns. They fire their first magazine that is in range. Without guns, or when none is in range, MCC simulated shells are used.<\/li><\/ul>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Shell (simulated)<\/td><td>Shell used when no synced gun can fire: DPICM, HE 120mm, HE 155mm, Cluster AP, Mines 120mm, HE Laser-guided (as plain bomb), HE 82mm, Incendiary 82mm, Smoke White 120mm, Smoke White 82mm, Smoke Green 40mm, Smoke Red 40mm, Flare White, Flare Green, Flare Red<\/td><td>HE 120mm<\/td><\/tr><tr><td>Spread<\/td><td>On target, Precise (100 m), Tight (200 m), Wide (400 m)<\/td><td>Precise (100 m)<\/td><\/tr><tr><td>Rounds per Salvo<\/td><td>Shells per salvo (per gun with synced guns)<\/td><td>4<\/td><\/tr><tr><td>Salvos<\/td><td>Number of salvos<\/td><td>1<\/td><\/tr><tr><td>Time Between Salvos (s)<\/td><td>Seconds between salvos<\/td><td>30<\/td><\/tr><tr><td>Time Between Shells (s)<\/td><td>Simulated shells only<\/td><td>1<\/td><\/tr><tr><td>Delay (s)<\/td><td>Seconds from trigger (or mission start) to the first salvo<\/td><td>0<\/td><\/tr><\/tbody><\/table>\n<p><strong>Music / Sound<\/strong> (Environment). Plays music or a sound for every player.<\/p>\n<ul><li><strong>Track / Sound<\/strong>: a CfgMusic class (for example <code>LeadTrack01_F<\/code>) or a CfgSounds class (for example <code>AlarmSfx<\/code>). Mission classes work too. Default <code>LeadTrack01_F<\/code>.<\/li><li><strong>Type<\/strong>: Music, Sound or Stop music.<\/li><li>Sync a trigger to play it when the trigger activates (again on each activation of a repeatable trigger). Without a trigger it plays at mission start.<\/li><\/ul>\n<h3>Zones and AI<\/h3>\n<p><strong>Create Zone<\/strong> (AI). Makes an MCC zone for GAIA.<\/p>\n<ol><li>Place a trigger and size it. The trigger area is the zone area.<\/li><li>Sync the trigger to the Create Zone module.<\/li><li>To put groups in this zone, also sync one or more <strong>Assign AI to zone<\/strong> modules to it.<\/li><\/ol>\n<p>At mission start the zone gets the next free zone number.<\/p>\n<p><strong>Assign AI to zone<\/strong> (AI). Sync groups or units to it, and sync it to one Create Zone module. Those groups are put under GAIA in that zone. <strong>Behavior<\/strong>: aggressive (default), defensive or fortify.<\/p>\n<p><strong>Respawn Group<\/strong> (AI). Sync to any unit or group. The group respawns when all its units are dead. <strong>Respawns<\/strong>: how many times.<\/p>\n<p><strong>Ambient Units<\/strong> (AI). Ambient civilians and cars around players. Options: Ambient Patrols, Ambient Cars, Parked Cars, Parked Cars Locked, Faction, Car's Faction, Civilians attitude, Civs Always Friendly.<\/p>\n<p><strong>Ambient units(Restrict)<\/strong> (AI). Server side: stops ambient AI spawning within its <strong>Radius<\/strong>.<\/p>\n<p><strong>Set Unconscious<\/strong> (AI). Sync to an AI man to force the unconscious state. Needs the MCC medical system on. Options: Disable Bleeding, Force Unconscious.<\/p>\n<p><strong>Undercover Agents<\/strong> (AI). Sync to player roles. Those players can move near enemy AI as long as they keep weapons hidden and don't act suspicious. <strong>Remove Weapons<\/strong> removes their weapons at game start.<\/p>\n<p><strong>Convoy<\/strong> is described above.<\/p>\n<h3>General<\/h3>\n<p><strong>Access Rights<\/strong>. Who may use MCC (and so who gets Zeus). Enter player UIDs in <strong>MCC Operators<\/strong> as an array, for example <code>[\"76561190000000000\"]<\/code>, and/or sync player roles to the module. <strong>Admin Access<\/strong> also allows admins and the host. See <a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a>.<\/p>\n<p><strong>Start Location<\/strong>. Defines a side's start location. Options: Side, Type (F.O.B or Main; you need at least one Main), Insertion (open the respawn menu at mission start and how to insert: don't open/don't teleport, Teleport, Paradrop, H.A.L.O), Distractable (can be destroyed), Construct Buildings (a real building or just a flag pole).<\/p>\n<p><strong>Evac Vehicle<\/strong>. Sync to a vehicle to make it an AI evac vehicle that players can command. Options: Evac Side, Add Gunners, Campaign Evac (respawns each in-game day during an MCC campaign).<\/p>\n<p><strong>IED/Suicide Bomber<\/strong>. Sync to a vehicle or object to make an IED, or to an AI to make a suicide bomber. Options: Activate Side, Explosion Size (Small, Medium, Large), Explosion Effect (Deadly, Disabling, Fake, None), Disarm Time (10 to 240 seconds), Jammable, Activation Type (Proximity, Radio/Spotter, Mission Maker Only, Mini-Game (Proximity), Mini-Game (Manual)), Activation Distance (5 to 50 m).<\/p>\n<p><strong>Armed Civilian<\/strong>. Sync to an AI unit. It will randomly draw a weapon on units of its rival side. Options: Attack Side, Random Patrol.<\/p>\n<p><strong>Intel<\/strong>. Sync to an object or unit. Players can interact with it and get the intel. Options: Shared With (All, Group, Side), Intel's Tittle, Intel's Text, Marker Name, Delete Object After.<\/p>\n<p><strong>Vehicle Respawn<\/strong>. Sync to vehicles to respawn them. Options: Abandon Distance, Wait Time, Respawns (empty = infinite), Explosion Effect, Disabled Vehicles, Code (runs on the respawned vehicle as <code>_this<\/code>).<\/p>\n<p><strong>Restricted zones<\/strong>. Sync to triggers to make restricted areas. Options: Restricted Sides, Time Before Punishment, Air Vehicles, Create markers.<\/p>\n<p><strong>Special Forces<\/strong>. Sync to player roles to give them the helmet camera. <strong>User custom key<\/strong> picks which \"Use Action\" key (1 to 20) opens it.<\/p>\n<p><strong>Campaign init<\/strong>. Starts an MCC campaign. See <a href=\"campaign.md\">Campaign<\/a>.<\/p>\n<p><strong>Mission Wizard<\/strong> is described above.<\/p>\n<p><strong>Survival: Spawn loot in buildings<\/strong>. Spawns loot crates in buildings around the module, or in synced triggers. Options: Radius, Density (1 to 10), Markers.<\/p>\n<h3>Settings modules (General)<\/h3>\n<p>These set MCC settings for the mission from a module, the older way. The MCC 5 Mission Settings window does the same and more.<\/p>\n<ul><li><strong>(Settings) General<\/strong><\/li><li><strong>(Settings) GAIA<\/strong><\/li><li><strong>(Settings) Mechanics<\/strong><\/li><li><strong>(Settings) Radio System<\/strong><\/li><li><strong>(Settings) Medical System<\/strong> (ignored when ACE is loaded)<\/li><li><strong>(Settings) HUD<\/strong><\/li><li><strong>(Settings) Role Selection<\/strong><\/li><li><strong>(Settings) Mission Wizard<\/strong>: define the classes the Mission Wizard uses for one list (HVT, radio tower, fuel tanks, armored vehicles, air vehicles, ammo cache, radar, intel objects, IED, anti-air, artillery), from synced vehicles or a class array.<\/li><\/ul>\n<h3>Ordnance<\/h3>\n<p><strong>Fire Mission<\/strong> is described above.<\/p>\n<h3>Utility<\/h3>\n<p><strong>Rearm Area<\/strong>. Sync to objects. Those objects become sources where aircraft can change their pylon loadout. The pylon dialog also has rearm, refuel and repair buttons.<\/p>\n<p><strong>Load to Cargo<\/strong>. Loads objects into a vehicle's or container's cargo at mission start, using ACE cargo when it is loaded, else MCC logistics.<\/p>\n<ol><li>Sync the module to the vehicle (or container).<\/li><li>Place a Game Logic (the module description calls it the \"unlock logic\") and sync it to the module as well.<\/li><li>Sync the objects you want loaded to that Game Logic.<\/li><\/ol>\n<h3>Ships Static<\/h3>\n<p><strong>Spawn Ship<\/strong>. Spawns a static ship that acts as a base. Options: Side, Respawn Position, Vehicles Purchasing (buy vehicles on the main deck), Rearm and Refuel (rearm, refuel and repair on the main deck), Ship type (the LHD needs CUP), Ship Name.<\/p>\n<h3>RTS<\/h3>\n<p><strong>Vehicle Shop<\/strong>. A kiosk where players buy vehicles. Sync one Notice Board object and one Invisible Helipad. Options: Vehicles Type (Vehicles, Armored, Helicopters, Fixed Wings, Ships, Units), Side Purchase.<\/p>\n<p><strong>Weapon Shop<\/strong>. Sync one ammo box and one other object or unit. The box contents become the items for sale. Options: Action Text, Prices, Persistent, Unique name.<\/p>\n<p><strong>Create Building<\/strong>. Builds an RTS building instantly. Options: Building, Side.<\/p>\n<p><strong>Set Resources<\/strong>. Sets a side's resources: Materials, Ammo, Fuel, Food, Meds.<\/p>\n<p><strong>Add Credits To Players<\/strong>. Sync to player units to give them credits at mission start. Option: Credits.<\/p>\n<h3>Environment<\/h3>\n<p><strong>Ambient Birds<\/strong>. Flocks of birds fly up when units get close to trees.<\/p>\n<p><strong>Ambient Fire<\/strong>. Fires start from explosives and fire fights and spread with the wind.<\/p>\n<p><strong>Atmosphere<\/strong>. Preset or custom atmosphere. Custom options include dust, snow, newspapers, mist, fog, leaves, wind sounds, color filter and grain filter.<\/p>\n<p><strong>(ILS) Instrument Landing System<\/strong>. Place one on the start of each runway, facing the runway direction. Options: Runway Name, Runway Length (100, 200 or 300 m), Allowed Sides, Arcade Mode (circles that guide the landing path).<\/p>\n<p><strong>Music / Sound<\/strong> is described above.<\/p>\n<h3>PvP<\/h3>\n<p><strong>Capture Point<\/strong>. A capture zone that gives resources over time. Sync a trigger for the capture area, and optionally a flagpole. Options: Type (Ammo, Supply, Fuel, Tickets), Score Reward, Flag, Respawn (owner side can respawn there), HUD, Designation.<\/p>\n<p><strong>Advance And Secure init<\/strong>. An Advance and Secure mission where objectives must be captured in order. Sync it to MCC capture zones or dummy sector modules in the order they should be captured. Options: side1, side2, Tickets Bleed (tickets lost every 5 seconds by the losing side).<\/p>\n<p><strong>AAS Spawn AI<\/strong>. Spawns AI that try to take enemy sectors in AAS. Options: Spawn Faction, Enemy Side, auto balance, Minimum number of AI per side, Spawn at Sectors, Search Vehicles Radius, Use MCC roles gear, Spawn Vehicles.<\/p>\n<h2>Sample missions<\/h2>\n<p>MCC ships ready-made multiplayer missions. They show up in the multiplayer scenario list with names like <strong>(MCC) Template<\/strong>, <strong>(MCC) Campaign<\/strong> (and RHS, BAF, USMC, RU, GU, TK variants) and <strong>(MCC) PvP<\/strong>, on maps such as Altis, Tanoa, Malden, Stratis and others. Some need the map or the mods in their name to be loaded.<\/p>", "mission-wizard": "<h1>Mission Wizard<\/h1>\n<p>The Mission Wizard builds a complete mission for you: zones, objectives with tasks, enemy patrols and garrisons, vehicles, roadblocks, IEDs, civilians, a briefing and the weather.<\/p>\n<p>There are three ways to use it:<\/p>\n<table><thead><tr><th><\/th><th>Editor wizard<\/th><th>Zeus Mission Wizard<\/th><th>Mission Wizard Eden module<\/th><\/tr><\/thead><tbody><tr><td>Where<\/td><td>Eden menu <strong>MCC 5 &gt; Generate Mission<\/strong><\/td><td>Zeus module <strong>Mission Wizard<\/strong><\/td><td>Eden module <strong>Mission Wizard<\/strong>, placed in the editor<\/td><\/tr><tr><td>When it builds<\/td><td>In the editor, right away<\/td><td>In game, when you place it<\/td><td>In game, at mission start<\/td><\/tr><tr><td>Result<\/td><td>Normal editor objects you can see and edit before playing<\/td><td>Spawned live on the server<\/td><td>Spawned live on the server<\/td><\/tr><tr><td>Objectives<\/td><td>Up to 8, each slot chosen<\/td><td>3 chosen, more from the Max Objectives setting<\/td><td>3 chosen, up to 8 with the Objectives option<\/td><\/tr><tr><td>Factions<\/td><td>Picked from a list<\/td><td>Picked from a list<\/td><td>Typed as class names<\/td><\/tr><tr><td>Undo<\/td><td>Ctrl+Z, Clear, Regenerate<\/td><td>No<\/td><td>No<\/td><\/tr><tr><td>Different every time you play<\/td><td>No, it is fixed once generated<\/td><td>Yes<\/td><td>Yes<\/td><\/tr><\/tbody><\/table>\n<p>The editor wizard is new in MCC 5. It is the main way to build a Mission Wizard mission.<\/p>\n<h2>Editor wizard: step by step<\/h2>\n<ol><li>Choose the area (see <a href=\"#mission-area\">Mission area<\/a>).<\/li><li>Open <strong>MCC 5 &gt; Mission Wizard...<\/strong> and set the options. Click <strong>OK<\/strong>.<\/li><li>Click <strong>MCC 5 &gt; Generate Mission<\/strong>.<\/li><li>Read the notification. It shows the operation name, the number of objectives, groups, AI units and entities, and anything that was skipped.<\/li><li>Look through the <strong>MCC Mission Wizard<\/strong> layer and change what you like.<\/li><li>Place your own playable units. The wizard does not place players.<\/li><\/ol>\n<p>All \"Random\" choices are rolled when you press Generate. The result is fixed after that. Generate again to get a different roll.<\/p>\n<h2>Editor wizard options<\/h2>\n<h3>Mission area and size<\/h3>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Mission Area<\/td><td>Where the mission is built. <strong>Selected trigger/marker, else camera view<\/strong>: the area of the one selected trigger or area marker; with nothing selected, the point the camera looks at. <strong>Camera view (center of screen)<\/strong>: always the screen center. <strong>Whole map (random location)<\/strong>: a random town or location on the map.<\/td><td>Selected trigger/marker, else camera view<\/td><\/tr><tr><td>Area Radius (m)<\/td><td>Radius of the area. 0 = automatic, worked out from players, objectives and mission size. Ignored when a selected trigger or marker gives the area.<\/td><td>0<\/td><\/tr><tr><td>Expected Players<\/td><td>Number of players the mission is built for.<\/td><td>10<\/td><\/tr><tr><td>Difficulty<\/td><td>Enemies per player: Easy (2), Medium (4), Hard (6).<\/td><td>Medium<\/td><\/tr><tr><td>Mission Size<\/td><td>Multiplier on enemy numbers and area size: Small (0.5), Normal (1), Large (1.75), Huge (2.5).<\/td><td>Normal<\/td><\/tr><tr><td>Max AI Units<\/td><td>Hard cap on the AI the wizard places (enemies, civilians, crews). Every man counts, vehicle crews included. GAIA reinforcements during the mission also stop at this number.<\/td><td>200<\/td><\/tr><\/tbody><\/table>\n<p>How many enemies: Expected Players x Difficulty. If that is 10 or less, 20 is used. The result is multiplied by Mission Size. If the estimate would go over Max AI Units, the number is lowered to fit. The cap is hard: the wizard counts every man it actually places (crews too), cuts infantry groups down to fit, skips vehicles that don't fit, and keeps room so every objective gets at least a few guards. During the mission GAIA sends no reinforcements once the enemy side is at the cap.<\/p>\n<h3>Factions<\/h3>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Enemy Faction<\/td><td>The faction players fight. The enemy side comes from the faction. Groups come from CfgGroups, single units and vehicles from CfgVehicles.<\/td><td>OPFOR <code>OPF_F<\/code><\/td><\/tr><tr><td>Player Faction<\/td><td>The players' faction. It decides who gets the tasks and briefing, the hostage faction and who sets off IEDs. Must be on a different side from the enemy.<\/td><td>BLUFOR <code>BLU_F<\/code><\/td><\/tr><tr><td>Civilian Faction<\/td><td>Civilians for CQB, hostages, suicide bombers and armed civilians.<\/td><td><code>CIV_F<\/code><\/td><\/tr><\/tbody><\/table>\n<p>The faction lists show every faction that has at least one playable-scope soldier, as \"SIDE - Name (class)\". This includes factions from mods you have loaded. The list is built once per game session. If you load a new mod, restart the game to see its factions. A faction saved in the mission whose mod is no longer loaded shows as \"(not loaded)\", and Generate stops with a message instead of using another faction.<\/p>\n<p>Every enemy unit, group, vehicle, crew, HVT, objective target, artillery piece, CAS plane and reinforcement comes from the enemy faction you pick. If the faction has no armor, artillery, AA or planes, that part is skipped; it is never filled from another faction. A Destroy objective the faction can't fill becomes a weapons cache. If a mod vehicle comes with another faction's crew, MCC swaps the crew for the faction's own men at mission start.<\/p>\n<h3>Objectives<\/h3>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Number of Objectives<\/td><td>How many of the 8 objective slots are used. Slots set to None are skipped.<\/td><td>3<\/td><\/tr><tr><td>Objective 1 to Objective 8<\/td><td>The type of each objective. <strong>Random<\/strong> picks a type not used yet in this mission.<\/td><td>Random<\/td><\/tr><\/tbody><\/table>\n<p>Objective types:<\/p>\n<table><thead><tr><th>Type<\/th><th>What players do<\/th><th>Done when<\/th><th>Failed when<\/th><\/tr><\/thead><tbody><tr><td>Secure HVT (hostage rescue)<\/td><td>Find a tied up hostage (a soldier of your faction or a civilian), untie him and take him home<\/td><td>He is alive, freed and more than 300 m from where he was held<\/td><td>He dies<\/td><\/tr><tr><td>Kill HVT<\/td><td>Kill or capture an enemy officer with 1 to 4 bodyguards. In the open he may walk a patrol.<\/td><td>He is dead, captive, handcuffed (ACE) or disarmed<\/td><td>-<\/td><\/tr><tr><td>Destroy Vehicle<\/td><td>Destroy a locked prototype tank or aircraft, in a sandbag nest or a hangar<\/td><td>It is destroyed<\/td><td>-<\/td><\/tr><tr><td>Destroy AA<\/td><td>Destroy a crewed anti-air vehicle<\/td><td>It is destroyed<\/td><td>-<\/td><\/tr><tr><td>Destroy Artillery<\/td><td>Destroy a crewed artillery piece<\/td><td>It is destroyed<\/td><td>-<\/td><\/tr><tr><td>Destroy Weapon Cache<\/td><td>Destroy an ammo cache<\/td><td>It is destroyed<\/td><td>-<\/td><\/tr><tr><td>Destroy Fuel Depot<\/td><td>Destroy a fuel tank<\/td><td>It is destroyed<\/td><td>-<\/td><\/tr><tr><td>Destroy Radar/Radio<\/td><td>Destroy a radar or a radio tower<\/td><td>It is destroyed<\/td><td>-<\/td><\/tr><tr><td>Acquire Intel<\/td><td>Pick up an intel item (files, photos, laptop, phone or suitcase) from a small table<\/td><td>The item is picked up<\/td><td>The item is destroyed<\/td><\/tr><tr><td>Download Intel<\/td><td>Hack a data terminal and download the data<\/td><td>The download is done<\/td><td>The terminal is destroyed<\/td><\/tr><tr><td>Capture Area<\/td><td>Clear an enemy camp, or a building in CQB<\/td><td>No enemy left within 100 m (50 m in CQB), checked after 30 s<\/td><td>-<\/td><\/tr><tr><td>Disarm IED<\/td><td>Find and disarm a large IED device (60 s disarm time)<\/td><td>Disarmed and not set off<\/td><td>The device is destroyed<\/td><\/tr><\/tbody><\/table>\n<p>In open terrain, most objectives come with a camp or outpost composition. In CQB the objective goes in or next to a building.<\/p>\n<p>The classes used for HVTs, tanks, aircraft, AA, artillery, caches, fuel tanks, radars, radio towers, intel items and compositions come from the <strong>MCC Mission Wizard<\/strong> settings. The wizard reads them in this order: the value in <strong>MCC 5 Mission Settings<\/strong> for this mission, then the CBA setting, then the preset for your loaded mods (RHS, CUP), then the built-in default. Only classes that exist in your game are used. Where possible, the enemy side's own vehicles are picked first. See <a href=\"settings.md#mcc-mission-wizard\">Settings<\/a>.<\/p>\n<h3>Enemy forces and threats<\/h3>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>CQB<\/td><td>Urban mission. Enemies garrison buildings and objectives go in buildings. <strong>With civilians<\/strong> also puts civilians in buildings. Choices: No, Yes - without civilians, Yes - with civilians, Random.<\/td><td>Random<\/td><\/tr><tr><td>Enemy Vehicles<\/td><td>Light and motorized enemy vehicles patrolling. No, Yes, Random.<\/td><td>Random<\/td><\/tr><tr><td>Enemy Armor<\/td><td>Armored and mechanized enemy groups.<\/td><td>Random<\/td><\/tr><tr><td>Stealth<\/td><td>Black ops. Enemies start relaxed (SAFE, slow). If Weather / Time changes the time, the mission is at night.<\/td><td>Random<\/td><\/tr><tr><td>IEDs<\/td><td>MCC IEDs on the roads in the area.<\/td><td>Random<\/td><\/tr><tr><td>Suicide Bombers<\/td><td>Civilian suicide bombers.<\/td><td>Random<\/td><\/tr><tr><td>Armed Civilians<\/td><td>Civilians that draw weapons on the players.<\/td><td>Random<\/td><\/tr><tr><td>Roadblocks<\/td><td>Manned checkpoints on roads leading into the area.<\/td><td>Random<\/td><\/tr><tr><td>Animals<\/td><td>Ambient animals (vanilla goat, poultry and sheep modules).<\/td><td>Random<\/td><\/tr><tr><td>Reinforcements<\/td><td>No, Aerial, Motorized, Random. Any choice other than No turns on GAIA AI reinforcement requests for this mission. Motorized also places a motorized QRF group outside the area.<\/td><td>Random<\/td><\/tr><tr><td>Enemy Artillery<\/td><td>No, Mortars, Self propelled artillery, Random. Places artillery in the area and turns on GAIA AI artillery requests.<\/td><td>Random<\/td><\/tr><\/tbody><\/table>\n<h3>Weather, briefing and markers<\/h3>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Weather / Time<\/td><td><strong>Don't change<\/strong>, <strong>Random<\/strong>, <strong>Sandstorm<\/strong>, <strong>Blizzard<\/strong>, <strong>Snow<\/strong>. Changes the scenario date, time and weather in Attributes &gt; Environment. Sandstorm, Blizzard and Snow also add the MCC weather effect at mission start.<\/td><td>Don't change<\/td><\/tr><tr><td>Intro<\/td><td><strong>Cinematic<\/strong>: a camera flies over the area with music while the operation screen plays. <strong>Title card<\/strong>: the same screen over the player's own view. <strong>None<\/strong>. Every AI group (both sides) holds fire until the screen ends.<\/td><td>Cinematic<\/td><\/tr><tr><td>Precise Objective Markers<\/td><td>On: the task points at the exact objective. Off: the task points somewhere within 300 m.<\/td><td>On<\/td><\/tr><tr><td>General Markers<\/td><td>Also place map markers for the objective zones, roadblocks and enemy positions. Players see them.<\/td><td>Off<\/td><\/tr><tr><td>Briefing<\/td><td>Add the generated briefing to the players' map (Diary).<\/td><td>On<\/td><\/tr><tr><td>Player Start<\/td><td><strong>None (place your own)<\/strong> or <strong>Respawn marker outside the area<\/strong>.<\/td><td>None<\/td><\/tr><tr><td>End Mission When Done<\/td><td>When every objective is done, the scenario ends (END1).<\/td><td>Off<\/td><\/tr><\/tbody><\/table>\n<h2>Mission area<\/h2>\n<p>With <strong>Mission Area<\/strong> set to the first option:<\/p>\n<ul><li><strong>One trigger selected<\/strong>: its area is used, including its rotation and shape. If the trigger is smaller than 20 m on a side, the radius is used instead.<\/li><li><strong>One area marker selected<\/strong> (rectangle or ellipse, at least 20 m): its area is used. Other markers only give the center.<\/li><li><strong>Nothing selected<\/strong>: the point at the center of the screen, with the radius.<\/li><\/ul>\n<p><strong>Whole map<\/strong> picks a random named place that is not in the water. With CQB it only picks cities and villages. Without CQB it can also pick local names and hills.<\/p>\n<p>The center of the area must be on land. Otherwise you get \"the center of the mission area is in the water\".<\/p>\n<h2>What Generate builds<\/h2>\n<p>Everything goes into a root layer called <strong>MCC Mission Wizard<\/strong>. If one already exists, the new one is called \"MCC Mission Wizard 2\", and so on. It has five sub-layers:<\/p>\n<table><thead><tr><th>Layer<\/th><th>What's inside<\/th><\/tr><\/thead><tbody><tr><td>Area and zones<\/td><td>The operation marker (red border, named \"Operation NAME\" or \"Black Ops: NAME\"), the main zone<\/td><\/tr><tr><td>Objectives<\/td><td>Objective objects and units, compositions, guards, objective zones<\/td><\/tr><tr><td>Enemy forces<\/td><td>Patrols, garrisons, vehicles, armor, artillery, static weapons, roadblocks, the QRF<\/td><\/tr><tr><td>Civilians, IEDs and animals<\/td><td>Civilians, IED objects and modules, suicide bombers, armed civilians, animal modules<\/td><\/tr><tr><td>Tasks, triggers and briefing<\/td><td>Task logics, task triggers, briefing, intro, weather effect, end trigger<\/td><\/tr><\/tbody><\/table>\n<h3>Zones and GAIA<\/h3>\n<p>Each zone is built the way you would do it by hand: a <strong>trigger<\/strong> (the zone area) synced to a <strong>Create Zone<\/strong> module. There is one main zone for the whole area and one zone per objective.<\/p>\n<p>Each enemy group is synced to an <strong>Assign AI to zone<\/strong> module of its zone. There is one such module per behaviour (aggressive, defensive, fortify). At mission start, GAIA takes the groups over in their zones.<\/p>\n<p>The groups' own \"MCC: GAIA Control\" attributes are not used here, because the zone numbers only exist once the mission runs. To change a group's behaviour, sync its leader to another Assign AI to zone module of the same zone.<\/p>\n<h3>Objectives<\/h3>\n<p>For each objective:<\/p>\n<ul><li>The objective object or unit.<\/li><li>Guards in nearby buildings (fortify). If there are no buildings, a defending group next to it.<\/li><li>Infantry patrols in the objective zone, about 20% of the enemy force per objective.<\/li><li>In CQB, more garrison units. With civilians, civilians in nearby buildings.<\/li><li>With General Markers on, a marker on the objective zone.<\/li><li>A task.<\/li><\/ul>\n<h3>Main area forces<\/h3>\n<ul><li>Infantry patrols (about 20% of the force, 10% in CQB).<\/li><li>CQB garrisons in buildings.<\/li><li>Light vehicles (up to 6) and armor (up to 4), on roads where possible.<\/li><li>Artillery: 1 to 2 mortars, or 1 self propelled gun.<\/li><li>Static weapons, in about 70% of missions (1 to 3).<\/li><li>Roadblocks: up to 3, on roads entering the area. Each has barriers, a bunker, lights, 3 guards and a static weapon when the faction has one.<\/li><li>IEDs: 2 to 8 on roadsides, hidden in junk or a parked civilian car, each with an MCC IED module.<\/li><li>Suicide bombers and armed civilians: civilians with the matching MCC module synced.<\/li><li>Animals.<\/li><li>The motorized QRF, outside the area, when Reinforcements is Motorized.<\/li><\/ul>\n<p>With Stealth on, every group's leader gets an init line that sets the group to SAFE and slow speed.<\/p>\n<h3>Tasks<\/h3>\n<p>Each task is made from editor objects you can read and change:<\/p>\n<ul><li>A <strong>Game Logic<\/strong> whose init creates the task on the server for the player side.<\/li><li>A <strong>server-only trigger<\/strong> that sets the task to Succeeded when its condition is true.<\/li><li>For some objectives, a second trigger that sets it to Failed.<\/li><\/ul>\n<p>With more than one objective there is also a parent \"operation\" task. An end trigger waits until every task is done. Then it marks the operation done and plays the \"mission accomplished\" sound. With <strong>End Mission When Done<\/strong> on, it also ends the scenario.<\/p>\n<h3>The operation screen<\/h3>\n<p>At mission start the players of the player side see the operation screen:<\/p>\n<ul><li>Black bars slide in. With <strong>Cinematic<\/strong>, a camera slowly circles the operation area and music plays.<\/li><li>The operation name types in large letters, with the place, the date, the time and the grid.<\/li><li>A panel lists the enemy, the time and weather, the grid and the objectives.<\/li><li>A red <strong>WEAPONS HOLD<\/strong> countdown runs, then turns green: <strong>WEAPONS FREE<\/strong>.<\/li><\/ul>\n<p>While it plays, every AI group on every side is on hold fire and the players can't fire. When all players of the side have seen it (at most 90 seconds), every group gets its old combat mode back. Players who join more than 5 minutes into the mission don't get the screen.<\/p>\n<h3>Briefing, intro, weather and support<\/h3>\n<ul><li><strong>Briefing<\/strong>: a logic adds a diary entry for the player side, with the enemy, threats and the objective list with grid references.<\/li><li><strong>Intro<\/strong>: a logic starts the operation screen at mission start. See <a href=\"#the-operation-screen\">The operation screen<\/a>.<\/li><li><strong>Weather / Time<\/strong>: sets the scenario date, time, overcast, fog and rain. Sandstorm, Blizzard and Snow add a logic for the effect.<\/li><li><strong>Reinforcements<\/strong> or <strong>Enemy Artillery<\/strong> other than No set <strong>GAIA: AI Support Requests<\/strong> to On in MCC 5 Mission Settings, plus <strong>AI Reinforcements<\/strong> and/or <strong>AI Artillery<\/strong>.<\/li><li><strong>Player Start<\/strong>: a respawn marker for the player side called \"MW Start\", on flat land outside the area.<\/li><\/ul>\n<p>All entity names start with <code>mcc5mw_<\/code> plus a random number per generation, so a second generated mission never clashes with the first.<\/p>\n<h2>Clear, Regenerate and Undo<\/h2>\n<ul><li><strong>Ctrl+Z<\/strong> right after Generate undoes the whole generation in one step.<\/li><li><strong>MCC 5 &gt; Clear Generated Mission<\/strong> deletes every entity in all layers whose name starts with \"MCC Mission Wizard\", and the layers. This is also one undo step.<\/li><li><strong>MCC 5 &gt; Regenerate Mission (clear + generate)<\/strong> clears, then generates again.<\/li><\/ul>\n<p>Anything you put into an \"MCC Mission Wizard\" layer yourself is deleted by Clear too. Move things you want to keep to another layer first.<\/p>\n<h2>Tips<\/h2>\n<ul><li>Start small. Use Normal size and 2 or 3 objectives, then grow.<\/li><li>Watch <strong>Max AI Units<\/strong>. If the notification says \"Unit cap reached\", some groups were not placed. Raise the cap or lower players, difficulty or size.<\/li><li>A trigger gives you the most control over the area shape.<\/li><li>Generate several times until you like the layout. Then edit by hand.<\/li><li>Check the task triggers in the <strong>Tasks, triggers and briefing<\/strong> layer if you want to change win or fail rules.<\/li><li>The editor wizard settings are only used in the editor. The generated objects carry everything the mission needs.<\/li><\/ul>\n<h3>Error messages<\/h3>\n<table><thead><tr><th>Message<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>every objective slot is None<\/td><td>Set at least one objective in MCC 5 &gt; Mission Wizard...<\/td><\/tr><tr><td>enemy faction X has no soldiers<\/td><td>Pick another enemy faction<\/td><\/tr><tr><td>the enemy faction and the player faction are on the same side<\/td><td>Pick factions on different sides<\/td><\/tr><tr><td>the center of the mission area is in the water<\/td><td>Move the camera or select a trigger on land<\/td><\/tr><tr><td>no mission area found<\/td><td>Select a trigger or marker, or use Camera view<\/td><\/tr><tr><td>generation failed - see the RPT log<\/td><td>Check the RPT for lines starting with \"MCC Mission Wizard\"<\/td><\/tr><\/tbody><\/table>\n<p>Parts that fail on their own (for example \"roadblocks\" or \"objective 2 (Kill HVT): no position\") are listed as <strong>Skipped<\/strong> in the notification. The rest is still built.<\/p>\n<h2>The Zeus Mission Wizard<\/h2>\n<p>In game, a Zeus player can place the <strong>Mission Wizard<\/strong> Zeus module. It opens a dialog and then generates a mission live on the server.<\/p>\n<p>Dialog options:<\/p>\n<ul><li><strong>Area<\/strong>: Around this position, or Anywhere on the map<\/li><li><strong>Search radius (m)<\/strong>: 500, 1000, 2000, 3000, 5000<\/li><li><strong>Enemy faction<\/strong>, <strong>Players' faction<\/strong> (default: your own faction), <strong>Civilians faction<\/strong><\/li><li><strong>Players<\/strong>: 5 to 80<\/li><li><strong>Difficulty<\/strong>: Easy, Medium, Hard<\/li><li><strong>Objective 1<\/strong>, <strong>Objective 2<\/strong>, <strong>Objective 3<\/strong><\/li><li><strong>Terrain<\/strong>: Open terrain, CQB, CQB with civilians, Random<\/li><li><strong>Stealth<\/strong>, <strong>IEDs<\/strong>, <strong>Suicide bombers<\/strong>, <strong>Armed civilians<\/strong>, <strong>Roadblocks<\/strong>, <strong>Vehicles<\/strong>, <strong>Armor<\/strong>, <strong>Animals<\/strong>: Random, Yes, No<\/li><li><strong>Reinforcements<\/strong>: No, Aerial, Motorized, Random<\/li><li><strong>Artillery<\/strong>: No, Mortars, Self propelled, Random<\/li><li><strong>Weather<\/strong>: Don't change, Random, Sandstorm, Blizzard, Snow<\/li><li><strong>Intro<\/strong>: Cinematic (operation screen with a camera over the area and music), Intro only (operation screen over your own view), None. Every AI group holds fire until the screen ends; the map briefing opens after it.<\/li><li><strong>Precise objective markers<\/strong>, <strong>Debug markers<\/strong><\/li><\/ul>\n<p>Objectives beyond 3, the mission size and the unit cap come from the CBA settings <strong>Max objectives<\/strong>, <strong>Mission size<\/strong> and <strong>Max spawned units<\/strong> (or the matching MCC 5 Mission Settings).<\/p>\n<p>Only one mission is generated at a time. If you try while one is generating you get \"MCC is generating a mission, try again later\". If you place it right at mission start you may see \"MCC factions are not ready yet\". Wait a moment and try again.<\/p>\n<h2>The Mission Wizard Eden module (runtime)<\/h2>\n<p>The <strong>Mission Wizard<\/strong> Eden module (<strong>MCC 5 &gt; Place MCC Module &gt; Mission Wizard (generated at mission start)<\/strong>) generates a new random mission on the server each time the mission starts. Nothing is visible in the editor.<\/p>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Mission Area<\/td><td><strong>Area (synced trigger or module area)<\/strong>: a random spot inside a synced trigger, or the module's own area (750 m by default). <strong>Exact (around the module)<\/strong>: objectives around the module. <strong>Whole map<\/strong>.<\/td><td>Area<\/td><\/tr><tr><td>Start Delay (s)<\/td><td>Seconds after mission start before generating<\/td><td>5<\/td><\/tr><tr><td>Mission ID<\/td><td>Optional. While the mission runs, <code>MCC_MWMissionRuning_&lt;ID&gt;<\/code> is true. Empty: edenMW_1, edenMW_2...<\/td><td>empty<\/td><\/tr><tr><td>Expected Players<\/td><td>Players the mission is built for<\/td><td>10<\/td><\/tr><tr><td>Difficulty<\/td><td>Easy, Medium, Hard<\/td><td>Medium<\/td><\/tr><tr><td>Objectives<\/td><td>Use MCC setting, or 1 to 8. Objectives above 3 are random.<\/td><td>Use MCC setting<\/td><\/tr><tr><td>Objective 1 / 2 / 3<\/td><td>Objective types<\/td><td>Random, Random, None<\/td><\/tr><tr><td>Enemy Faction<\/td><td>CfgFactionClasses class name<\/td><td><code>OPF_F<\/code><\/td><\/tr><tr><td>Player Faction<\/td><td>CfgFactionClasses class name<\/td><td><code>BLU_F<\/code><\/td><\/tr><tr><td>Civilian Faction<\/td><td>CfgFactionClasses class name<\/td><td><code>CIV_F<\/code><\/td><\/tr><tr><td>CQB<\/td><td>No, Yes - without civilians, Yes - with civilians, Random<\/td><td>Random<\/td><\/tr><tr><td>Enemy Vehicles, Enemy Armor, Stealth, IEDs, Suicide Bombers, Armed Civilians, Roadblocks, Animals<\/td><td>No, Yes, Random<\/td><td>Random<\/td><\/tr><tr><td>Reinforcements<\/td><td>No, Aerial, Motorized, Random<\/td><td>Random<\/td><\/tr><tr><td>Enemy Artillery<\/td><td>No, Mortars, Self propelled artillery, Random<\/td><td>Random<\/td><\/tr><tr><td>Weather / Time<\/td><td>Don't change, Random, Sandstorm, Blizzard, Snow<\/td><td>Don't change<\/td><\/tr><tr><td>Intro<\/td><td>Cinematic, Pop-up (the operation screen without the camera), None<\/td><td>Cinematic<\/td><\/tr><tr><td>Precise Objective Markers<\/td><td>Exact spot or an area marker<\/td><td>On<\/td><\/tr><tr><td>General Markers<\/td><td>Show the general enemy area markers<\/td><td>Off<\/td><\/tr><\/tbody><\/table>\n<p>Notes:<\/p>\n<ul><li>No MCC zones are needed. The wizard makes its own.<\/li><li>Several modules queue. Only one mission is generated at a time.<\/li><li>The module stores <code>MCC_MWstate<\/code>: waiting, generating, running or failed. Use it, or <code>MCC_MWMissionRuning_&lt;Mission ID&gt;<\/code>, in triggers.<\/li><li>Mission size and the unit cap come from the MCC Mission Wizard settings.<\/li><li>If the enemy faction class does not exist, or has no infantry, nothing is generated and the RPT says why.<\/li><\/ul>\n<p>For a campaign of many missions in a row, see <a href=\"campaign.md\">Campaign<\/a>.<\/p>", "zeus-tools": "<h1>Zeus tools<\/h1>\n<p>In MCC 5, Zeus is how you use MCC in game. The old MCC main menu (\"--= MCC =--\" action) is gone. Everything it did is now in Zeus modules.<\/p>\n<h2>Who gets Zeus<\/h2>\n<p>With the setting <strong>Zeus for MCC users<\/strong> on (the default), every player who is allowed to use MCC gets Zeus with all MCC modules.<\/p>\n<p>A player is allowed to use MCC when:<\/p>\n<ul><li>there is no <strong>Access Rights<\/strong> module in the mission. Then everyone is allowed by default.<\/li><li>or the mission has an <strong>Access Rights<\/strong> module, and the player's UID is listed in it, or his unit is synced to it, or he is a logged-in admin and the module allows admins.<\/li><li>The host and the server are always allowed.<\/li><\/ul>\n<p>Details:<\/p>\n<ul><li>The server checks every 10 seconds and gives Zeus to allowed players. This happens once the player's client is ready, so it can take a few seconds after you spawn.<\/li><li>The first player gets MCC's own Zeus (so MCC save/load keeps working). Every other player gets his own Zeus with all addons.<\/li><li>You keep your Zeus across respawn and reconnect.<\/li><li>Players who already have a Zeus (for example from an Eden <strong>Game Master<\/strong> module) are left alone.<\/li><li>If a player stops being allowed, or the setting is turned off, MCC takes back only the Zeus it gave.<\/li><li>Every 20 seconds, objects that one MCC Zeus can edit are shared with all MCC Zeus players.<\/li><\/ul>\n<p>Turn it off with <strong>Zeus for MCC Users<\/strong> in MCC 5 Mission Settings, or the CBA setting <strong>Zeus for MCC users<\/strong>. See <a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a>.<\/p>\n<h2>Opening Zeus<\/h2>\n<ul><li><strong>Ctrl+Delete<\/strong>: the MCC keybind \"Open Zeus (MCC)\". You can change it in CBA keybinds (MCC section). If you have no Zeus, you get \"MCC: you have no Zeus access\" in chat.<\/li><li><strong>Y<\/strong>: the normal Arma Zeus key.<\/li><\/ul>\n<h2>Where the MCC tools are<\/h2>\n<p>Every MCC tool is a Zeus module. Open the <strong>Modules<\/strong> tab on the right of the Zeus screen and look under the categories that start with <strong>MCC<\/strong>.<\/p>\n<ul><li>Most modules: drag one onto the map where you want it. Its options open.<\/li><li>Modules that act on one unit, group or object: drag the module and drop it <strong>onto<\/strong> that unit. The tables below say which ones.<\/li><\/ul>\n<h2>Right-click menu on AI units<\/h2>\n<p>Right-click an AI soldier (the leader or anyone in the squad) to open the MCC menu for his whole group:<\/p>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><\/tr><\/thead><tbody><tr><td>GAIA: Control Group<\/td><td>GAIA takes the group, works through your side's tasks (nearest first), then patrols.<\/td><\/tr><tr><td>GAIA: Attack Area<\/td><td>GAIA attacks and patrols the nearest zone with the group. A zone is made if there is none.<\/td><\/tr><tr><td>GAIA: Defend Area<\/td><td>GAIA holds the nearest zone with the group.<\/td><\/tr><tr><td>Player Control Group<\/td><td>GAIA lets go of the group and clears its waypoints. You (or the players) control it again.<\/td><\/tr><\/tbody><\/table>\n<p>How it works:<\/p>\n<ul><li>Click, don't hold. Holding the right button still moves the camera.<\/li><li>The menu opens when nothing is selected, or when the unit you right-click is in a group you have selected. All selected groups get the order.<\/li><li>If you have one group selected and right-click a different unit, Zeus gives the normal waypoint instead.<\/li><li>The top line shows the group name and who controls it now (GAIA or Player).<\/li><li>Groups led by a player can't be given to GAIA.<\/li><li>With <strong>ZEN<\/strong> (Zeus Enhanced) loaded, the same options are in the ZEN right-click menu under <strong>MCC 5<\/strong>. ZEN only opens its menu when no AI is selected, so click empty ground first to clear the selection.<\/li><\/ul>\n<p>Most modules open a dialog, do their job and then delete themselves.<\/p>\n<h2>(MCC) General<\/h2>\n<table><thead><tr><th>Module<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Mission Wizard<\/td><td>Generates a whole mission live. Place it where you want the mission, or pick \"Anywhere on the map\". See <a href=\"mission-wizard.md#the-zeus-mission-wizard\">Mission Wizard<\/a>.<\/td><\/tr><tr><td>Artillery Fire Mission<\/td><td>Pick Shell type, Spread, Rounds and Delay. <strong>Action<\/strong>: \"Fire now at this position\", or \"Add shells to a side's artillery console\" (then pick the Console side: West, East or Resistance).<\/td><\/tr><tr><td>Convoy - Spawn<\/td><td>Spawns an MCC convoy of up to 5 vehicles at the module, facing the Heading you pick. Page 1: Faction and Heading. Page 2: the vehicles, an optional HVT and HVT vehicle. The HVT rides in the middle vehicle.<\/td><\/tr><tr><td>Convoy - Drive To<\/td><td>Place it where the convoy should go and confirm. The last spawned convoy fills its cargo seats and drives there in column. Add more Zeus waypoints to its group afterwards if you like.<\/td><\/tr><tr><td>Air Drop (Crates/Vehicles)<\/td><td><strong>Delivery<\/strong>: Parachute from helicopter, Slingload (one object), or Parachute (no aircraft). <strong>Cargo<\/strong>: Supply crates or Vehicles. Pick Faction, Amount (1 to 6), Approach from, then the object. <strong>Action<\/strong>: Drop now, or add it to the faction side's commander console. Heavy vehicles may be too heavy to slingload.<\/td><\/tr><tr><td>Reinforcements (Air/Motorized)<\/td><td>Calls AI reinforcements to the module. <strong>Type<\/strong>: Paradrop, Drop-off or Fast-rope (small Spec-Ops, medium QRF, large Airborne), or Motorized (small, medium, large). Pick Faction, Coming from, Start distance (1000 to 3000 m) and Behavior after landing (Patrol around, Defend, Seek &amp; destroy, or GAIA aggressive / defensive / fortify in a zone). Type an <strong>MCC zone number<\/strong> for the GAIA choices and for motorized. Motorized needs a road near the start point.<\/td><\/tr><tr><td>Paradrop Units/Players<\/td><td><strong>Who<\/strong>: the group the module was placed on, All players, or all West, East or Independent players. <strong>Method<\/strong>: Parachute, Drop pods or H.A.L.O. <strong>Coming from<\/strong>: a heading. Drop it on a unit to drop his group.<\/td><\/tr><tr><td>Delete / Area Brush<\/td><td>Runs an action in a radius (10 to 2000 m) around the module. Actions: Delete All, Delete All Units, Delete Man, Delete Vehicles, Delete Tanks, Delete Air, Delete Ammoboxes, Delete Markers, Lights (Off), Lights (On), Lock Doors (All), Unlock Doors (All), Lock Doors (Random), Atmosphere (Warzone, Sandstorm, Blizzard, Snow, Heatwave, Clear), Remove N/V from units, Add Flashlights to all units, Delete Bodies. <strong>Skip players<\/strong> applies to N/V and flashlights. Players and their vehicles are never deleted.<\/td><\/tr><tr><td>Jukebox<\/td><td><strong>Type<\/strong>: Music or Sound. <strong>Action<\/strong>: Play to everyone now, Stop music for everyone, or Play when an area trigger activates (set the trigger radius, activated by and condition). Then pick the track.<\/td><\/tr><tr><td>Make Hostage<\/td><td>Place a unit first, then drop this on it. The unit becomes a tied up hostage that players can untie, like the Mission Wizard HVT.<\/td><\/tr><tr><td>Briefing<\/td><td>Adds a diary entry under Briefing. Pick the Section (Situation, Enemy Forces, Friendly Forces, Mission, Special Tasks, Fire Support), For (Everyone, West, East, Independent, Civilian) and type the Text. Players who join later get it too.<\/td><\/tr><tr><td>Broadcast Message<\/td><td>Shows a text to every player. <strong>Style<\/strong>: Small (bottom) or Big (center).<\/td><\/tr><tr><td>Save / Load Mission<\/td><td>Opens the MCC save/load screen: save to profile slots or the clipboard, load, export to SQM or a composition, turn the persistent database on or clear it.<\/td><\/tr><tr><td>Start Location / FOB<\/td><td>Builds a start location at the module. Pick Side, Type (HQ start location or FOB respawn point), At mission start (Teleport, None, Paradrop, HALO), FOB can be destroyed, Show HQ icon (3D).<\/td><\/tr><tr><td>Respawn / Mission Start<\/td><td><strong>Action<\/strong>: Teleport players to their start location now, Start mission (disable respawn), or Enable/Disable role selection. Only a logged-in admin or the host can change role selection.<\/td><\/tr><tr><td>Arsenal (Zeus Player)<\/td><td>Closes Zeus and opens the full Virtual Arsenal for your own unit.<\/td><\/tr><tr><td>CAS for Commander Console<\/td><td>Gives a side's commander console a CAS, AC-130 or UAV call. Pick Side, Aircraft and CAS type. AC-130 needs an armed VTOL or gunship; UAV needs a drone. To fire CAS right now, use <strong>CAS - MCC<\/strong> instead.<\/td><\/tr><tr><td>GAIA: Control Group<\/td><td>Drop it on an AI group, or select AI groups first and then place it. GAIA takes those groups over. See <a href=\"#gaia-control-group\">GAIA: Control Group<\/a>.<\/td><\/tr><tr><td>(Settings) MCC, (Settings) GAIA, (Settings) UI, (Settings) Mechanics, (Settings) Medic, (Settings) Role Selection<\/td><td>Open a dialog to change those MCC settings during the mission.<\/td><\/tr><tr><td>Survival: Spawn loot in buildings<\/td><td>Spawns loot crates in buildings around the module. Options: Radius, Density (1 to 10), Markers.<\/td><\/tr><\/tbody><\/table>\n<h2>(MCC) AI<\/h2>\n<table><thead><tr><th>Module<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Assign AI to zone<\/td><td>Drop it on a unit or group. Pick the <strong>Zone<\/strong> from the list of existing MCC zones and the <strong>Behavior<\/strong>: aggressive, Defensive, Fortify, Default, BIS Defence, BIS Patrol. The group is put under GAIA in that zone. For real GAIA control pick one of the first three.<\/td><\/tr><tr><td>Create Zone<\/td><td>Makes a new MCC zone at the module, or moves an existing one. Pick the Zone (\"New\" or a number), size X, size Y (default 2000) and Angle.<\/td><\/tr><tr><td>Respawn Group<\/td><td>Drop it on a group or unit and set <strong>Respawns<\/strong> (default 10). The group respawns when all its units are dead.<\/td><\/tr><tr><td>Ambient Units<\/td><td>Ambient civilians around players. Options: Ambient Civilians, Ambient Driving Cars, Ambient Parked Cars, Parked cars always locked, Spawn distance around the players, Max units spawned around the player, Faction, Car's Faction, Civilians Reaction to players, Civilians Always Friendly. It runs on the server for each player and uses CPU.<\/td><\/tr><tr><td>Ambient units(Restrict)<\/td><td>Stops ambient AI spawning within a <strong>Radius<\/strong> of the module.<\/td><\/tr><tr><td>Make Evac Vehicle<\/td><td>Drop it on a vehicle. It becomes an MCC AI evac vehicle that players can command. Options: Side, Add gunners, Campaign Evac.<\/td><\/tr><tr><td>Garrison<\/td><td>Fills buildings around the module with units. Options: Faction, Radius, Population Intensity, Parked Cars, Cars Always Locked, One Group Per House.<\/td><\/tr><tr><td>Set Unconscious<\/td><td>Drop it on an AI man. Options: Disable Bleeding, Force Unconscious. Needs the MCC medical system.<\/td><\/tr><tr><td>Undercover Agents<\/td><td>Drop it on a player's unit. AI won't be hostile to him unless he gets too close, shows a weapon, or runs or crouches in their sight. He can hide handguns and small weapons. <strong>Remove Weapons<\/strong> takes his weapons away at the start.<\/td><\/tr><\/tbody><\/table>\n<h2>(MCC) Ordnance<\/h2>\n<table><thead><tr><th>Module<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>CAS - MCC<\/td><td>Calls an MCC close air support run at the module. Pick the Plane and the CAS type.<\/td><\/tr><tr><td>IED/Suicide Bomber<\/td><td>Drop it on an object to make an IED: Explosion Size, Explosion Effect, Disarm Time, Can be jammed using ECM vehicle, Activation Type, Activation Distance, Activation Side. Drop it on a unit to make a suicide bomber: Explosion Size, Explosion Effect, Activation Side.<\/td><\/tr><tr><td>Armed Civilian<\/td><td>Drop it on a unit. Pick the Attack Side and Patrol. The unit will draw a weapon on that side.<\/td><\/tr><\/tbody><\/table>\n<h2>(MCC) Utility<\/h2>\n<table><thead><tr><th>Module<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Add To Zeus<\/td><td>Adds (or removes) all units and objects in a <strong>Radius<\/strong> (default 100 m) around the module to every Zeus.<\/td><\/tr><tr><td>Rearm Area<\/td><td>Drop it on an object (or place it on its own). That object becomes a place where aircraft can change their pylons, rearm, refuel and repair.<\/td><\/tr><tr><td>Load to Cargo<\/td><td>Drop it on an object, then click near the vehicle (within 15 m) to load the object into its cargo. Uses ACE cargo when ACE cargo is loaded, else MCC logistics.<\/td><\/tr><tr><td>Intel<\/td><td>Drop it on an object or unit. Options: Shared With, Title, Text, Marker Name, Delete Object After. Players can pick up the intel.<\/td><\/tr><tr><td>Damage Part<\/td><td>Drop it on a vehicle and pick which part to hit.<\/td><\/tr><tr><td>Doors Lock/Unlock<\/td><td>Locks or unlocks doors in a <strong>Radius<\/strong> around the module.<\/td><\/tr><\/tbody><\/table>\n<h2>(MCC) Ships Static<\/h2>\n<table><thead><tr><th>Module<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Spawn Ship<\/td><td>Spawns a static ship that acts as a base. Options: Ship Side, Respawn Position, Ship Type, Ship Name, Vehicles Purchasing, Rearm and Refuel. The LHD needs CUP.<\/td><\/tr><tr><td>Open Menu<\/td><td>Opens the ship spawn menu.<\/td><\/tr><\/tbody><\/table>\n<h2>(MCC) RTS<\/h2>\n<table><thead><tr><th>Module<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Campaign init<\/td><td>Starts an MCC campaign. Needs an MCC Start Location. See <a href=\"campaign.md\">Campaign<\/a>.<\/td><\/tr><tr><td>Set Resources<\/td><td>Sets a side's Materials, Ammo, Fuel, Food and Meds.<\/td><\/tr><tr><td>Add Credits/Valor Points<\/td><td>Drop it on a player to give him <strong>Credits<\/strong> (default 5000). Place it on empty ground instead to give credits to every player of the <strong>Player Side<\/strong> you pick.<\/td><\/tr><tr><td>Add Credits To Players<\/td><td>The Eden version of the credits module, also usable from Zeus.<\/td><\/tr><tr><td>Create Building<\/td><td>Builds an RTS building right away. Pick Building and Side.<\/td><\/tr><tr><td>Vehicle Shop<\/td><td>Makes a vehicle kiosk. <strong>Type<\/strong>: Vehicles, Armored, Helicopters, Fixed Wing, Ships, Units. <strong>Side Purchase<\/strong>: buy from the whole side or only the faction.<\/td><\/tr><tr><td>Weapon Shop<\/td><td>Drop it on an ammo box. The box contents become the items for sale. Option: Prices.<\/td><\/tr><\/tbody><\/table>\n<h2>(MCC) Environment<\/h2>\n<table><thead><tr><th>Module<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Ambient Birds<\/td><td>Turns on random bird flocks near trees.<\/td><\/tr><tr><td>Ambient Fire<\/td><td>Turns on fires from explosives and fire fights that spread with the wind.<\/td><\/tr><tr><td>Atmosphere<\/td><td>Preset or custom atmosphere. Options include Random Weather, Dust, Snow, Papers, Mist, Fog, Leaves, Wind Sounds, Color, Film Grain, Overcast, Wind, Waves, Rain, Lightnings.<\/td><\/tr><tr><td>Night Effects<\/td><td>In a <strong>Radius<\/strong>: Lights Off, Remove Night Vision, Add Flashlights, Ignore Player's Units.<\/td><\/tr><tr><td>War Zone Atmosphere<\/td><td>Adds war zone effects in a <strong>Radius<\/strong> (default 1000 m).<\/td><\/tr><\/tbody><\/table>\n<h2>(MCC) PvP<\/h2>\n<table><thead><tr><th>Module<\/th><th>How to use it<\/th><\/tr><\/thead><tbody><tr><td>Capture Point<\/td><td>Creates a capture point. Options: Type (Ammo, Supply, Fuel, Tickets), Radius (default 300), Score Reward (default 50), Flag, UI, Owner.<\/td><\/tr><tr><td>AAS Spawn AI<\/td><td>Spawns AI that fight for Advance and Secure sectors. Set the AAS mission up in Eden with <strong>Advance And Secure init<\/strong>.<\/td><\/tr><\/tbody><\/table>\n<h2>GAIA: Control Group<\/h2>\n<p>This module gives any AI group to GAIA. It works for any side, also your own friendly AI.<\/p>\n<ol><li>Drop the module on an AI group. Or select one or more AI groups (or units) in Zeus, then place the module.<\/li><li>GAIA takes over at once. You get \"GAIA now controls N group(s)\".<\/li><\/ol>\n<p>What the group does:<\/p>\n<ul><li>It picks the <strong>nearest open task of its side<\/strong> that has a position on the map.<\/li><li>MCC makes sure an MCC zone covers that task (it creates a 200 m zone if none is within 400 m) and sends the group there as aggressive.<\/li><li>When the task is done, the group moves on to the next nearest open task.<\/li><li>With no tasks left, it patrols its last zone, or the nearest zone. If there is no zone at all, a 300 m zone is made around it.<\/li><li>It uses vehicles like any GAIA group. See <a href=\"gaia.md#vehicles\">GAIA AI<\/a>.<\/li><\/ul>\n<p>Limits:<\/p>\n<ul><li>Groups led by a player can't be given to GAIA. A player can be a member, but not the leader. You get \"groups led by a player can't be given to GAIA\".<\/li><li>Tasks are checked every 15 seconds.<\/li><\/ul>\n<h2>Editing objects in Zeus<\/h2>\n<p>When you double-click an object in Zeus, MCC shows its own edit window. Turn it off with the setting <strong>Disable MCC Zeus Edit<\/strong>. See <a href=\"settings.md#mcc-general\">Settings<\/a>.<\/p>", "gaia": "<h1>GAIA AI<\/h1>\n<p>GAIA is the MCC AI commander. You give AI groups a <strong>zone<\/strong> and a <strong>behaviour<\/strong>. GAIA then decides where each group goes: patrols, attacks on enemy contacts, building defence, vehicle use and calls for support.<\/p>\n<p>GAIA gives orders to groups and leaves the soldiers' own combat AI alone. With LAMBS Danger or HBQ Advanced Driving AI loaded, GAIA leaves unit combat or driving to those mods. See <a href=\"ai-mod-compatibility.md\">AI mod compatibility<\/a>.<\/p>\n<p>GAIA runs on the server. Groups can be moved to headless clients.<\/p>\n<h2>Zones<\/h2>\n<p>A zone is an area on the map with a number (1, 2, 3...). Every GAIA group belongs to one zone. There is no limit on the number of zones in MCC 5.<\/p>\n<p>Ways to make a zone:<\/p>\n<ul><li><strong>Eden<\/strong>: place a trigger, size it, and sync it to a <strong>Create Zone<\/strong> module. At mission start it gets the next free number.<\/li><li><strong>Zeus<\/strong>: place the <strong>Create Zone<\/strong> module, pick \"New\" (or an existing number to move it), set the size and angle.<\/li><li><strong>Mission Wizard<\/strong>: makes its own zones, one for the area and one per objective.<\/li><li><strong>GAIA: Control Group<\/strong> and the task follower make a zone when there is none nearby.<\/li><\/ul>\n<h2>Behaviours (intends)<\/h2>\n<table><thead><tr><th>Behaviour<\/th><th>Code name<\/th><th>What GAIA does with the group<\/th><\/tr><\/thead><tbody><tr><td>Aggressive<\/td><td><code>MOVE<\/code><\/td><td>Patrols the zone. Attacks enemy contacts, also outside the zone, as long as they are in range. Mortar and artillery groups may fire anywhere.<\/td><\/tr><tr><td>Defensive<\/td><td><code>NOFOLLOW<\/code><\/td><td>Patrols the zone. Only attacks contacts inside its own zone. Mortar and artillery groups fire only inside the zone, unless <strong>NOFOLLOW Artillery Fires Outside Zone<\/strong> is on.<\/td><\/tr><tr><td>Fortify<\/td><td><code>FORTIFY<\/code><\/td><td>Occupies buildings and static weapons near its position and stays there.<\/td><\/tr><\/tbody><\/table>\n<p>How far an aggressive group reacts depends on how fast it is. In the code, slow groups react up to about 600 m, medium groups up to about 4.5 km, and fast groups much further. Any contact inside the group's own zone always counts.<\/p>\n<p>Some menus also offer <strong>Default<\/strong>, <strong>BIS Defence<\/strong> and <strong>BIS Patrol<\/strong>. GAIA only gives its own orders for the three behaviours above. Use those for real GAIA control.<\/p>\n<h2>Putting groups under GAIA<\/h2>\n<h3>In Zeus: right-click menu<\/h3>\n<p>Right-click an AI soldier and pick <strong>GAIA: Control Group<\/strong>, <strong>GAIA: Attack Area<\/strong> or <strong>GAIA: Defend Area<\/strong>. <strong>Player Control Group<\/strong> gives the group back to you. See <a href=\"zeus-tools.md#right-click-menu-on-ai-units\">Zeus tools<\/a>.<\/p>\n<h3>In Zeus: GAIA: Control Group module<\/h3>\n<p>Or drop the <strong>GAIA: Control Group<\/strong> module on an AI group, or select groups and place it. GAIA takes over and works through the side's tasks, then patrols. This works for any side, including friendly AI. The leader can't be a player. See <a href=\"zeus-tools.md#gaia-control-group\">Zeus tools<\/a>.<\/p>\n<h3>In Zeus: Assign AI to zone<\/h3>\n<p>Drop <strong>Assign AI to zone<\/strong> on a unit or group. Pick a zone from the list and a behaviour.<\/p>\n<h3>In Eden: the group attribute<\/h3>\n<ol><li>Select the group and open its attributes.<\/li><li>In <strong>MCC: GAIA Control<\/strong>, set <strong>GAIA Zone<\/strong> to the zone number and pick the <strong>GAIA Behavior<\/strong>.<\/li><li>Optional: tick <strong>GAIA Cache<\/strong>.<\/li><\/ol>\n<p>0 means \"not GAIA controlled\". The zone number must exist when the mission runs.<\/p>\n<h3>In Eden: Assign AI to zone module<\/h3>\n<ol><li>Place a trigger and a <strong>Create Zone<\/strong> module, and sync them.<\/li><li>Place an <strong>Assign AI to zone<\/strong> module, pick the <strong>Behavior<\/strong>, and sync it to the Create Zone module.<\/li><li>Sync your groups (or their units) to the Assign AI to zone module.<\/li><\/ol>\n<p>This is the safest Eden method, because you don't need to know the zone number. The Mission Wizard does it this way too.<\/p>\n<h3>Other ways<\/h3>\n<ul><li>The Zeus <strong>Reinforcements<\/strong> module can hand its troops to GAIA (aggressive, defensive or fortify) in a zone number you type.<\/li><li>AI reinforcements called by GAIA itself are given to GAIA in the zone of the group that asked.<\/li><\/ul>\n<h2>Following tasks<\/h2>\n<p>Groups given to GAIA with <strong>GAIA: Control Group<\/strong> follow the side's tasks:<\/p>\n<ol><li>The group takes the nearest unfinished task of its side that has a map position.<\/li><li>If no MCC zone is within 400 m of the task, a 200 m zone is made there.<\/li><li>The group marches to the task. The task comes first:<ul><li>GAIA gives a marching group no other orders. It is never sent to another fight, a clear job or a transport run, and its order to go to the task never runs out.<\/li><li>On the way the AI return fire and keep moving in formation. They only stop and fight properly when enemies are within 150 m, and start marching again 20 seconds after the last close enemy.<\/li><li>If the group lost its way after a fight, it gets the order again. If it gets no closer on foot for 2 minutes, it gets a new path.<\/li><li>Long trips still use empty vehicles (see Vehicles below).<\/li><\/ul><\/li><li>At the task (leader within 150 m), GAIA runs the group in the task zone: it attacks what is there and patrols. If it gets pulled more than 400 m away and out of the zone, it marches back.<\/li><li>When that task is done, it takes the next nearest one. Tasks are checked every 15 seconds.<\/li><li>With no tasks left, it patrols its last zone, or the nearest one. With no zone at all, a 300 m zone is made around the group.<\/li><\/ol>\n<p>Use it to let friendly AI squads play a Mission Wizard mission next to you.<\/p>\n<h2>Vehicles<\/h2>\n<p>With <strong>Smart Vehicle Use<\/strong> on (default), GAIA groups use vehicles like this:<\/p>\n<ul><li>Long trips: infantry going further than <strong>Find Ride Distance<\/strong> (500 m) look for an empty land vehicle within <strong>Vehicle Search Radius<\/strong> (300 m) of the leader. Any side's empty vehicle counts, as long as it isn't locked, can move and has fuel. An AI drives (never a player, and not the leader when another AI can). If the vehicle fits at least 60% of the AI, they get in; the rest walk on as their own GAIA group with the same order. Players in the group are ordered in too, but the vehicle leaves without them after about 90 seconds.<\/li><li>After a fight: a group goes back to normal and to its job about 30 seconds after the last known enemy within 500 m. Groups on their way to a task only fight enemies close to them (see Following tasks). At the task they join fights within 250 m or inside the task zone.<\/li><li>At the objective: at <strong>Dismount Distance<\/strong> (400 m) from the objective, the whole group gets out, leader included.<ul><li>A borrowed vehicle is left parked. The group remembers it.<\/li><li>A group's own vehicle (motorized or mechanized): passengers and leader get out, the crew stays in to give fire support.<\/li><\/ul><\/li><li>After a fight: if the objective is still far, the group gets back into the same vehicle instead of walking.<\/li><li>Stuck or wrong way: if the vehicle is not 100 m closer to the objective after 90 seconds, the route is planned again. After 3 tries the group continues on foot. This is off when HBQ Advanced Driving AI is active.<\/li><li>Vehicle lost: the group forgets it and may find another ride later.<\/li><\/ul>\n<p><strong>Unstick Vehicles<\/strong> (default on) is for tanks and armed cars without passengers. If they have not moved for about a minute while they still have somewhere to go:<\/p>\n<ol><li>If flipped, and no player is within 300 m, they are put back on their wheels.<\/li><li>The driver plans a new route.<\/li><li>They back up 40 m.<\/li><li>They drop the order, and GAIA gives a new one.<\/li><\/ol>\n<p>This is skipped when HBQ Advanced Driving AI handles it, and for air, ships, statics and groups in combat.<\/p>\n<p>MCC 5 also fixed AI driving to the middle of the map.<\/p>\n<h2>Coordinated attacks<\/h2>\n<p>With <strong>Coordinated Attacks<\/strong> on (default), groups sent to the same enemy contact get roles:<\/p>\n<ul><li><strong>Attack<\/strong>: the main effort, straight at the contact. Groups already fighting close by, aircraft and ships always attack.<\/li><li><strong>Support by fire<\/strong> (one per contact): a vehicle group with guns, or an infantry group when there are 3 or more ground groups. It moves to an overwatch spot with line of sight and fires from there.<\/li><li><strong>Flank<\/strong> (up to 2): comes from another direction, about 75 degrees off the main attack.<\/li><li><strong>Reserve<\/strong> (one, with 4 or more ground groups): waits in cover about 450 m away and joins in when no attacking group is left.<\/li><\/ul>\n<p>A single group, or the setting off, means a plain attack.<\/p>\n<h2>Support requests<\/h2>\n<p>With <strong>AI Support Requests<\/strong> on (default), GAIA can call support when its groups fight a strong enemy contact. One response per contact.<\/p>\n<p>GAIA only calls support when:<\/p>\n<ul><li>the contact is worth at least <strong>Threat Threshold<\/strong> points (default 40; a rifleman is 4 points, 6 inside a GAIA zone, vehicles more),<\/li><li>and a GAIA group in combat is within <strong>Contact Range<\/strong> (600 m) of it,<\/li><li>and the same contact did not get support within <strong>Contact Cooldown<\/strong> (180 s).<\/li><\/ul>\n<p>The three kinds:<\/p>\n<table><thead><tr><th>Support<\/th><th>What happens<\/th><th>Limits<\/th><\/tr><\/thead><tbody><tr><td>Artillery<\/td><td>An idle GAIA mortar or artillery group in range fires on the contact.<\/td><td>Not when friendlies are within <strong>Danger Close Distance<\/strong> (200 m). <strong>Artillery Cooldown<\/strong> 60 s, <strong>Artillery Budget<\/strong> 20 per side per mission. Needs a GAIA artillery group.<\/td><\/tr><tr><td>CAS<\/td><td>An off-map close air support run with the side's CAS plane (or the vanilla default).<\/td><td>Not danger close. <strong>CAS Cooldown<\/strong> 300 s, <strong>CAS Budget<\/strong> 2 per mission. With <strong>CAS Needs Own Aircraft<\/strong> on, only when the side has an armed aircraft of its own.<\/td><\/tr><tr><td>Reinforcements<\/td><td>Motorized reinforcements spawn about 2 km behind the friendly group, unload near it, then join GAIA in that group's zone. <strong>Reinforcement Size<\/strong>: small 2, medium 3, large 4 vehicles.<\/td><td><strong>Reinforcement Cooldown<\/strong> 600 s, <strong>Reinforceme
