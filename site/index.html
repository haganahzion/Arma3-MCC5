<title>MCC 5 Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field-manual wiki. Sticky contents rail on the left, one page of text on the right. */
:root {
  --bg: #f3f2ec; --panel: #e8e6dc; --fg: #1f2320; --muted: #5d625b; --line: #cfccbf;
  --accent: #b9721b; --accent-ink: #8a5210; --code-bg: #e2dfd3; --link: #8a5210;
  --display: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161917; --panel: #1e221f; --fg: #e6e4da; --muted: #a3a79c; --line: #333833;
  --accent: #e9a23b; --accent-ink: #f0b65e; --code-bg: #232823; --link: #f0b65e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161917; --panel: #1e221f; --fg: #e6e4da; --muted: #a3a79c; --line: #333833;
  --accent: #e9a23b; --accent-ink: #f0b65e; --code-bg: #232823; --link: #f0b65e; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.65; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
.banner { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 1; object-fit: cover; border-bottom: 3px solid var(--accent); }
.topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding-block: 14px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-size: 1.5rem; letter-spacing: 0.04em; text-transform: uppercase; }
.brand b { color: var(--accent); }
.search { flex: 1 1 240px; max-width: 360px; }
.search input { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--fg); font: inherit; }
.search input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; padding-top: 24px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: start; max-height: calc(100vh - 24px); overflow: auto; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.toc a { display: block; padding: 6px 10px; border-left: 3px solid transparent; color: var(--fg); text-decoration: none; font-size: 0.95rem; }
nav.toc a:hover { background: var(--panel); }
nav.toc a[aria-current="page"] { border-left-color: var(--accent); background: var(--panel); font-weight: 600; }
.toc-label { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-size: 0.85rem; margin: 0 0 8px 10px; }
details.toc-mobile { display: none; }
article { min-width: 0; max-width: 72ch; }
article h1 { font-family: var(--display); font-size: 2.4rem; line-height: 1.1; letter-spacing: 0.02em; text-transform: uppercase; margin: 0 0 18px; text-wrap: balance; }
article h2 { font-family: var(--display); font-size: 1.55rem; letter-spacing: 0.03em; margin: 34px 0 10px; padding-top: 10px; border-top: 1px solid var(--line); text-wrap: balance; }
article h3 { font-size: 1.1rem; margin: 24px 0 8px; }
article a { color: var(--link); text-underline-offset: 2px; }
article code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
article pre { background: var(--code-bg); padding: 12px 14px; border-radius: 4px; overflow-x: auto; }
article pre code { background: none; padding: 0; }
article blockquote { margin: 16px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--panel); color: var(--fg); }
article blockquote p { margin: 6px 0; }
.table-wrap { overflow-x: auto; margin: 14px 0; }
article table { border-collapse: collapse; font-size: 0.92rem; min-width: 100%; }
article th, article td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
article th { font-family: var(--display); letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.85rem; color: var(--muted); }
article ul, article ol { padding-left: 1.4em; }
article li { margin: 3px 0; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { color: var(--link); text-decoration: none; font-weight: 600; }
.results { list-style: none; padding: 0; display: grid; gap: 10px; }
.results li { padding: 10px 12px; background: var(--panel); border-radius: 4px; }
.results small { display: block; color: var(--muted); }
footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  nav.toc { display: none; }
  details.toc-mobile { display: block; background: var(--panel); border-radius: 4px; padding: 8px 12px; }
  details.toc-mobile summary { cursor: pointer; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.06em; }
  details.toc-mobile a { display: block; padding: 6px 0; color: var(--fg); text-decoration: none; }
  article h1 { font-size: 1.9rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script type="application/json" id="wiki-data">{"order": [["index", "Home"], ["installation", "Installation"], ["getting-started", "Getting started"], ["eden-editor", "Eden editor"], ["mission-wizard", "Mission Wizard"], ["zeus-tools", "Zeus tools"], ["gaia", "GAIA AI"], ["ai-mod-compatibility", "AI mod compatibility"], ["settings", "Settings"], ["logistics", "Limited logistics"], ["mod-support", "Mod support"], ["multiplayer-and-security", "Multiplayer and security"], ["campaign", "Campaign"], ["troubleshooting", "Troubleshooting"], ["license", "License"], ["changelog", "Changelog"]], "pages": {"index": "# MCC Sandbox 5 wiki\n\nMCC Sandbox 5 (Mission Control Center, version 5.0.4) is an Arma 3 mod for building and running missions. You work in two places:\n\n- In the Eden editor, a new **MCC 5** menu in the top menu bar holds all mission settings, an editor Mission Wizard that builds a whole mission for you, and quick placement of MCC modules.\n- In Zeus. Players allowed to use MCC get Zeus in game. Every MCC tool is in the Zeus **Modules** tab, and right-clicking an AI soldier gives quick GAIA orders for his group.\n\nBehind both sits **GAIA**, the MCC AI commander. GAIA moves AI groups around their zones, uses vehicles, coordinates attacks and can call artillery, CAS and reinforcements.\n\nThe old MCC main menu is gone. Everything it did is now a Zeus module, an Eden module or an Eden attribute.\n\n> The release notes say this build has not been tested in game yet. If something breaks, please report it with your RPT log. See [Troubleshooting](troubleshooting.md).\n\n## Quick links\n\n- [Installation](installation.md): get the mod running, also on a dedicated server\n- [Getting started](getting-started.md): your first mission in about 10 minutes\n- [Eden editor](eden-editor.md): the MCC 5 menu, Mission Settings, Eden modules and attributes\n- [Mission Wizard](mission-wizard.md): generate a mission in the editor, in Zeus, or at mission start\n- [Zeus tools](zeus-tools.md): every MCC Zeus module and how to use it\n- [GAIA AI](gaia.md): zones, behaviours, vehicles, support requests, caching\n- [AI mod compatibility](ai-mod-compatibility.md): LAMBS Danger, LAMBS Suppression, HBQ Advanced Driving AI\n- [Settings](settings.md): every MCC setting with its default\n- [Limited logistics](logistics.md): finite fuel, ammo and repair\n- [Mod support](mod-support.md): ACE3, RHS and CUP\n- [Multiplayer and security](multiplayer-and-security.md): servers, Access Rights, network security\n- [Campaign](campaign.md): the MCC campaign mode\n- [Troubleshooting](troubleshooting.md): logs and common problems\n- [Changelog](changelog.md): what changed in MCC 5\n- [License](license.md)\n\n## Requirements\n\n- Arma 3 (current version)\n- **CBA_A3** (required)\n\nOptional mods. MCC detects them on its own and works with or without them:\n\n- ACE3\n- RHS\n- CUP\n- LAMBS Danger.fsm\n- LAMBS Suppression\n- HBQ Advanced Driving AI\n\nDo not load an older MCC version at the same time as MCC 5. Missions made with older MCC versions are not supported.\n\n## Credit\n\nMCC 5 is built on MCC Sandbox by **Shay_gman & Spirit**.\n\n## License\n\nMCC 5 is free software under the GNU General Public License v3 (GPL-3.0), like the original MCC Sandbox.\n\n- You may use it, share it and run it on any server.\n- You may change it. If you share a changed version, keep it under the GPL-3.0 with its source, and keep the credits.\n- Keep the credit to Shay_gman & Spirit.\n\nSource code: [GitHub](https://github.com/haganahzion/Arma3-MCC5). Read more on the [License](license.md) page. Community and support: [Discord](https://discord.gg/bxwX5EkMEf). Get it on the [Steam Workshop](https://steamcommunity.com/sharedfiles/filedetails/?id=3840123393).\n", "installation": "# Installation\n\n## What you need\n\n- Arma 3, current version.\n- **CBA_A3**. MCC needs it. Subscribe to it on the Steam Workshop.\n- Optional: ACE3, RHS, CUP, LAMBS Danger.fsm, LAMBS Suppression, HBQ Advanced Driving AI. MCC finds them by itself.\n\n## Steam Workshop (easiest)\n\nSubscribe to [MCC Sandbox 5 on the Steam Workshop](https://steamcommunity.com/sharedfiles/filedetails/?id=3840123393). Steam also subscribes you to CBA_A3. In the Arma 3 Launcher, tick both under **Mods** and play. Servers that check signatures need the key from the mod's `keys` folder.\n\n## Manual install: get the right file\n\nDownload **ARMA3-MCC5.zip** from the latest GitHub release. Use the release file. GitHub's \"Code > Download ZIP\" button gives you the source code, not the mod.\n\nWhen you unzip it you get this folder:\n\n```\n@mcc_sandbox_a3\\\n    addons\\mcc_sandbox_mod.pbo\n    mod.cpp\n    INSTALL.md\n```\n\n## Install with the Arma 3 Launcher\n\n1. Copy the whole `@mcc_sandbox_a3` folder into your Arma 3 folder. For example:\n   `C:\\Program Files (x86)\\Steam\\steamapps\\common\\Arma 3\\@mcc_sandbox_a3`\n   Any folder works. The Arma 3 folder is just the simplest.\n2. Open the **Arma 3 Launcher** and go to **Mods**.\n3. Use **Add watched folder**, or **Local mod** in the \"...\" menu, and pick the `@mcc_sandbox_a3` folder.\n4. Tick **MCC Sandbox 5** and **CBA_A3**. Tick any optional mods you want.\n5. Untick or remove any older **MCC Sandbox** version. Two MCC versions loaded together will conflict.\n6. Press **Play**.\n\n## Dedicated server\n\n1. Copy `@mcc_sandbox_a3` into the server folder.\n2. Add it to the server start line together with CBA:\n   ```\n   -mod=@CBA_A3;@mcc_sandbox_a3\n   ```\n3. This build is **not signed**. If the server uses `verifySignatures=2`, turn signature checks off or sign the PBO with your own key.\n\nSee [Multiplayer and security](multiplayer-and-security.md) for access rights and network security on public servers.\n\n## Headless clients\n\nGive every headless client the same `-mod` line as the server:\n\n```\n-mod=@CBA_A3;@mcc_sandbox_a3\n```\n\nGAIA spreads new AI groups across all connected headless clients by itself. This is the **Headless Client Balancing** setting, on by default. See [GAIA AI](gaia.md#headless-clients).\n\n## Updating\n\n1. Close Arma 3 (and stop the server).\n2. Replace the old `@mcc_sandbox_a3` folder with the new one from the new zip.\n3. Keep the same folder location, so the launcher and your `-mod` line still point to it.\n4. Do the same on the server and on every headless client. All machines should run the same version.\n\n## Removing MCC or old versions\n\n- To stop using MCC, untick it in the launcher, or remove it from the `-mod` line.\n- To remove it fully, delete the `@mcc_sandbox_a3` folder.\n- Remove or untick any older **MCC Sandbox** version. Don't run two MCC versions together.\n- Missions made with older MCC versions are not supported in MCC 5.\n- Missions that use MCC modules need the mod loaded to work.\n\n## Check that it works\n\n1. Start the game with MCC and CBA ticked.\n2. Open the **Eden editor** on any map.\n3. Look for **MCC 5** in the top menu bar. It works with or without 3den Enhanced.\n\nIf the menu is there, the mod is loaded. Next step: [Getting started](getting-started.md).\n\n## Install problems\n\n**No MCC 5 menu in Eden.**\n- Check that both **MCC Sandbox 5** and **CBA_A3** are ticked in the launcher.\n- Check the folder. The launcher must point to `@mcc_sandbox_a3`, the folder that contains `addons\\mcc_sandbox_mod.pbo`. Pointing at a parent folder or at the zip does not work.\n- Make sure you used the release zip, not the source code download.\n\n**Errors or strange behaviour right after install.**\n- Make sure no older MCC version is loaded at the same time.\n\n**Server kicks players or refuses the mod.**\n- The PBO is not signed. With `verifySignatures=2` the server refuses it. Turn the check off or sign the PBO yourself.\n\n**Server runs but MCC does nothing there.**\n- Check the server `-mod` line includes both `@CBA_A3` and `@mcc_sandbox_a3`.\n- Headless clients need the same `-mod` line.\n\nFor anything else, look at the RPT log. See [Troubleshooting](troubleshooting.md).\n", "getting-started": "# Getting started\n\nYou can go from an empty map to a playable mission in about 10 minutes. You use the editor Mission Wizard, place your squad, play, and open Zeus.\n\nIf the mod is not installed yet, start with [Installation](installation.md).\n\n## 1. Open the editor\n\n1. Start Arma 3 with **MCC Sandbox 5** and **CBA_A3** loaded.\n2. Open **Editor** and pick a map. Altis, Stratis, Tanoa or Malden are fine for a first try.\n3. Find **MCC 5** in the top menu bar of the editor.\n\n## 2. Pick the mission area\n\nThe Mission Wizard builds the mission around a spot you choose. The easiest way:\n\n1. Move the editor camera so the center of the screen looks at a town or area on land.\n\nOther ways, if you want more control:\n- Place a **trigger** (or an area marker), size it, and **select it** before you generate. The mission is built inside that area.\n- Or set the wizard to **Whole map** and it picks a random town or location.\n\nThe center of the area must be on land, not in the water.\n\n## 3. Set the wizard options\n\n1. Open **MCC 5 > Mission Wizard...**\n2. Under **Factions**, set:\n   - **Enemy Faction**, for example OPFOR CSAT (`OPF_F`).\n   - **Player Faction**, for example BLUFOR NATO (`BLU_F`). It must be on a different side from the enemy.\n   - **Civilian Faction**, for example `CIV_F`.\n3. Under **Mission area and size**, set **Expected Players** to the number of people who will play.\n4. Pick a **Difficulty**. Medium is the default.\n5. Leave the rest at the defaults for now. You can read about every option on the [Mission Wizard](mission-wizard.md) page.\n6. If you want a spawn point made for you, set **Player Start** to **Respawn marker outside the area**.\n7. Close the window with **OK**.\n\n## 4. Generate the mission\n\n1. Click **MCC 5 > Generate Mission**.\n2. Wait a moment. A notification shows a summary: the operation name, how many objectives, groups and AI units were placed.\n3. The camera moves to the mission area.\n\nEverything the wizard made is now normal editor content in a layer called **MCC Mission Wizard**. Open the layer list on the left to see it. You can move, edit or delete anything in it.\n\nTo undo the whole generation, press **Ctrl+Z** once. Or use **MCC 5 > Regenerate Mission (clear + generate)** to throw it away and build a new one.\n\n## 5. Place your squad\n\nThe wizard places enemies, not you.\n\n1. Open the asset browser on the right and pick units from your **Player Faction**.\n2. Place your squad outside the mission area. If you used **Player Start**, put them near the \"MW Start\" respawn marker.\n3. Make one unit the player (**Player** in the unit attributes) or make units **Playable** for multiplayer.\n\nThe tasks and briefing are created for the side of the Player Faction. Your units must be on that side to get them.\n\n## 6. Play\n\n1. Click **Play Scenario** (single player) or save and host it in multiplayer.\n2. Read the briefing in the map (Diary). The tasks show which objectives to complete.\n3. Go do them. GAIA controls the enemy groups in their zones.\n\n## 7. Open Zeus\n\nMCC users get Zeus automatically. By default that is everyone. A mission maker can limit it with the **Access Rights** module. See [Multiplayer and security](multiplayer-and-security.md).\n\n1. Press **Ctrl+Delete** (the MCC keybind) or **Y** (the normal Zeus key).\n2. Open the **Modules** tab on the right. The MCC tools are in the categories that start with **MCC**.\n3. Drag a tool onto the map. Its options open.\n\nFor tools that act on one unit, like **Make Hostage**, drop the module onto the unit.\n\nA fun first try: right-click an AI soldier of your side and pick **GAIA: Control Group**. GAIA takes over his squad and works through your side's tasks. Pick **Player Control Group** to take it back.\n\nAll Zeus tools are listed on the [Zeus tools](zeus-tools.md) page.\n\n## Where to go next\n\n- [Mission Wizard](mission-wizard.md) for every option and what Generate builds\n- [Eden editor](eden-editor.md) for MCC modules and attributes\n- [GAIA AI](gaia.md) to control AI with zones and behaviours\n- [Settings](settings.md) to change how MCC behaves\n", "eden-editor": "# Eden editor\n\nIn MCC 5 everything for the mission maker lives in the Eden editor: one top menu, one settings window, MCC modules and two MCC attributes on objects and groups.\n\n## The MCC 5 menu\n\n**MCC 5** sits in the top menu bar of the editor. It works with or without 3den Enhanced.\n\n| Menu item | What it does |\n|---|---|\n| **MCC 5 Mission Settings...** | Opens the MCC 5 window with every MCC setting for this mission. See [Mission Settings window](#mission-settings-window). |\n| **Mission Wizard...** | Opens the editor Mission Wizard options. See [Mission Wizard](mission-wizard.md). |\n| **Generate Mission** | Builds the whole Mission Wizard mission as editor objects. |\n| **Regenerate Mission (clear + generate)** | Deletes the last generated mission, then generates a new one. |\n| **Clear Generated Mission** | Deletes everything in the \"MCC Mission Wizard\" layers. |\n| **Place MCC Module** | Submenu. Places an MCC module at the center of the screen and opens its attributes. |\n| **Place Settings Module** | Submenu. Same for the MCC settings modules. |\n| **In-game: Zeus (Ctrl+Delete / Y) > Modules > MCC** | A reminder. It only shows a notification about how Zeus works in game. |\n| **About MCC 5** | Shows a short notification about where things are. |\n\n### Place MCC Module\n\nEach entry creates the module at the screen center, selects it and opens its attributes.\n\n- Mission Wizard (generated at mission start)\n- Convoy\n- Fire Mission\n- Music / Sound\n- Create Zone\n- Campaign Init\n- Capture Point\n- IED / Suicide Bomber\n- Evac Vehicle\n- Intel\n- Vehicle Respawn\n- Start Location\n- Access Rights\n\n### Place Settings Module\n\n- General\n- GAIA\n- Mission Wizard\n- Mechanics\n- Medical System\n\nAll these modules are also in the normal Eden module browser (**Systems > Modules**, under the **(MCC) ...** categories). The menu is a shortcut.\n\n## Mission Settings window\n\n**MCC 5 > MCC 5 Mission Settings...** opens one window called **MCC 5 Mission Settings**. It has:\n\n- A first category, **MCC 5**, with the main MCC 5 options:\n  - Limited Logistics\n  - Mission Wizard: Max Objectives, Mission Size, Max Spawned Units\n  - Campaign: Simultaneous AOs, AO Size, Ambient Groups Cap\n  - GAIA: AI Support Requests, AI Artillery, AI Close Air Support, AI Reinforcements, Coordinated Attacks, Headless Client Balancing\n  - Zeus for MCC Users\n  - Network Security\n- One more category for each group of MCC CBA settings (General, GAIA, Mission Wizard, Logistics, Mechanics, Medical, Radio, Respawn, User Interface, Role Selection, Classes, Commander Console). These start collapsed.\n\nAlmost every value starts at **Use addon setting** (or an empty box). That means: keep whatever the CBA addon setting says. Only values you change are saved into the mission.\n\nWhen the mission starts, the server copies the values you changed over the matching CBA settings, for every machine. Each change is written to the RPT as `MCC: Eden attribute ...`. If a mission `cba_settings.sqf` or a server admin forces a setting with \"overwrite mission\" priority, that forced value still wins, and the RPT says so.\n\n**Network Security** is the one exception. It has no \"Use addon setting\" state. It is Normal by default. See [Multiplayer and security](multiplayer-and-security.md).\n\nThe full list of settings, with defaults, is on the [Settings](settings.md) page.\n\nMissions that don't use these Eden attributes can set the same names in `description.ext` instead, for example `MCC_logisticsMode = 2;` or `MCC_networkSecurity = 1;`.\n\n## MCC attributes on objects and groups\n\n### Objects: MCC: Zeus Editable\n\nOpen the attributes of a unit, vehicle or simulated object. In the **MCC** category tick **MCC: Zeus Editable**.\n\nAt mission start the object, and its crew, is added to every Zeus. Use it for things your Zeus players must be able to move or edit. Default: off.\n\n### Groups: MCC: GAIA Control\n\nOpen the attributes of a group (not a single unit). The **MCC: GAIA Control** category has:\n\n| Attribute | What it does | Default |\n|---|---|---|\n| **GAIA Zone** | The MCC zone number this group belongs to. 0 means GAIA does not control the group. | 0 |\n| **GAIA Behavior** | How GAIA uses the group in its zone. See below. | Aggressive |\n| **GAIA Cache** | Let GAIA cache (freeze or remove) the group while no player is near. | Off |\n\nGAIA Behavior choices:\n\n- **Aggressive**: patrol, and pursue enemies outside the zone (`MOVE`).\n- **Defensive**: patrol, stay in the zone (`NOFOLLOW`).\n- **Fortify**: occupy buildings and static weapons (`FORTIFY`).\n- **BIS Defence** and **BIS Patrol** are also listed. The GAIA code only gives special orders for the first three behaviours, so pick one of those if you want GAIA to command the group.\n\nThe zone number must exist when the mission runs. Zones get numbers in the order they are created, starting at 1. Each **Create Zone** module makes one zone at mission start. With several Create Zone modules (or a generated Mission Wizard mission) you can't be sure which zone gets which number, so syncing the group to an **Assign AI to zone** module is the safer way. See [GAIA AI](gaia.md).\n\n## Eden modules\n\nMCC modules sit in the Eden module browser under these categories:\n\n- **(MCC) General**\n- **(MCC) AI**\n- **(MCC) Ordnance**\n- **(MCC) Utility**\n- **(MCC) Ships Static**\n- **(MCC) RTS**\n- **(MCC) Environment**\n- **(MCC) PvP**\n\nMost modules work by **syncing** (right-click the module > Connect > Sync to) to triggers, units or objects. The module's own description in Eden tells you what to sync.\n\n### New in MCC 5\n\n**Mission Wizard** (General). Generates a random Mission Wizard mission on the server when the mission starts. It uses the module's own options. See [Mission Wizard](mission-wizard.md#the-mission-wizard-eden-module-runtime).\n\n**Convoy** (AI). Turns synced crewed land vehicles into one convoy that drives to a destination.\n1. Place crewed vehicles and sync them (or their crew) to the module.\n2. Set a destination: a **Destination Marker** name, or sync an empty object such as a Game Logic or invisible helipad. Without both, the convoy follows the Eden waypoints of the lead vehicle's group.\n3. Optional: sync a trigger. The convoy starts when the trigger activates. Without a trigger it starts at mission start.\n\nOptions:\n\n| Option | What it does | Default |\n|---|---|---|\n| Destination Marker | Marker name of the destination | empty |\n| Start Delay (s) | Wait after the trigger (or mission start) before moving | 0 |\n| Lead Speed (km/h) | Speed of the lead vehicle, 0 = no limit | 40 |\n| Separation (m) | Distance between vehicles | 30 |\n| HVT Class | Optional unit class. The HVT rides captive and disarmed in the middle vehicle (handcuffed with ACE) | empty |\n| Escort Infantry | Fill free cargo seats with infantry of each vehicle's faction | off |\n| On Arrival | Stop and hold, Dismount passengers, or Delete the convoy | Stop and hold |\n\nThe vehicle closest to the destination leads. The module stores `MCC_convoyState` (waiting, moving, arrived, destroyed), `MCC_convoyVehicles` and `MCC_convoyHVT`, so you can check them in triggers.\n\n**Fire Mission** (Ordnance). Fires artillery at the module position, or at a synced object or unit (its position when the salvo fires).\n- Sync a trigger to fire when it activates. A repeatable trigger fires it again on every activation. Without a trigger it fires at mission start.\n- Sync crewed artillery (mortars, howitzers, MLRS) to use real guns. They fire their first magazine that is in range. Without guns, or when none is in range, MCC simulated shells are used.\n\n| Option | What it does | Default |\n|---|---|---|\n| Shell (simulated) | Shell used when no synced gun can fire: DPICM, HE 120mm, HE 155mm, Cluster AP, Mines 120mm, HE Laser-guided (as plain bomb), HE 82mm, Incendiary 82mm, Smoke White 120mm, Smoke White 82mm, Smoke Green 40mm, Smoke Red 40mm, Flare White, Flare Green, Flare Red | HE 120mm |\n| Spread | On target, Precise (100 m), Tight (200 m), Wide (400 m) | Precise (100 m) |\n| Rounds per Salvo | Shells per salvo (per gun with synced guns) | 4 |\n| Salvos | Number of salvos | 1 |\n| Time Between Salvos (s) | Seconds between salvos | 30 |\n| Time Between Shells (s) | Simulated shells only | 1 |\n| Delay (s) | Seconds from trigger (or mission start) to the first salvo | 0 |\n\n**Music / Sound** (Environment). Plays music or a sound for every player.\n- **Track / Sound**: a CfgMusic class (for example `LeadTrack01_F`) or a CfgSounds class (for example `AlarmSfx`). Mission classes work too. Default `LeadTrack01_F`.\n- **Type**: Music, Sound or Stop music.\n- Sync a trigger to play it when the trigger activates (again on each activation of a repeatable trigger). Without a trigger it plays at mission start.\n\n### Zones and AI\n\n**Create Zone** (AI). Makes an MCC zone for GAIA.\n1. Place a trigger and size it. The trigger area is the zone area.\n2. Sync the trigger to the Create Zone module.\n3. To put groups in this zone, also sync one or more **Assign AI to zone** modules to it.\n\nAt mission start the zone gets the next free zone number.\n\n**Assign AI to zone** (AI). Sync groups or units to it, and sync it to one Create Zone module. Those groups are put under GAIA in that zone. **Behavior**: aggressive (default), defensive or fortify.\n\n**Respawn Group** (AI). Sync to any unit or group. The group respawns when all its units are dead. **Respawns**: how many times.\n\n**Ambient Units** (AI). Ambient civilians and cars around players. Options: Ambient Patrols, Ambient Cars, Parked Cars, Parked Cars Locked, Faction, Car's Faction, Civilians attitude, Civs Always Friendly.\n\n**Ambient units(Restrict)** (AI). Server side: stops ambient AI spawning within its **Radius**.\n\n**Set Unconscious** (AI). Sync to an AI man to force the unconscious state. Needs the MCC medical system on. Options: Disable Bleeding, Force Unconscious.\n\n**Undercover Agents** (AI). Sync to player roles. Those players can move near enemy AI as long as they keep weapons hidden and don't act suspicious. **Remove Weapons** removes their weapons at game start.\n\n**Convoy** is described above.\n\n### General\n\n**Access Rights**. Who may use MCC (and so who gets Zeus). Enter player UIDs in **MCC Operators** as an array, for example `[\"76561190000000000\"]`, and/or sync player roles to the module. **Admin Access** also allows admins and the host. See [Multiplayer and security](multiplayer-and-security.md).\n\n**Start Location**. Defines a side's start location. Options: Side, Type (F.O.B or Main; you need at least one Main), Insertion (open the respawn menu at mission start and how to insert: don't open/don't teleport, Teleport, Paradrop, H.A.L.O), Distractable (can be destroyed), Construct Buildings (a real building or just a flag pole).\n\n**Evac Vehicle**. Sync to a vehicle to make it an AI evac vehicle that players can command. Options: Evac Side, Add Gunners, Campaign Evac (respawns each in-game day during an MCC campaign).\n\n**IED/Suicide Bomber**. Sync to a vehicle or object to make an IED, or to an AI to make a suicide bomber. Options: Activate Side, Explosion Size (Small, Medium, Large), Explosion Effect (Deadly, Disabling, Fake, None), Disarm Time (10 to 240 seconds), Jammable, Activation Type (Proximity, Radio/Spotter, Mission Maker Only, Mini-Game (Proximity), Mini-Game (Manual)), Activation Distance (5 to 50 m).\n\n**Armed Civilian**. Sync to an AI unit. It will randomly draw a weapon on units of its rival side. Options: Attack Side, Random Patrol.\n\n**Intel**. Sync to an object or unit. Players can interact with it and get the intel. Options: Shared With (All, Group, Side), Intel's Tittle, Intel's Text, Marker Name, Delete Object After.\n\n**Vehicle Respawn**. Sync to vehicles to respawn them. Options: Abandon Distance, Wait Time, Respawns (empty = infinite), Explosion Effect, Disabled Vehicles, Code (runs on the respawned vehicle as `_this`).\n\n**Restricted zones**. Sync to triggers to make restricted areas. Options: Restricted Sides, Time Before Punishment, Air Vehicles, Create markers.\n\n**Special Forces**. Sync to player roles to give them the helmet camera. **User custom key** picks which \"Use Action\" key (1 to 20) opens it.\n\n**Campaign init**. Starts an MCC campaign. See [Campaign](campaign.md).\n\n**Mission Wizard** is described above.\n\n**Survival: Spawn loot in buildings**. Spawns loot crates in buildings around the module, or in synced triggers. Options: Radius, Density (1 to 10), Markers.\n\n### Settings modules (General)\n\nThese set MCC settings for the mission from a module, the older way. The MCC 5 Mission Settings window does the same and more.\n\n- **(Settings) General**\n- **(Settings) GAIA**\n- **(Settings) Mechanics**\n- **(Settings) Radio System**\n- **(Settings) Medical System** (ignored when ACE is loaded)\n- **(Settings) HUD**\n- **(Settings) Role Selection**\n- **(Settings) Mission Wizard**: define the classes the Mission Wizard uses for one list (HVT, radio tower, fuel tanks, armored vehicles, air vehicles, ammo cache, radar, intel objects, IED, anti-air, artillery), from synced vehicles or a class array.\n\n### Ordnance\n\n**Fire Mission** is described above.\n\n### Utility\n\n**Rearm Area**. Sync to objects. Those objects become sources where aircraft can change their pylon loadout. The pylon dialog also has rearm, refuel and repair buttons.\n\n**Load to Cargo**. Loads objects into a vehicle's or container's cargo at mission start, using ACE cargo when it is loaded, else MCC logistics.\n1. Sync the module to the vehicle (or container).\n2. Place a Game Logic (the module description calls it the \"unlock logic\") and sync it to the module as well.\n3. Sync the objects you want loaded to that Game Logic.\n\n### Ships Static\n\n**Spawn Ship**. Spawns a static ship that acts as a base. Options: Side, Respawn Position, Vehicles Purchasing (buy vehicles on the main deck), Rearm and Refuel (rearm, refuel and repair on the main deck), Ship type (the LHD needs CUP), Ship Name.\n\n### RTS\n\n**Vehicle Shop**. A kiosk where players buy vehicles. Sync one Notice Board object and one Invisible Helipad. Options: Vehicles Type (Vehicles, Armored, Helicopters, Fixed Wings, Ships, Units), Side Purchase.\n\n**Weapon Shop**. Sync one ammo box and one other object or unit. The box contents become the items for sale. Options: Action Text, Prices, Persistent, Unique name.\n\n**Create Building**. Builds an RTS building instantly. Options: Building, Side.\n\n**Set Resources**. Sets a side's resources: Materials, Ammo, Fuel, Food, Meds.\n\n**Add Credits To Players**. Sync to player units to give them credits at mission start. Option: Credits.\n\n### Environment\n\n**Ambient Birds**. Flocks of birds fly up when units get close to trees.\n\n**Ambient Fire**. Fires start from explosives and fire fights and spread with the wind.\n\n**Atmosphere**. Preset or custom atmosphere. Custom options include dust, snow, newspapers, mist, fog, leaves, wind sounds, color filter and grain filter.\n\n**(ILS) Instrument Landing System**. Place one on the start of each runway, facing the runway direction. Options: Runway Name, Runway Length (100, 200 or 300 m), Allowed Sides, Arcade Mode (circles that guide the landing path).\n\n**Music / Sound** is described above.\n\n### PvP\n\n**Capture Point**. A capture zone that gives resources over time. Sync a trigger for the capture area, and optionally a flagpole. Options: Type (Ammo, Supply, Fuel, Tickets), Score Reward, Flag, Respawn (owner side can respawn there), HUD, Designation.\n\n**Advance And Secure init**. An Advance and Secure mission where objectives must be captured in order. Sync it to MCC capture zones or dummy sector modules in the order they should be captured. Options: side1, side2, Tickets Bleed (tickets lost every 5 seconds by the losing side).\n\n**AAS Spawn AI**. Spawns AI that try to take enemy sectors in AAS. Options: Spawn Faction, Enemy Side, auto balance, Minimum number of AI per side, Spawn at Sectors, Search Vehicles Radius, Use MCC roles gear, Spawn Vehicles.\n\n## Sample missions\n\nMCC ships ready-made multiplayer missions. They show up in the multiplayer scenario list with names like **(MCC) Template**, **(MCC) Campaign** (and RHS, BAF, USMC, RU, GU, TK variants) and **(MCC) PvP**, on maps such as Altis, Tanoa, Malden, Stratis and others. Some need the map or the mods in their name to be loaded.\n", "mission-wizard": "# Mission Wizard\n\nThe Mission Wizard builds a complete mission for you: zones, objectives with tasks, enemy patrols and garrisons, vehicles, roadblocks, IEDs, civilians, a briefing and the weather.\n\nThere are three ways to use it:\n\n| | Editor wizard | Zeus Mission Wizard | Mission Wizard Eden module |\n|---|---|---|---|\n| Where | Eden menu **MCC 5 > Generate Mission** | Zeus module **Mission Wizard** | Eden module **Mission Wizard**, placed in the editor |\n| When it builds | In the editor, right away | In game, when you place it | In game, at mission start |\n| Result | Normal editor objects you can see and edit before playing | Spawned live on the server | Spawned live on the server |\n| Objectives | Up to 8, each slot chosen | 3 chosen, more from the Max Objectives setting | 3 chosen, up to 8 with the Objectives option |\n| Factions | Picked from a list | Picked from a list | Typed as class names |\n| Undo | Ctrl+Z, Clear, Regenerate | No | No |\n| Different every time you play | No, it is fixed once generated | Yes | Yes |\n\nThe editor wizard is new in MCC 5. It is the main way to build a Mission Wizard mission.\n\n## Editor wizard: step by step\n\n1. Choose the area (see [Mission area](#mission-area)).\n2. Open **MCC 5 > Mission Wizard...** and set the options. Click **OK**.\n3. Click **MCC 5 > Generate Mission**.\n4. Read the notification. It shows the operation name, the number of objectives, groups, AI units and entities, and anything that was skipped.\n5. Look through the **MCC Mission Wizard** layer and change what you like.\n6. Place your own playable units. The wizard does not place players.\n\nAll \"Random\" choices are rolled when you press Generate. The result is fixed after that. Generate again to get a different roll.\n\n## Editor wizard options\n\n### Mission area and size\n\n| Option | What it does | Default |\n|---|---|---|\n| Mission Area | Where the mission is built. **Selected trigger/marker, else camera view**: the area of the one selected trigger or area marker; with nothing selected, the point the camera looks at. **Camera view (center of screen)**: always the screen center. **Whole map (random location)**: a random town or location on the map. | Selected trigger/marker, else camera view |\n| Area Radius (m) | Radius of the area. 0 = automatic, worked out from players, objectives and mission size. Ignored when a selected trigger or marker gives the area. | 0 |\n| Expected Players | Number of players the mission is built for. | 10 |\n| Difficulty | Enemies per player: Easy (2), Medium (4), Hard (6). | Medium |\n| Mission Size | Multiplier on enemy numbers and area size: Small (0.5), Normal (1), Large (1.75), Huge (2.5). | Normal |\n| Max AI Units | Hard cap on the AI the wizard places (enemies, civilians, crews). Every man counts, vehicle crews included. GAIA reinforcements during the mission also stop at this number. | 200 |\n\nHow many enemies: Expected Players x Difficulty. If that is 10 or less, 20 is used. The result is multiplied by Mission Size. If the estimate would go over Max AI Units, the number is lowered to fit. The cap is hard: the wizard counts every man it actually places (crews too), cuts infantry groups down to fit, skips vehicles that don't fit, and keeps room so every objective gets at least a few guards. During the mission GAIA sends no reinforcements once the enemy side is at the cap.\n\n### Factions\n\n| Option | What it does | Default |\n|---|---|---|\n| Enemy Faction | The faction players fight. The enemy side comes from the faction. Groups come from CfgGroups, single units and vehicles from CfgVehicles. | OPFOR `OPF_F` |\n| Player Faction | The players' faction. It decides who gets the tasks and briefing, the hostage faction and who sets off IEDs. Must be on a different side from the enemy. | BLUFOR `BLU_F` |\n| Civilian Faction | Civilians for CQB, hostages, suicide bombers and armed civilians. | `CIV_F` |\n\nThe faction lists show every faction that has at least one playable-scope soldier, as \"SIDE - Name (class)\". This includes factions from mods you have loaded. The list is built once per game session. If you load a new mod, restart the game to see its factions. A faction saved in the mission whose mod is no longer loaded shows as \"(not loaded)\", and Generate stops with a message instead of using another faction.\n\nEvery enemy unit, group, vehicle, crew, HVT, objective target, artillery piece, CAS plane and reinforcement comes from the enemy faction you pick. If the faction has no armor, artillery, AA or planes, that part is skipped; it is never filled from another faction. A Destroy objective the faction can't fill becomes a weapons cache. If a mod vehicle comes with another faction's crew, MCC swaps the crew for the faction's own men at mission start.\n\n### Objectives\n\n| Option | What it does | Default |\n|---|---|---|\n| Number of Objectives | How many of the 8 objective slots are used. Slots set to None are skipped. | 3 |\n| Objective 1 to Objective 8 | The type of each objective. **Random** picks a type not used yet in this mission. | Random |\n\nObjective types:\n\n| Type | What players do | Done when | Failed when |\n|---|---|---|---|\n| Secure HVT (hostage rescue) | Find a tied up hostage (a soldier of your faction or a civilian), untie him and take him home | He is alive, freed and more than 300 m from where he was held | He dies |\n| Kill HVT | Kill or capture an enemy officer with 1 to 4 bodyguards. In the open he may walk a patrol. | He is dead, captive, handcuffed (ACE) or disarmed | - |\n| Destroy Vehicle | Destroy a locked prototype tank or aircraft, in a sandbag nest or a hangar | It is destroyed | - |\n| Destroy AA | Destroy a crewed anti-air vehicle | It is destroyed | - |\n| Destroy Artillery | Destroy a crewed artillery piece | It is destroyed | - |\n| Destroy Weapon Cache | Destroy an ammo cache | It is destroyed | - |\n| Destroy Fuel Depot | Destroy a fuel tank | It is destroyed | - |\n| Destroy Radar/Radio | Destroy a radar or a radio tower | It is destroyed | - |\n| Acquire Intel | Pick up an intel item (files, photos, laptop, phone or suitcase) from a small table | The item is picked up | The item is destroyed |\n| Download Intel | Hack a data terminal and download the data | The download is done | The terminal is destroyed |\n| Capture Area | Clear an enemy camp, or a building in CQB | No enemy left within 100 m (50 m in CQB), checked after 30 s | - |\n| Disarm IED | Find and disarm a large IED device (60 s disarm time) | Disarmed and not set off | The device is destroyed |\n\nIn open terrain, most objectives come with a camp or outpost composition. In CQB the objective goes in or next to a building.\n\nThe classes used for HVTs, tanks, aircraft, AA, artillery, caches, fuel tanks, radars, radio towers, intel items and compositions come from the **MCC Mission Wizard** settings. The wizard reads them in this order: the value in **MCC 5 Mission Settings** for this mission, then the CBA setting, then the preset for your loaded mods (RHS, CUP), then the built-in default. Only classes that exist in your game are used. Where possible, the enemy side's own vehicles are picked first. See [Settings](settings.md#mcc-mission-wizard).\n\n### Enemy forces and threats\n\n| Option | What it does | Default |\n|---|---|---|\n| CQB | Urban mission. Enemies garrison buildings and objectives go in buildings. **With civilians** also puts civilians in buildings. Choices: No, Yes - without civilians, Yes - with civilians, Random. | Random |\n| Enemy Vehicles | Light and motorized enemy vehicles patrolling. No, Yes, Random. | Random |\n| Enemy Armor | Armored and mechanized enemy groups. | Random |\n| Stealth | Black ops. Enemies start relaxed (SAFE, slow). If Weather / Time changes the time, the mission is at night. | Random |\n| IEDs | MCC IEDs on the roads in the area. | Random |\n| Suicide Bombers | Civilian suicide bombers. | Random |\n| Armed Civilians | Civilians that draw weapons on the players. | Random |\n| Roadblocks | Manned checkpoints on roads leading into the area. | Random |\n| Animals | Ambient animals (vanilla goat, poultry and sheep modules). | Random |\n| Reinforcements | No, Aerial, Motorized, Random. Any choice other than No turns on GAIA AI reinforcement requests for this mission. Motorized also places a motorized QRF group outside the area. | Random |\n| Enemy Artillery | No, Mortars, Self propelled artillery, Random. Places artillery in the area and turns on GAIA AI artillery requests. | Random |\n\n### Weather, briefing and markers\n\n| Option | What it does | Default |\n|---|---|---|\n| Weather / Time | **Don't change**, **Random**, **Sandstorm**, **Blizzard**, **Snow**. Changes the scenario date, time and weather in Attributes > Environment. Sandstorm, Blizzard and Snow also add the MCC weather effect at mission start. | Don't change |\n| Intro | **Cinematic**: a camera flies over the area with music while the operation screen plays. **Title card**: the same screen over the player's own view. **None**. Every AI group (both sides) holds fire until the screen ends. | Cinematic |\n| Precise Objective Markers | On: the task points at the exact objective. Off: the task points somewhere within 300 m. | On |\n| General Markers | Also place map markers for the objective zones, roadblocks and enemy positions. Players see them. | Off |\n| Briefing | Add the generated briefing to the players' map (Diary). | On |\n| Player Start | **None (place your own)** or **Respawn marker outside the area**. | None |\n| End Mission When Done | When every objective is done, the scenario ends (END1). | Off |\n\n## Mission area\n\nWith **Mission Area** set to the first option:\n\n- **One trigger selected**: its area is used, including its rotation and shape. If the trigger is smaller than 20 m on a side, the radius is used instead.\n- **One area marker selected** (rectangle or ellipse, at least 20 m): its area is used. Other markers only give the center.\n- **Nothing selected**: the point at the center of the screen, with the radius.\n\n**Whole map** picks a random named place that is not in the water. With CQB it only picks cities and villages. Without CQB it can also pick local names and hills.\n\nThe center of the area must be on land. Otherwise you get \"the center of the mission area is in the water\".\n\n## What Generate builds\n\nEverything goes into a root layer called **MCC Mission Wizard**. If one already exists, the new one is called \"MCC Mission Wizard 2\", and so on. It has five sub-layers:\n\n| Layer | What's inside |\n|---|---|\n| Area and zones | The operation marker (red border, named \"Operation NAME\" or \"Black Ops: NAME\"), the main zone |\n| Objectives | Objective objects and units, compositions, guards, objective zones |\n| Enemy forces | Patrols, garrisons, vehicles, armor, artillery, static weapons, roadblocks, the QRF |\n| Civilians, IEDs and animals | Civilians, IED objects and modules, suicide bombers, armed civilians, animal modules |\n| Tasks, triggers and briefing | Task logics, task triggers, briefing, intro, weather effect, end trigger |\n\n### Zones and GAIA\n\nEach zone is built the way you would do it by hand: a **trigger** (the zone area) synced to a **Create Zone** module. There is one main zone for the whole area and one zone per objective.\n\nEach enemy group is synced to an **Assign AI to zone** module of its zone. There is one such module per behaviour (aggressive, defensive, fortify). At mission start, GAIA takes the groups over in their zones.\n\nThe groups' own \"MCC: GAIA Control\" attributes are not used here, because the zone numbers only exist once the mission runs. To change a group's behaviour, sync its leader to another Assign AI to zone module of the same zone.\n\n### Objectives\n\nFor each objective:\n- The objective object or unit.\n- Guards in nearby buildings (fortify). If there are no buildings, a defending group next to it.\n- Infantry patrols in the objective zone, about 20% of the enemy force per objective.\n- In CQB, more garrison units. With civilians, civilians in nearby buildings.\n- With General Markers on, a marker on the objective zone.\n- A task.\n\n### Main area forces\n\n- Infantry patrols (about 20% of the force, 10% in CQB).\n- CQB garrisons in buildings.\n- Light vehicles (up to 6) and armor (up to 4), on roads where possible.\n- Artillery: 1 to 2 mortars, or 1 self propelled gun.\n- Static weapons, in about 70% of missions (1 to 3).\n- Roadblocks: up to 3, on roads entering the area. Each has barriers, a bunker, lights, 3 guards and a static weapon when the faction has one.\n- IEDs: 2 to 8 on roadsides, hidden in junk or a parked civilian car, each with an MCC IED module.\n- Suicide bombers and armed civilians: civilians with the matching MCC module synced.\n- Animals.\n- The motorized QRF, outside the area, when Reinforcements is Motorized.\n\nWith Stealth on, every group's leader gets an init line that sets the group to SAFE and slow speed.\n\n### Tasks\n\nEach task is made from editor objects you can read and change:\n- A **Game Logic** whose init creates the task on the server for the player side.\n- A **server-only trigger** that sets the task to Succeeded when its condition is true.\n- For some objectives, a second trigger that sets it to Failed.\n\nWith more than one objective there is also a parent \"operation\" task. An end trigger waits until every task is done. Then it marks the operation done and plays the \"mission accomplished\" sound. With **End Mission When Done** on, it also ends the scenario.\n\n### The operation screen\n\nAt mission start the players of the player side see the operation screen:\n\n- Black bars slide in. With **Cinematic**, a camera slowly circles the operation area and music plays.\n- The operation name types in large letters, with the place, the date, the time and the grid.\n- A panel lists the enemy, the time and weather, the grid and the objectives.\n- A red **WEAPONS HOLD** countdown runs, then turns green: **WEAPONS FREE**.\n\nWhile it plays, every AI group on every side is on hold fire and the players can't fire. When all players of the side have seen it (at most 90 seconds), every group gets its old combat mode back. Players who join more than 5 minutes into the mission don't get the screen.\n\n### Briefing, intro, weather and support\n\n- **Briefing**: a logic adds a diary entry for the player side, with the enemy, threats and the objective list with grid references.\n- **Intro**: a logic starts the operation screen at mission start. See [The operation screen](#the-operation-screen).\n- **Weather / Time**: sets the scenario date, time, overcast, fog and rain. Sandstorm, Blizzard and Snow add a logic for the effect.\n- **Reinforcements** or **Enemy Artillery** other than No set **GAIA: AI Support Requests** to On in MCC 5 Mission Settings, plus **AI Reinforcements** and/or **AI Artillery**.\n- **Player Start**: a respawn marker for the player side called \"MW Start\", on flat land outside the area.\n\nAll entity names start with `mcc5mw_` plus a random number per generation, so a second generated mission never clashes with the first.\n\n## Clear, Regenerate and Undo\n\n- **Ctrl+Z** right after Generate undoes the whole generation in one step.\n- **MCC 5 > Clear Generated Mission** deletes every entity in all layers whose name starts with \"MCC Mission Wizard\", and the layers. This is also one undo step.\n- **MCC 5 > Regenerate Mission (clear + generate)** clears, then generates again.\n\nAnything you put into an \"MCC Mission Wizard\" layer yourself is deleted by Clear too. Move things you want to keep to another layer first.\n\n## Tips\n\n- Start small. Use Normal size and 2 or 3 objectives, then grow.\n- Watch **Max AI Units**. If the notification says \"Unit cap reached\", some groups were not placed. Raise the cap or lower players, difficulty or size.\n- A trigger gives you the most control over the area shape.\n- Generate several times until you like the layout. Then edit by hand.\n- Check the task triggers in the **Tasks, triggers and briefing** layer if you want to change win or fail rules.\n- The editor wizard settings are only used in the editor. The generated objects carry everything the mission needs.\n\n### Error messages\n\n| Message | What to do |\n|---|---|\n| every objective slot is None | Set at least one objective in MCC 5 > Mission Wizard... |\n| enemy faction X has no soldiers | Pick another enemy faction |\n| the enemy faction and the player faction are on the same side | Pick factions on different sides |\n| the center of the mission area is in the water | Move the camera or select a trigger on land |\n| no mission area found | Select a trigger or marker, or use Camera view |\n| generation failed - see the RPT log | Check the RPT for lines starting with \"MCC Mission Wizard\" |\n\nParts that fail on their own (for example \"roadblocks\" or \"objective 2 (Kill HVT): no position\") are listed as **Skipped** in the notification. The rest is still built.\n\n## The Zeus Mission Wizard\n\nIn game, a Zeus player can place the **Mission Wizard** Zeus module. It opens a dialog and then generates a mission live on the server.\n\nDialog options:\n\n- **Area**: Around this position, or Anywhere on the map\n- **Search radius (m)**: 500, 1000, 2000, 3000, 5000\n- **Enemy faction**, **Players' faction** (default: your own faction), **Civilians faction**\n- **Players**: 5 to 80\n- **Difficulty**: Easy, Medium, Hard\n- **Objective 1**, **Objective 2**, **Objective 3**\n- **Terrain**: Open terrain, CQB, CQB with civilians, Random\n- **Stealth**, **IEDs**, **Suicide bombers**, **Armed civilians**, **Roadblocks**, **Vehicles**, **Armor**, **Animals**: Random, Yes, No\n- **Reinforcements**: No, Aerial, Motorized, Random\n- **Artillery**: No, Mortars, Self propelled, Random\n- **Weather**: Don't change, Random, Sandstorm, Blizzard, Snow\n- **Intro**: Cinematic (operation screen with a camera over the area and music), Intro only (operation screen over your own view), None. Every AI group holds fire until the screen ends; the map briefing opens after it.\n- **Precise objective markers**, **Debug markers**\n\nObjectives beyond 3, the mission size and the unit cap come from the CBA settings **Max objectives**, **Mission size** and **Max spawned units** (or the matching MCC 5 Mission Settings).\n\nOnly one mission is generated at a time. If you try while one is generating you get \"MCC is generating a mission, try again later\". If you place it right at mission start you may see \"MCC factions are not ready yet\". Wait a moment and try again.\n\n## The Mission Wizard Eden module (runtime)\n\nThe **Mission Wizard** Eden module (**MCC 5 > Place MCC Module > Mission Wizard (generated at mission start)**) generates a new random mission on the server each time the mission starts. Nothing is visible in the editor.\n\n| Option | What it does | Default |\n|---|---|---|\n| Mission Area | **Area (synced trigger or module area)**: a random spot inside a synced trigger, or the module's own area (750 m by default). **Exact (around the module)**: objectives around the module. **Whole map**. | Area |\n| Start Delay (s) | Seconds after mission start before generating | 5 |\n| Mission ID | Optional. While the mission runs, `MCC_MWMissionRuning_<ID>` is true. Empty: edenMW_1, edenMW_2... | empty |\n| Expected Players | Players the mission is built for | 10 |\n| Difficulty | Easy, Medium, Hard | Medium |\n| Objectives | Use MCC setting, or 1 to 8. Objectives above 3 are random. | Use MCC setting |\n| Objective 1 / 2 / 3 | Objective types | Random, Random, None |\n| Enemy Faction | CfgFactionClasses class name | `OPF_F` |\n| Player Faction | CfgFactionClasses class name | `BLU_F` |\n| Civilian Faction | CfgFactionClasses class name | `CIV_F` |\n| CQB | No, Yes - without civilians, Yes - with civilians, Random | Random |\n| Enemy Vehicles, Enemy Armor, Stealth, IEDs, Suicide Bombers, Armed Civilians, Roadblocks, Animals | No, Yes, Random | Random |\n| Reinforcements | No, Aerial, Motorized, Random | Random |\n| Enemy Artillery | No, Mortars, Self propelled artillery, Random | Random |\n| Weather / Time | Don't change, Random, Sandstorm, Blizzard, Snow | Don't change |\n| Intro | Cinematic, Pop-up (the operation screen without the camera), None | Cinematic |\n| Precise Objective Markers | Exact spot or an area marker | On |\n| General Markers | Show the general enemy area markers | Off |\n\nNotes:\n- No MCC zones are needed. The wizard makes its own.\n- Several modules queue. Only one mission is generated at a time.\n- The module stores `MCC_MWstate`: waiting, generating, running or failed. Use it, or `MCC_MWMissionRuning_<Mission ID>`, in triggers.\n- Mission size and the unit cap come from the MCC Mission Wizard settings.\n- If the enemy faction class does not exist, or has no infantry, nothing is generated and the RPT says why.\n\nFor a campaign of many missions in a row, see [Campaign](campaign.md).\n", "zeus-tools": "# Zeus tools\n\nIn MCC 5, Zeus is how you use MCC in game. The old MCC main menu (\"--= MCC =--\" action) is gone. Everything it did is now in Zeus modules.\n\n## Who gets Zeus\n\nWith the setting **Zeus for MCC users** on (the default), every player who is allowed to use MCC gets Zeus with all MCC modules.\n\nA player is allowed to use MCC when:\n- there is no **Access Rights** module in the mission. Then everyone is allowed by default.\n- or the mission has an **Access Rights** module, and the player's UID is listed in it, or his unit is synced to it, or he is a logged-in admin and the module allows admins.\n- The host and the server are always allowed.\n\nDetails:\n- The server checks every 10 seconds and gives Zeus to allowed players. This happens once the player's client is ready, so it can take a few seconds after you spawn.\n- The first player gets MCC's own Zeus (so MCC save/load keeps working). Every other player gets his own Zeus with all addons.\n- You keep your Zeus across respawn and reconnect.\n- Players who already have a Zeus (for example from an Eden **Game Master** module) are left alone.\n- If a player stops being allowed, or the setting is turned off, MCC takes back only the Zeus it gave.\n- Every 20 seconds, objects that one MCC Zeus can edit are shared with all MCC Zeus players.\n\nTurn it off with **Zeus for MCC Users** in MCC 5 Mission Settings, or the CBA setting **Zeus for MCC users**. See [Multiplayer and security](multiplayer-and-security.md).\n\n## Opening Zeus\n\n- **Ctrl+Delete**: the MCC keybind \"Open Zeus (MCC)\". You can change it in CBA keybinds (MCC section). If you have no Zeus, you get \"MCC: you have no Zeus access\" in chat.\n- **Y**: the normal Arma Zeus key.\n\n## Where the MCC tools are\n\nEvery MCC tool is a Zeus module. Open the **Modules** tab on the right of the Zeus screen and look under the categories that start with **MCC**.\n\n- Most modules: drag one onto the map where you want it. Its options open.\n- Modules that act on one unit, group or object: drag the module and drop it **onto** that unit. The tables below say which ones.\n\n## Right-click menu on AI units\n\nRight-click an AI soldier (the leader or anyone in the squad) to open the MCC menu for his whole group:\n\n| Option | What it does |\n|---|---|\n| GAIA: Control Group | GAIA takes the group, works through your side's tasks (nearest first), then patrols. |\n| GAIA: Attack Area | GAIA attacks and patrols the nearest zone with the group. A zone is made if there is none. |\n| GAIA: Defend Area | GAIA holds the nearest zone with the group. |\n| Player Control Group | GAIA lets go of the group and clears its waypoints. You (or the players) control it again. |\n\nHow it works:\n- Click, don't hold. Holding the right button still moves the camera.\n- The menu opens when nothing is selected, or when the unit you right-click is in a group you have selected. All selected groups get the order.\n- If you have one group selected and right-click a different unit, Zeus gives the normal waypoint instead.\n- The top line shows the group name and who controls it now (GAIA or Player).\n- Groups led by a player can't be given to GAIA.\n- With **ZEN** (Zeus Enhanced) loaded, the same options are in the ZEN right-click menu under **MCC 5**. ZEN only opens its menu when no AI is selected, so click empty ground first to clear the selection.\n\nMost modules open a dialog, do their job and then delete themselves.\n\n## (MCC) General\n\n| Module | How to use it |\n|---|---|\n| Mission Wizard | Generates a whole mission live. Place it where you want the mission, or pick \"Anywhere on the map\". See [Mission Wizard](mission-wizard.md#the-zeus-mission-wizard). |\n| Artillery Fire Mission | Pick Shell type, Spread, Rounds and Delay. **Action**: \"Fire now at this position\", or \"Add shells to a side's artillery console\" (then pick the Console side: West, East or Resistance). |\n| Convoy - Spawn | Spawns an MCC convoy of up to 5 vehicles at the module, facing the Heading you pick. Page 1: Faction and Heading. Page 2: the vehicles, an optional HVT and HVT vehicle. The HVT rides in the middle vehicle. |\n| Convoy - Drive To | Place it where the convoy should go and confirm. The last spawned convoy fills its cargo seats and drives there in column. Add more Zeus waypoints to its group afterwards if you like. |\n| Air Drop (Crates/Vehicles) | **Delivery**: Parachute from helicopter, Slingload (one object), or Parachute (no aircraft). **Cargo**: Supply crates or Vehicles. Pick Faction, Amount (1 to 6), Approach from, then the object. **Action**: Drop now, or add it to the faction side's commander console. Heavy vehicles may be too heavy to slingload. |\n| Reinforcements (Air/Motorized) | Calls AI reinforcements to the module. **Type**: Paradrop, Drop-off or Fast-rope (small Spec-Ops, medium QRF, large Airborne), or Motorized (small, medium, large). Pick Faction, Coming from, Start distance (1000 to 3000 m) and Behavior after landing (Patrol around, Defend, Seek & destroy, or GAIA aggressive / defensive / fortify in a zone). Type an **MCC zone number** for the GAIA choices and for motorized. Motorized needs a road near the start point. |\n| Paradrop Units/Players | **Who**: the group the module was placed on, All players, or all West, East or Independent players. **Method**: Parachute, Drop pods or H.A.L.O. **Coming from**: a heading. Drop it on a unit to drop his group. |\n| Delete / Area Brush | Runs an action in a radius (10 to 2000 m) around the module. Actions: Delete All, Delete All Units, Delete Man, Delete Vehicles, Delete Tanks, Delete Air, Delete Ammoboxes, Delete Markers, Lights (Off), Lights (On), Lock Doors (All), Unlock Doors (All), Lock Doors (Random), Atmosphere (Warzone, Sandstorm, Blizzard, Snow, Heatwave, Clear), Remove N/V from units, Add Flashlights to all units, Delete Bodies. **Skip players** applies to N/V and flashlights. Players and their vehicles are never deleted. |\n| Jukebox | **Type**: Music or Sound. **Action**: Play to everyone now, Stop music for everyone, or Play when an area trigger activates (set the trigger radius, activated by and condition). Then pick the track. |\n| Make Hostage | Place a unit first, then drop this on it. The unit becomes a tied up hostage that players can untie, like the Mission Wizard HVT. |\n| Briefing | Adds a diary entry under Briefing. Pick the Section (Situation, Enemy Forces, Friendly Forces, Mission, Special Tasks, Fire Support), For (Everyone, West, East, Independent, Civilian) and type the Text. Players who join later get it too. |\n| Broadcast Message | Shows a text to every player. **Style**: Small (bottom) or Big (center). |\n| Save / Load Mission | Opens the MCC save/load screen: save to profile slots or the clipboard, load, export to SQM or a composition, turn the persistent database on or clear it. |\n| Start Location / FOB | Builds a start location at the module. Pick Side, Type (HQ start location or FOB respawn point), At mission start (Teleport, None, Paradrop, HALO), FOB can be destroyed, Show HQ icon (3D). |\n| Respawn / Mission Start | **Action**: Teleport players to their start location now, Start mission (disable respawn), or Enable/Disable role selection. Only a logged-in admin or the host can change role selection. |\n| Arsenal (Zeus Player) | Closes Zeus and opens the full Virtual Arsenal for your own unit. |\n| CAS for Commander Console | Gives a side's commander console a CAS, AC-130 or UAV call. Pick Side, Aircraft and CAS type. AC-130 needs an armed VTOL or gunship; UAV needs a drone. To fire CAS right now, use **CAS - MCC** instead. |\n| GAIA: Control Group | Drop it on an AI group, or select AI groups first and then place it. GAIA takes those groups over. See [GAIA: Control Group](#gaia-control-group). |\n| (Settings) MCC, (Settings) GAIA, (Settings) UI, (Settings) Mechanics, (Settings) Medic, (Settings) Role Selection | Open a dialog to change those MCC settings during the mission. |\n| Survival: Spawn loot in buildings | Spawns loot crates in buildings around the module. Options: Radius, Density (1 to 10), Markers. |\n\n## (MCC) AI\n\n| Module | How to use it |\n|---|---|\n| Assign AI to zone | Drop it on a unit or group. Pick the **Zone** from the list of existing MCC zones and the **Behavior**: aggressive, Defensive, Fortify, Default, BIS Defence, BIS Patrol. The group is put under GAIA in that zone. For real GAIA control pick one of the first three. |\n| Create Zone | Makes a new MCC zone at the module, or moves an existing one. Pick the Zone (\"New\" or a number), size X, size Y (default 2000) and Angle. |\n| Respawn Group | Drop it on a group or unit and set **Respawns** (default 10). The group respawns when all its units are dead. |\n| Ambient Units | Ambient civilians around players. Options: Ambient Civilians, Ambient Driving Cars, Ambient Parked Cars, Parked cars always locked, Spawn distance around the players, Max units spawned around the player, Faction, Car's Faction, Civilians Reaction to players, Civilians Always Friendly. It runs on the server for each player and uses CPU. |\n| Ambient units(Restrict) | Stops ambient AI spawning within a **Radius** of the module. |\n| Make Evac Vehicle | Drop it on a vehicle. It becomes an MCC AI evac vehicle that players can command. Options: Side, Add gunners, Campaign Evac. |\n| Garrison | Fills buildings around the module with units. Options: Faction, Radius, Population Intensity, Parked Cars, Cars Always Locked, One Group Per House. |\n| Set Unconscious | Drop it on an AI man. Options: Disable Bleeding, Force Unconscious. Needs the MCC medical system. |\n| Undercover Agents | Drop it on a player's unit. AI won't be hostile to him unless he gets too close, shows a weapon, or runs or crouches in their sight. He can hide handguns and small weapons. **Remove Weapons** takes his weapons away at the start. |\n\n## (MCC) Ordnance\n\n| Module | How to use it |\n|---|---|\n| CAS - MCC | Calls an MCC close air support run at the module. Pick the Plane and the CAS type. |\n| IED/Suicide Bomber | Drop it on an object to make an IED: Explosion Size, Explosion Effect, Disarm Time, Can be jammed using ECM vehicle, Activation Type, Activation Distance, Activation Side. Drop it on a unit to make a suicide bomber: Explosion Size, Explosion Effect, Activation Side. |\n| Armed Civilian | Drop it on a unit. Pick the Attack Side and Patrol. The unit will draw a weapon on that side. |\n\n## (MCC) Utility\n\n| Module | How to use it |\n|---|---|\n| Add To Zeus | Adds (or removes) all units and objects in a **Radius** (default 100 m) around the module to every Zeus. |\n| Rearm Area | Drop it on an object (or place it on its own). That object becomes a place where aircraft can change their pylons, rearm, refuel and repair. |\n| Load to Cargo | Drop it on an object, then click near the vehicle (within 15 m) to load the object into its cargo. Uses ACE cargo when ACE cargo is loaded, else MCC logistics. |\n| Intel | Drop it on an object or unit. Options: Shared With, Title, Text, Marker Name, Delete Object After. Players can pick up the intel. |\n| Damage Part | Drop it on a vehicle and pick which part to hit. |\n| Doors Lock/Unlock | Locks or unlocks doors in a **Radius** around the module. |\n\n## (MCC) Ships Static\n\n| Module | How to use it |\n|---|---|\n| Spawn Ship | Spawns a static ship that acts as a base. Options: Ship Side, Respawn Position, Ship Type, Ship Name, Vehicles Purchasing, Rearm and Refuel. The LHD needs CUP. |\n| Open Menu | Opens the ship spawn menu. |\n\n## (MCC) RTS\n\n| Module | How to use it |\n|---|---|\n| Campaign init | Starts an MCC campaign. Needs an MCC Start Location. See [Campaign](campaign.md). |\n| Set Resources | Sets a side's Materials, Ammo, Fuel, Food and Meds. |\n| Add Credits/Valor Points | Drop it on a player to give him **Credits** (default 5000). Place it on empty ground instead to give credits to every player of the **Player Side** you pick. |\n| Add Credits To Players | The Eden version of the credits module, also usable from Zeus. |\n| Create Building | Builds an RTS building right away. Pick Building and Side. |\n| Vehicle Shop | Makes a vehicle kiosk. **Type**: Vehicles, Armored, Helicopters, Fixed Wing, Ships, Units. **Side Purchase**: buy from the whole side or only the faction. |\n| Weapon Shop | Drop it on an ammo box. The box contents become the items for sale. Option: Prices. |\n\n## (MCC) Environment\n\n| Module | How to use it |\n|---|---|\n| Ambient Birds | Turns on random bird flocks near trees. |\n| Ambient Fire | Turns on fires from explosives and fire fights that spread with the wind. |\n| Atmosphere | Preset or custom atmosphere. Options include Random Weather, Dust, Snow, Papers, Mist, Fog, Leaves, Wind Sounds, Color, Film Grain, Overcast, Wind, Waves, Rain, Lightnings. |\n| Night Effects | In a **Radius**: Lights Off, Remove Night Vision, Add Flashlights, Ignore Player's Units. |\n| War Zone Atmosphere | Adds war zone effects in a **Radius** (default 1000 m). |\n\n## (MCC) PvP\n\n| Module | How to use it |\n|---|---|\n| Capture Point | Creates a capture point. Options: Type (Ammo, Supply, Fuel, Tickets), Radius (default 300), Score Reward (default 50), Flag, UI, Owner. |\n| AAS Spawn AI | Spawns AI that fight for Advance and Secure sectors. Set the AAS mission up in Eden with **Advance And Secure init**. |\n\n## GAIA: Control Group\n\nThis module gives any AI group to GAIA. It works for any side, also your own friendly AI.\n\n1. Drop the module on an AI group. Or select one or more AI groups (or units) in Zeus, then place the module.\n2. GAIA takes over at once. You get \"GAIA now controls N group(s)\".\n\nWhat the group does:\n- It picks the **nearest open task of its side** that has a position on the map.\n- MCC makes sure an MCC zone covers that task (it creates a 200 m zone if none is within 400 m) and sends the group there as aggressive.\n- When the task is done, the group moves on to the next nearest open task.\n- With no tasks left, it patrols its last zone, or the nearest zone. If there is no zone at all, a 300 m zone is made around it.\n- It uses vehicles like any GAIA group. See [GAIA AI](gaia.md#vehicles).\n\nLimits:\n- Groups led by a player can't be given to GAIA. A player can be a member, but not the leader. You get \"groups led by a player can't be given to GAIA\".\n- Tasks are checked every 15 seconds.\n\n## Editing objects in Zeus\n\nWhen you double-click an object in Zeus, MCC shows its own edit window. Turn it off with the setting **Disable MCC Zeus Edit**. See [Settings](settings.md#mcc-general).\n", "gaia": "# GAIA AI\n\nGAIA is the MCC AI commander. You give AI groups a **zone** and a **behaviour**. GAIA then decides where each group goes: patrols, attacks on enemy contacts, building defence, vehicle use and calls for support.\n\nGAIA gives orders to groups and leaves the soldiers' own combat AI alone. With LAMBS Danger or HBQ Advanced Driving AI loaded, GAIA leaves unit combat or driving to those mods. See [AI mod compatibility](ai-mod-compatibility.md).\n\nGAIA runs on the server. Groups can be moved to headless clients.\n\n## Zones\n\nA zone is an area on the map with a number (1, 2, 3...). Every GAIA group belongs to one zone. There is no limit on the number of zones in MCC 5.\n\nWays to make a zone:\n- **Eden**: place a trigger, size it, and sync it to a **Create Zone** module. At mission start it gets the next free number.\n- **Zeus**: place the **Create Zone** module, pick \"New\" (or an existing number to move it), set the size and angle.\n- **Mission Wizard**: makes its own zones, one for the area and one per objective.\n- **GAIA: Control Group** and the task follower make a zone when there is none nearby.\n\n## Behaviours (intends)\n\n| Behaviour | Code name | What GAIA does with the group |\n|---|---|---|\n| Aggressive | `MOVE` | Patrols the zone. Attacks enemy contacts, also outside the zone, as long as they are in range. Mortar and artillery groups may fire anywhere. |\n| Defensive | `NOFOLLOW` | Patrols the zone. Only attacks contacts inside its own zone. Mortar and artillery groups fire only inside the zone, unless **NOFOLLOW Artillery Fires Outside Zone** is on. |\n| Fortify | `FORTIFY` | Occupies buildings and static weapons near its position and stays there. |\n\nHow far an aggressive group reacts depends on how fast it is. In the code, slow groups react up to about 600 m, medium groups up to about 4.5 km, and fast groups much further. Any contact inside the group's own zone always counts.\n\nSome menus also offer **Default**, **BIS Defence** and **BIS Patrol**. GAIA only gives its own orders for the three behaviours above. Use those for real GAIA control.\n\n## Putting groups under GAIA\n\n### In Zeus: right-click menu\n\nRight-click an AI soldier and pick **GAIA: Control Group**, **GAIA: Attack Area** or **GAIA: Defend Area**. **Player Control Group** gives the group back to you. See [Zeus tools](zeus-tools.md#right-click-menu-on-ai-units).\n\n### In Zeus: GAIA: Control Group module\n\nOr drop the **GAIA: Control Group** module on an AI group, or select groups and place it. GAIA takes over and works through the side's tasks, then patrols. This works for any side, including friendly AI. The leader can't be a player. See [Zeus tools](zeus-tools.md#gaia-control-group).\n\n### In Zeus: Assign AI to zone\n\nDrop **Assign AI to zone** on a unit or group. Pick a zone from the list and a behaviour.\n\n### In Eden: the group attribute\n\n1. Select the group and open its attributes.\n2. In **MCC: GAIA Control**, set **GAIA Zone** to the zone number and pick the **GAIA Behavior**.\n3. Optional: tick **GAIA Cache**.\n\n0 means \"not GAIA controlled\". The zone number must exist when the mission runs.\n\n### In Eden: Assign AI to zone module\n\n1. Place a trigger and a **Create Zone** module, and sync them.\n2. Place an **Assign AI to zone** module, pick the **Behavior**, and sync it to the Create Zone module.\n3. Sync your groups (or their units) to the Assign AI to zone module.\n\nThis is the safest Eden method, because you don't need to know the zone number. The Mission Wizard does it this way too.\n\n### Other ways\n\n- The Zeus **Reinforcements** module can hand its troops to GAIA (aggressive, defensive or fortify) in a zone number you type.\n- AI reinforcements called by GAIA itself are given to GAIA in the zone of the group that asked.\n\n## Following tasks\n\nGroups given to GAIA with **GAIA: Control Group** follow the side's tasks:\n\n1. The group takes the nearest unfinished task of its side that has a map position.\n2. If no MCC zone is within 400 m of the task, a 200 m zone is made there.\n3. The group marches to the task. The task comes first:\n   - GAIA gives a marching group no other orders. It is never sent to another fight, a clear job or a transport run, and its order to go to the task never runs out.\n   - On the way the AI return fire and keep moving in formation. They only stop and fight properly when enemies are within 150 m, and start marching again 20 seconds after the last close enemy.\n   - If the group lost its way after a fight, it gets the order again. If it gets no closer on foot for 2 minutes, it gets a new path.\n   - Long trips still use empty vehicles (see Vehicles below).\n4. At the task (leader within 150 m), GAIA runs the group in the task zone: it attacks what is there and patrols. If it gets pulled more than 400 m away and out of the zone, it marches back.\n5. When that task is done, it takes the next nearest one. Tasks are checked every 15 seconds.\n6. With no tasks left, it patrols its last zone, or the nearest one. With no zone at all, a 300 m zone is made around the group.\n\nUse it to let friendly AI squads play a Mission Wizard mission next to you.\n\n## Vehicles\n\nWith **Smart Vehicle Use** on (default), GAIA groups use vehicles like this:\n\n- Long trips: infantry going further than **Find Ride Distance** (500 m) look for an empty land vehicle within **Vehicle Search Radius** (300 m) of the leader. Any side's empty vehicle counts, as long as it isn't locked, can move and has fuel. An AI drives (never a player, and not the leader when another AI can). If the vehicle fits at least 60% of the AI, they get in; the rest walk on as their own GAIA group with the same order. Players in the group are ordered in too, but the vehicle leaves without them after about 90 seconds.\n- After a fight: a group goes back to normal and to its job about 30 seconds after the last known enemy within 500 m. Groups on their way to a task only fight enemies close to them (see Following tasks). At the task they join fights within 250 m or inside the task zone.\n- At the objective: at **Dismount Distance** (400 m) from the objective, the whole group gets out, leader included.\n  - A borrowed vehicle is left parked. The group remembers it.\n  - A group's own vehicle (motorized or mechanized): passengers and leader get out, the crew stays in to give fire support.\n- After a fight: if the objective is still far, the group gets back into the same vehicle instead of walking.\n- Stuck or wrong way: if the vehicle is not 100 m closer to the objective after 90 seconds, the route is planned again. After 3 tries the group continues on foot. This is off when HBQ Advanced Driving AI is active.\n- Vehicle lost: the group forgets it and may find another ride later.\n\n**Unstick Vehicles** (default on) is for tanks and armed cars without passengers. If they have not moved for about a minute while they still have somewhere to go:\n1. If flipped, and no player is within 300 m, they are put back on their wheels.\n2. The driver plans a new route.\n3. They back up 40 m.\n4. They drop the order, and GAIA gives a new one.\n\nThis is skipped when HBQ Advanced Driving AI handles it, and for air, ships, statics and groups in combat.\n\nMCC 5 also fixed AI driving to the middle of the map.\n\n## Coordinated attacks\n\nWith **Coordinated Attacks** on (default), groups sent to the same enemy contact get roles:\n\n- **Attack**: the main effort, straight at the contact. Groups already fighting close by, aircraft and ships always attack.\n- **Support by fire** (one per contact): a vehicle group with guns, or an infantry group when there are 3 or more ground groups. It moves to an overwatch spot with line of sight and fires from there.\n- **Flank** (up to 2): comes from another direction, about 75 degrees off the main attack.\n- **Reserve** (one, with 4 or more ground groups): waits in cover about 450 m away and joins in when no attacking group is left.\n\nA single group, or the setting off, means a plain attack.\n\n## Support requests\n\nWith **AI Support Requests** on (default), GAIA can call support when its groups fight a strong enemy contact. One response per contact.\n\nGAIA only calls support when:\n- the contact is worth at least **Threat Threshold** points (default 40; a rifleman is 4 points, 6 inside a GAIA zone, vehicles more),\n- and a GAIA group in combat is within **Contact Range** (600 m) of it,\n- and the same contact did not get support within **Contact Cooldown** (180 s).\n\nThe three kinds:\n\n| Support | What happens | Limits |\n|---|---|---|\n| Artillery | An idle GAIA mortar or artillery group in range fires on the contact. | Not when friendlies are within **Danger Close Distance** (200 m). **Artillery Cooldown** 60 s, **Artillery Budget** 20 per side per mission. Needs a GAIA artillery group. |\n| CAS | An off-map close air support run with the side's CAS plane (or the vanilla default). | Not danger close. **CAS Cooldown** 300 s, **CAS Budget** 2 per mission. With **CAS Needs Own Aircraft** on, only when the side has an armed aircraft of its own. |\n| Reinforcements | Motorized reinforcements spawn about 2 km behind the friendly group, unload near it, then join GAIA in that group's zone. **Reinforcement Size**: small 2, medium 3, large 4 vehicles. | **Reinforcement Cooldown** 600 s, **Reinforcement Budget** 2 per miss
