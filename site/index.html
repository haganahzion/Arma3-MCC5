ion. |\n\nWhich one GAIA tries first:\n- Heavily outnumbered: reinforcements, then artillery, then CAS.\n- Armoured contact: CAS, then artillery, then reinforcements.\n- Otherwise: artillery, then CAS, then reinforcements.\n\nReinforcements are only sent to sides with no players on them, so no extra friendly units show up next to you. Turn on **Reinforcements For Player Sides** to allow them for every side.\n\nEach kind can be turned off on its own. At most one new support response per side per GAIA cycle. Air contacts are ignored. All settings are on the [Settings](settings.md#mcc-gaia---support-requests) page and in MCC 5 Mission Settings.\n\nThe Mission Wizard turns on reinforcement and artillery requests when you choose reinforcements or artillery.\n\n## Headless clients\n\nWith **Headless Client Balancing** on (default), GAIA moves new groups to headless clients:\n\n- Groups that join GAIA for the first time after 30 seconds of mission time are queued.\n- After 5 seconds each is handed to the next headless client in turn.\n- The list of headless clients is refreshed every 10 seconds, so clients can join or leave.\n\nNot moved:\n- groups with players,\n- groups already on a headless client,\n- garrisoned and fortify groups,\n- groups flagged `GAIA_noHC`, `MCC_noHC` or `acex_headless_blacklist`.\n\nGroups placed in Eden and present at the very start are not moved by this. Headless clients run the vehicle logic for their own groups, and mortar fire is passed to the machine that owns the group.\n\nEvery headless client needs the same `-mod` line as the server. See [Installation](installation.md#headless-clients).\n\n## Caching\n\nCaching saves performance for groups far from players. It only applies to groups flagged for caching, for example with the Eden group attribute **GAIA Cache**.\n\n- **Stage 1**: when no player is within **Cache Distance** (default 3000 m), the group is put under the engine's dynamic simulation and freezes. Not for groups in combat, mortar and artillery groups, or groups on a moving order (attack, clear, transport, support).\n- **Stage 2**: when no player is within twice the Cache Distance, the group is saved and removed. It comes back when a player gets that close again.\n\n## Performance\n\nThe MCC 5 GAIA was rewritten for speed:\n- One scheduler for all sides, on the server.\n- Per-group work is spread over frames: 5 groups per frame, each group at most once per second.\n- Group data is cached. Groups are kept in a registry that is cleaned every 10 seconds.\n- No zone limit (the old limit was 91 zones).\n- Far groups can be frozen with dynamic simulation (see Caching).\n\nTips:\n- Keep the number of AI reasonable. The Mission Wizard has **Max AI Units** and **Max spawned units** caps.\n- Use **GAIA Cache** on groups far from the action.\n- Use headless clients on busy servers.\n\n## Other GAIA settings\n\n- **Target Detection Range** (1000 m): how far around each group leader GAIA looks for enemy targets.\n- **GAIA Controls All** (Off): GAIA may also give orders to groups it does not control, even players.\n- **AI Skill** (overall, aim, spot, command; 1 to 10, default 5).\n- **AI Use Smoke Grenades & flares** (Off) and **Smoke/flares Chance** (50).\n\n## Debug\n\nTurn on **GAIA Debug** in CBA Addon Options (MCC GAIA), or in MCC 5 Mission Settings. Then:\n- GAIA writes its cycle timings per phase, with the number of groups processed, to the **server** RPT.\n- GAIA debug markers are shown.\n- Support requests are logged.\n- Groups following tasks log lines starting with `GAIA tasks:`.\n\nAt start the RPT also shows `GAIA: AI mods detected` with the AI mods found. See [Troubleshooting](troubleshooting.md).\n", "ai-mod-compatibility": "# AI mod compatibility\n\nGAIA is a commander. It decides where groups go, which vehicle they use and when to call support. It works alongside these AI mods:\n\n- **LAMBS Danger.fsm**\n- **LAMBS Suppression**\n- **HBQ Advanced Driving AI**\n\nMCC detects them when the game starts. You don't need to set anything.\n\n## What is detected\n\nAt start the RPT log shows one line like this:\n\n```\nGAIA: AI mods detected - LAMBS Danger: true, LAMBS Suppression: false, HBQ Advanced Driving AI: false\n```\n\nHow MCC finds them:\n- LAMBS Danger: the addon `lambs_danger` is loaded.\n- LAMBS Suppression: the addon `lambs_suppression` is loaded.\n- HBQ Advanced Driving AI: any loaded addon whose name contains both \"hbq\" and \"driv\".\n\n## LAMBS Danger\n\nWith LAMBS Danger active:\n- GAIA leaves contact tactics to LAMBS. It does not force group behaviour every cycle while a group is in contact. It only sets it again when it gives a new order.\n- When GAIA vehicle groups meet the enemy, dismounting in contact is LAMBS's call. GAIA only puts the group back into its vehicle after the fight.\n\nGroups running a **LAMBS task waypoint** (a scripted waypoint from LAMBS) are left alone by GAIA. GAIA treats them like fortify groups and does not give them new orders.\n\n## LAMBS Suppression\n\nMCC detects LAMBS Suppression and writes it in the RPT. The code has no further special handling for it, so the two just run side by side.\n\nMCC also has its own **Suppression Effects** setting (MCC User Interface, off by default). It is a separate, client side effect.\n\n## HBQ Advanced Driving AI\n\nWith HBQ active, GAIA leaves stuck vehicles and route recovery to HBQ:\n- GAIA's own \"not getting closer, plan a new route, then go on foot\" check for vehicle groups is turned off.\n- **Unstick Vehicles** (flip, re-route, back up, drop the order) is skipped.\n\nGAIA still picks rides, dismounts and remounts.\n\n## Auto, On, Off\n\nTwo CBA settings in **MCC GAIA > AI Mod Compatibility** let you override detection. They are also in MCC 5 Mission Settings.\n\n| Setting | Auto (default) | On | Off |\n|---|---|---|---|\n| **LAMBS Danger Compatibility** | Cooperate if LAMBS Danger is loaded | Always act as if LAMBS Danger is loaded | Never, GAIA behaves as without LAMBS |\n| **HBQ Driving AI Compatibility** | Cooperate if HBQ is loaded | Always act as if HBQ is loaded | Never, GAIA uses its own unstick logic |\n\nWhen to change them:\n- Set **Off** if you have the mod loaded but want GAIA to keep full control.\n- Set **On** if your version of the mod is not detected. For HBQ the addon name is not documented, so MCC guesses it from the name.\n\nThere is no override setting for LAMBS Suppression.\n\nSee also [GAIA AI](gaia.md) and [Settings](settings.md#mcc-gaia---ai-mod-compatibility).\n", "settings": "# Settings\n\nEvery MCC setting, grouped as in the game, with what it does and its default.\n\n## Where to change settings\n\nYou can change settings in three places, and they all change the same values.\n\n### 1. CBA Addon Options\n\nIn the main menu or the pause menu: **Options > Addon Options**. Pick an **MCC** category, for example \"MCC GAIA\". CBA lets you set values for the server, the mission or the client. These are the \"addon settings\".\n\n### 2. MCC 5 Mission Settings (Eden)\n\nIn the editor: **MCC 5 > MCC 5 Mission Settings...**. This saves settings **into the mission**.\n\n- Almost every value starts at **Use addon setting** (a drop-down) or an **empty box**. That means the CBA addon setting is used.\n- Only what you change is saved.\n- Number boxes accept the same range as the CBA slider.\n- Class list boxes take the same text as the CBA box, for example `[\"B_officer_F\",\"O_officer_F\"]`.\n- At mission start the server applies your values through CBA, on every machine. The RPT shows `MCC: Eden attribute <name> -> CBA setting <variable> = <value>`.\n- A setting forced by a mission `cba_settings.sqf` or by the server admin with \"overwrite mission\" priority still wins. The RPT then says the Eden value was not applied.\n\nThe categories in this window use the CBA names, for example \"MCC GAIA - Support Requests\" is CBA category \"MCC GAIA\", subcategory \"Support Requests\".\n\n### 3. Settings modules and description.ext\n\n- The Eden settings modules ((Settings) General, GAIA, Mechanics, Radio System, Medical System, HUD, Role Selection, Mission Wizard) and the Zeus settings modules set some of the same values. See [Eden editor](eden-editor.md#settings-modules-general) and [Zeus tools](zeus-tools.md).\n- Missions that don't use Eden attributes can put a value in `description.ext`, for example `MCC_logisticsMode = 2;` or `MCC_networkSecurity = 1;`.\n\n## MCC 5 (main category)\n\nThese are the first category in MCC 5 Mission Settings. The Eden names are a little different from the CBA names.\n\n| Eden name | CBA setting (category) | What it does | Default |\n|---|---|---|---|\n| Limited Logistics | Limited Logistics (MCC Logistics) | Off: unlimited supply, as before. Fuel only: fuel trucks, fuel crates and vehicle service fuel are finite. Full: fuel, ammo and repair are finite. Supply trucks refill at their side's base from side resources. See [Limited logistics](logistics.md). | Off |\n| Mission Wizard: Max Objectives | Max objectives (MCC Mission Wizard - Mission size) | Objectives per Zeus or runtime Mission Wizard mission, 1 to 8. The dialog sets the first 3, the rest are random types. | 3 |\n| Mission Wizard: Mission Size | Mission size (MCC Mission Wizard - Mission size) | Multiplier on the number of enemies: Small 0.5, Normal 1, Large 1.75, Huge 2.5. | Normal |\n| Mission Wizard: Max Spawned Units | Max spawned units (MCC Mission Wizard - Mission size) | Hard cap on the units one Mission Wizard mission or campaign AO may spawn. CBA range 30 to 600; Eden offers 50 to 600. | 200 |\n| Campaign: Simultaneous AOs | Campaign simultaneous AOs (MCC Mission Wizard - Campaign) | How many campaign areas of operation can be active at once, 1 to 3. | 1 |\n| Campaign: AO Size | Campaign AO size (MCC Mission Wizard - Campaign) | Objective radius in meters of every campaign AO. CBA range 150 to 1500. | 300 |\n| Campaign: Ambient Groups Cap | Campaign ambient groups cap (MCC Mission Wizard - Campaign) | Max ambient enemy groups kept around players (2 per player up to this). Range 0 to 60. | 18 |\n| GAIA: AI Support Requests | AI Support Requests (MCC GAIA - Support Requests) | AI commanders call artillery, CAS and reinforcements on strong contacts. | On |\n| GAIA: AI Artillery | Artillery Support (MCC GAIA - Support Requests) | GAIA mortar and artillery groups answer support requests. | On |\n| GAIA: AI Close Air Support | CAS Support (MCC GAIA - Support Requests) | GAIA calls an off-map CAS run. | On |\n| GAIA: AI Reinforcements | Reinforcements (MCC GAIA - Support Requests) | GAIA calls motorized reinforcements when heavily outnumbered or when nothing else is available. | On |\n| GAIA: Coordinated Attacks | Coordinated Attacks (MCC GAIA - Coordination) | Groups on the same contact get roles: main attack, flank, support-by-fire, reserve. Off: every group attacks on its own. | On |\n| GAIA: Headless Client Balancing | Headless Client Balancing (MCC GAIA - Headless Clients) | GAIA groups spawned during the mission are moved to connected headless clients, in turn. | On |\n| Zeus for MCC Users | Zeus for MCC users (MCC General - Zeus) | Every player allowed to use MCC gets Zeus with all MCC modules. Others get nothing. | On |\n| Network Security | (Eden only, no CBA setting) | Normal: MCC accepts network requests from any player. Strict: in multiplayer, MCC ignores requests from players not allowed to use MCC. No effect in single player. See [Multiplayer and security](multiplayer-and-security.md). | Normal |\n\n## CBA settings that are not in the Eden window\n\n| Setting (category) | What it does | Default |\n|---|---|---|\n| Gain XP automatically (MCC Role Selection - Experience Points) | Players gain XP by killing and doing their role's actions | On |\n| Flag west (MCC Role Selection - Flags) | Default flag for the west side | `\\a3\\Data_f\\Flags\\flag_nato_co.paa` |\n| Flag east (MCC Role Selection - Flags) | Default flag for the east side | `\\a3\\Data_f\\Flags\\flag_CSAT_co.paa` |\n| Flag resistance (MCC Role Selection - Flags) | Default flag for the resistance side | `\\a3\\Data_f\\Flags\\flag_AAF_co.paa` |\n\n## All other settings\n\nThe rest of the MCC settings, in the order of the MCC 5 Mission Settings window. The text comes from the setting's own description. \"CBA variable\" is the name to use in `cba_settings.sqf` or `description.ext`.\n\nLong class list defaults are not repeated here. Hover over the setting in Eden or CBA to see the full default.\n\n### MCC Mission Wizard\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| HVT (man) | Unit that will be used as high value target | `[\"B_officer_F\",\"O_officer_F\",\"I_officer_F\",\"C_Nikos\"]` | `MCC_MWHVT` |\n| Radio Tower (Land) | Object that will be used in destroy radio missions | `[\"Land_TTowerBig_2_F\"]` | `MCC_MWRadio` |\n| Fuel Tanks (Land) | Object that will be used in destroy fuel tanks missions | `[\"Land_dp_smallTank_F\",\"Land_ReservoirTank_V1_F\",\"Land_dp_bigTank_F\"]` | `MCC_MWFuelTanks` |\n| Radar (Land) | Object that will be used in destroy radar missions | `[\"Land_Radar_Small_F\",\"B_Radar_System_01_F\",\"O_Radar_System_02_F\"]` | `MCC_MWradar` |\n| Armored Vehicles (Vehicle) | Vehicle that will be used in destroy armored vehicle missions | `[\"B_MBT_01_cannon_F\",\"O_MBT_02_cannon_F\"]` | `MCC_MWTanks` |\n| Air Vehicles (Vehicle) | Vehicle that will be used in destroy air vehicle missions | a class list (see the tooltip) | `MCC_MWAir` |\n| Anti-Air (Vehicle) | Vehicle that will be used in destroy anti-air missions | `[\"B_APC_Tracked_01_AA_F\",\"O_APC_Tracked_02_AA_F\",\"I_APC_Wheeled_03_cannon_F\"]` | `MCC_MWAA` |\n| Artillery (Vehicle) | Vehicle that will be used in destroy artillery missions | `[\"B_MBT_01_arty_F\",\"B_MBT_01_mlrs_F\",\"O_MBT_02_arty_F\",\"O_Mortar_01_F\",\"I_Mortar_01_F\"]` | `MCC_MWArtillery` |\n| Ammo cache (Box) | Ammo box that will be used in destroy cache vehicle missions | `[\"Box_East_AmmoVeh_F\",\"Land_Pallet_MilBoxes_F\"]` | `MCC_MWcache` |\n| Intel Objects (Small Items) | Object that will be used in find intel missions | a class list (see the tooltip) | `MCC_MWIntelObjects` |\n| IED (Small Items) | Object that will be used in disarm IED missions | a class list (see the tooltip) | `MCC_MWIED` |\n| Compositions civilians | Will be used as compositions for civilians must be defined in (\"CfgGroups\" >> \"Empty\") | a class list (see the tooltip) | `MCC_MWSITES` |\n| Compositions military | Will be used as compositions for military must be defined in (\"CfgGroups\" >> \"Empty\") | a class list (see the tooltip) | `MCC_MWSITESmilitary` |\n\n### MCC Mission Wizard - Mission size\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Max players | Top of the players slider in the Mission Wizard dialog. Range 10 to 150. | 40 | `MCC_MWmaxPlayersSetting` |\n\n### MCC Role Selection\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Enable Role Selection | Enable role selection menu allows player to gain XP and unlock new weapons and items | Off | `CP_activated` |\n| Unlock All Weapons | Unlock All Weapons ignoring the player level | Off | `MCC_rsAllWeapons` |\n| Role Change | Players can change roles in HQ | On | `MCC_allowChangingKits` |\n| Restrict Weapons | Players using weapons outside of their role (eg rifleman using sniper rifle) will get penalty by increased weapon sway | Off | `MCC_rsEnableRoleWeapons` |\n| Restrict Vehicles | Players can't use vehicles outside of their role (eg rifleman driving a tank) except light vehicles | Off | `MCC_rsEnableDriversPilots` |\n| Group Callsigns | Default groups callsigns | `[\"Alpha\",\"Bravo\",\"Charlie\",\"Delta\"]` | `CP_defaultGroups` |\n\n### MCC Role Selection - Experience Points\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Gain XP notifications | Players will get notifications when gaining XP | On | `CP_expNotifications` |\n| Base Xp | Base Xp needed for each level, Exp will raise by 5% each level. Range 1000 to 10000. | 4000 | `CP_XPperLevel` |\n\n### MCC Classes - IED\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| IEDs small | Array first element is display name, second is the object class | a class list (see the tooltip) | `MCC_ied_small` |\n| IEDs medium | Array first element is display name, second is the object class | a class list (see the tooltip) | `MCC_ied_medium` |\n| IEDs wrecks | Array first element is display name, second is the object class | a class list (see the tooltip) | `MCC_ied_wrecks` |\n| IEDs hidden | Array first element is display name, second is the object class (hidden IED charges) | a class list (see the tooltip) | `MCC_ied_hidden` |\n\n### MCC Classes - Convoy\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| HVT | High value target, array first element is display name, second is the unit class. Left at default: RHS/CUP officers are added when those mods are loaded. Add \"auto\" to keep them in a custom list. | a class list (see the tooltip) | `MCC_convoyHVT` |\n| HVT Vehicle | High value target, array first element is display name, second is the vehicle class. Left at default: RHS/CUP cars are added when those mods are loaded. Add \"auto\" to keep them in a custom list. | a class list (see the tooltip) | `MCC_convoyHVTcar` |\n\n### MCC Commander Console\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Commander Console Enabled | Player can become a side commander from the MCC respawn screen | On | `MCC_allowConsole` |\n| RTS | Enable Real Time Strategy mod from the commander console, build, expand and conquer | On | `MCC_allowRTS` |\n\n### MCC Commander Console - Air support\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Purchase air drop | Commander can trade resources for air Drops - works only on mission restart | On | `MCC_defaultSupplyDropsEnabled` |\n| AC-130 uptime | How long in seconds can an AC-130 stay in the air before he is RTB. Range 0 to 1200. | 300 | `MCC_ConsoleACTime` |\n| Purchase CAS | Commander can trade resources for close air support - works only on mission restart | On | `MCC_defaultCASEnabled` |\n\n### MCC Commander Console - Tracking\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Show units without GPS | Blueforce tracker show units without GPS on commander console | On | `MCC_ConsoleOnlyShowUnitsWithGPS` |\n| Show friendly WP | Show friendly group way points on console | On | `MCC_ConsolePlayersCanSeeWPonMap` |\n| Command AI | Commander can issue order to AI groups given to him by mission maker | On | `MCC_ConsoleCanCommandAI` |\n\n### MCC Commander Console - Live Feed\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Restrict live feed | Restrict live feed to vehicles and units wearing one of the specific helmets only | Off | `MCC_ConsoleLiveFeedHelmetsOnly` |\n| Live feed helmets | Restrict live feed to vehicles and units wearing one of the specific helmets only | a class list (see the tooltip) | `MCC_ConsoleLiveFeedHelmets` |\n\n### MCC GAIA - AI Skill\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| AI Skill(overall) | General skill of AI units. Range 1 to 10. | 5 | `MCC_AI_Skill_Index` |\n| AI Skill(Aim) | Aiming skill of AI units. Range 1 to 10. | 5 | `MCC_AI_AimIndex` |\n| AI Skill(Spot) | Spotting skill of AI units. Range 1 to 10. | 5 | `MCC_AI_SpotIndex` |\n| AI Skill(Command) | Command skill of AI units. Range 1 to 10. | 5 | `MCC_AI_CommandIndex` |\n\n### MCC GAIA - AI Smoke & Flares\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| AI Use Smoke Grenades & flares | AI use smoke grenades and flares. | Off | `MCC_GAIA_AMBIANT` |\n| Smoke/flares Chance | How often AI use smoke and flares. Range 20 to 80. | 50 | `MCC_GAIA_AMBIANT_CHANCE` |\n\n### MCC GAIA\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Cache Distance | How far any player should be from a unit before it cached. Range 1000 to 10000. | 3000 | `GAIA_CACHE_STAGE_1` |\n| GAIA Controls All | If set to everyone GAIA will give order to all units available even players | Off | `MCC_GAIA_ATTACKS_FOR_NONGAIA` |\n| Target Detection Range | How far around each group leader GAIA looks for enemy targets (nearTargets). Range 300 to 3000. | 1000 | `MCC_GAIA_TARGET_RANGE` |\n| GAIA Debug | Write GAIA cycle timings (per phase, groups processed) to the server RPT and enable the GAIA debug markers | Off | `MCC_GAIA_debug` |\n\n### MCC GAIA - Vehicles\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Smart Vehicle Use | AI groups borrow empty friendly vehicles for long trips, get out at the objective (leader included) and get back in after a fight | On | `MCC_GAIA_vehiclesEnabled` |\n| Find Ride Distance | Infantry going further than this (meters) look for an empty vehicle. Range 200 to 5000. | 500 | `MCC_GAIA_rideDistance` |\n| Dismount Distance | Groups get out of their vehicle this far (meters) from the objective. Range 100 to 1500. | 400 | `MCC_GAIA_dismountDistance` |\n| Vehicle Search Radius | How far (meters) from the leader a group looks for an empty vehicle. Range 50 to 1000. | 300 | `MCC_GAIA_rideSearchRadius` |\n| Unstick Vehicles | Tanks and armed cars that have not moved for about a minute re-plan their route, back up, then get a new order (off when HBQ Driving AI handles it) | On | `MCC_GAIA_UNSTICK` |\n\n### MCC GAIA - AI Mod Compatibility\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| LAMBS Danger Compatibility | Auto: if LAMBS Danger is loaded GAIA leaves contact tactics to LAMBS and does not override group behaviour in combat | Auto | `MCC_GAIA_compatLAMBS` |\n| HBQ Driving AI Compatibility | Auto: if HBQ Advanced Driving AI is loaded GAIA leaves unstuck and route recovery to HBQ | Auto | `MCC_GAIA_compatHBQ` |\n\n### MCC GAIA - Support Requests\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Threat Threshold | Minimum threat points of an enemy contact before support is called (a rifleman is 4 points, 6 inside a GAIA zone; vehicles more). Range 10 to 300. | 40 | `MCC_GAIA_SUPPORT_THRESHOLD` |\n| Contact Range | Support is only called when a GAIA group in combat is this close (meters) to the enemy contact. Range 200 to 2000. | 600 | `MCC_GAIA_SUPPORT_CONTACT_RANGE` |\n| Contact Cooldown | Seconds before the same enemy contact can get another support response. Range 30 to 1800. | 180 | `MCC_GAIA_SUPPORT_CA_COOLDOWN` |\n| Danger Close Distance | No artillery, mortar or CAS when friendly troops are this close (meters) to the target. Range 50 to 600. | 200 | `MCC_GAIA_SUPPORT_DANGERCLOSE` |\n| Artillery Cooldown | Seconds between two artillery support calls of one side. Range 0 to 1200. | 60 | `MCC_GAIA_SUPPORT_ARTY_COOLDOWN` |\n| Artillery Budget | Artillery support calls per side for the whole mission. Range 0 to 100. | 20 | `MCC_GAIA_SUPPORT_ARTY_BUDGET` |\n| NOFOLLOW Artillery Fires Outside Zone | Mortar / artillery groups with a NOFOLLOW zone may fire at targets outside their own zone | Off | `MCC_GAIA_ARTY_OUTSIDE_ZONE` |\n| CAS Needs Own Aircraft | CAS is only called when the side has an armed aircraft of its own in the mission | Off | `MCC_GAIA_SUPPORT_CAS_OWNAIR` |\n| CAS Cooldown | Seconds between two CAS calls of one side. Range 60 to 3600. | 300 | `MCC_GAIA_SUPPORT_CAS_COOLDOWN` |\n| CAS Budget | CAS runs per side for the whole mission. Range 0 to 20. | 2 | `MCC_GAIA_SUPPORT_CAS_BUDGET` |\n| CAS Plane BLUFOR | Plane class for BLUFOR CAS runs (empty: vanilla default) | (empty) | `MCC_GAIA_SUPPORT_CAS_PLANE_WEST` |\n| CAS Plane OPFOR | Plane class for OPFOR CAS runs (empty: vanilla default) | (empty) | `MCC_GAIA_SUPPORT_CAS_PLANE_EAST` |\n| CAS Plane Independent | Plane class for Independent CAS runs (empty: vanilla default) | (empty) | `MCC_GAIA_SUPPORT_CAS_PLANE_INDEP` |\n| Reinforcements For Player Sides | Also send reinforcements to sides that have players (off: only AI sides get new units). | Off | `MCC_GAIA_SUPPORT_REINF_PLAYERSIDE` |\n| Reinforcement Cooldown | Seconds between two reinforcement calls of one side. Range 60 to 3600. | 600 | `MCC_GAIA_SUPPORT_REINF_COOLDOWN` |\n| Reinforcement Budget | Reinforcement calls per side for the whole mission. Range 0 to 20. | 2 | `MCC_GAIA_SUPPORT_REINF_BUDGET` |\n| Reinforcement Size | Number of vehicles: small 2, medium 3, large 4 | Small | `MCC_GAIA_SUPPORT_REINF_SIZE` |\n\n### MCC General\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Teleport to Team | Players can teleport to squad leader | JIP Only | `MCC_t2tIndex` |\n| MCC Chat | Will show MCC chat | On | `MCC_MessagesIndex` |\n| Sync Jip | Jip players will sync with server | On | `MCC_syncOn` |\n| Time Multiplier | Speed of in-game time (set on the server). Range 0.5 to 24. | 1 | `MCC_timeMultiplier_settings` |\n| Disable MCC Zeus Edit | Disable the custom MCC interface when editing an object in Zeus | Off | `MCC_CuratorEditDisabled` |\n| Logistics System | Allows player to load equipment, vehicles, resources and items into vehicles | On | `MCC_allowlogistics` |\n| Armed Civilians Weapons | Armed Civilians default Weapons | a class list (see the tooltip) | `MCC_armedCivilansWeapons` |\n\n### MCC General - Ambient Birds\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Ambient Birds | Random flocks of birds will take flight when units are near | On | `MCC_ambientBirdsSettingIndex` |\n\n### MCC General - Ambient Fire\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Ambient Fire | Explosive may cause sporadic fires that will spread with the wind need a restart to disable | On | `MCC_ambientFireSettingIndex` |\n| Vehicle fire chance | Chance a destroyed vehicle will start a fire. Range 0 to 100. | 50 | `MCC_fnc_ambientFireInitVehicleBurnChance` |\n| Explosives rounds fire chance | Chance an explosive ammunition start a new fire also effect the chance of non explosive ammunition to start a fire. Range 0 to 100. | 3 | `MCC_fnc_ambientFireInitExplosivesBurnChance` |\n| Burning crew escape chance | Chance of each crew member in a destroyed vehicle's to catch on fire running out of the vehicle. Range 0 to 100. | 50 | `MCC_fnc_ambientFireInitCrewBurnChance` |\n| Burning crew new fire chance | Chance a burned crew member will start a new fire. Range 0 to 100. | 10 | `MCC_fnc_ambientFireInitCrewNewFireChance` |\n\n### MCC General - Artillery\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Artillery Computer | Enable/disable BI artillery computer | On | `MCC_artilleryComputerIndex` |\n| Artillery spread | First element display name second spread in meters | `[[\"On-target\",0], [\"Precise\",100], [\"Tight\",200], [\"Wide\",400]]` | `MCC_artillerySpreadArray` |\n\n### MCC General - Squad Leader PDA\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| SQL PDA Enabled | Any team leader will have access to a PDA that have a Blueforce tracker | On | `MCC_allowsqlPDA` |\n\n### MCC Logistics - Limited Logistics\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Supply Truck Capacity | Resource units an ammo/repair/fuel vehicle carries of each supply type (MCC crates: 200, big crates: 800). Range 100 to 5000. | 1000 | `MCC_logisticsTruckCapacity` |\n| Base Refill Rate | Resource units a supply vehicle takes from the side resources every 5 seconds while parked at its base. Range 10 to 1000. | 100 | `MCC_logisticsRefillRate` |\n| Base Radius | Distance in meters from the side start location (or an RTS base building) where supply vehicles refill. Range 25 to 500. | 75 | `MCC_logisticsBaseRadius` |\n| Supply Cost Factor | Multiplies the resource cost of rearming, repairing and refuelling a vehicle (from supply points and from vehicle service). Range 0.1 to 5. | 1 | `MCC_logisticsCostFactor` |\n| Fuel Consumption | Vehicle fuel consumption multiplier while Limited Logistics is on (1 = normal). Range 1 to 10. | 1 | `MCC_logisticsFuelConsumption` |\n\n### MCC Mechanics\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Weapons Binds | Bind weapon to the 1 - 4 keys | Off | `MCC_quickWeaponChange` |\n| One Man Tanks | Player can operate a tank by his own driving and shooting | Off | `MCC_arcadeTanks` |\n| Disable Fatigue | Turn off the players' fatigue system | Off | `MCC_disableFatigue` |\n| 3D Tagging | Squad leader enemy tags and markers will be visible on HUD | On | `MCC_allow3DSpotting` |\n\n### MCC Mechanics - Cover\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Cover System | Players will automatically pop up or side out of cover while aiming down sights | Off | `MCC_cover` |\n| Cover System UI | Show icons on HUD when in cover | Off | `MCC_coverUI` |\n| Vault System | Allow players to vault over walls and obstacles - see CBA keybinds | Off | `MCC_coverVault` |\n\n### MCC Mechanics - Interaction\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Interaction System | Players can interact with object and themselves - see CBA keybinds | On | `MCC_interaction` |\n| Interaction System UI | Show icons on HUD when interaction is available | On | `MCC_ingameUI` |\n\n### MCC Mechanics - Survival\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Survival Mode | Players can loot map objects and need to drink and eat | Disabled | `MCC_surviveModAllowSearch_index` |\n| Load Player Position | Load last known player position on mission start | Off | `MCC_surviveModPlayerPos` |\n| Load Player Gear | Load last known player gear on mission start | Off | `MCC_surviveModPlayerGear` |\n| Load Player Stats | Load last known player stats on mission start | Off | `MCC_surviveModPlayerStats` |\n\n### MCC Mechanics - Ammo Type\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Breaching Ammo | Magazine classes. Shooting this ammo from less than 10 meters will unlock doors. \"auto\" = every shotgun slug magazine found in the loaded mods | `[\"auto\"]` | `MCC_breacingAmmo` |\n| Non Lethal Ammo | Magazine classes. Shooting this ammo at a unit closer than 30 meters stuns it instead of killing it. \"auto\" = every shotgun slug magazine found in the loaded mods | `[\"auto\"]` | `MCC_nonLeathalAmmo` |\n\n### MCC Medical System\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Enable MCC Medic System | Turns on the MCC medical system. Requires mission restart! | Off | `MCC_medicSystemEnabled` |\n| Complex System | Requires mission restart! Complex system replace all the default ArmA items with advanced items such as bandages, epipens exc | Off | `MCC_medicComplex` |\n| Medic Only Heal | Only medics can use FAK to heal others can only use bandages to stop bleeding | Off | `MCC_medicOnlyMedicHeals` |\n| Medic HUD | Show wounded units as a cross on HUD | Off | `MCC_medicShowWounded` |\n| Bleeding | Players and AI will suffer from bleeding effects and will need to stop bleeding or die over time | Off | `MCC_medicBleedingEnabled` |\n| Bleeding Time | How long in seconds it will take for unconscious unit to die from bleeding. Range 30 to 1200. | 300 | `MCC_medicBleedingTime` |\n| Bulletproof Vests Effectiveness | Players can take more damage than usual. Range 0 to 5. | 2 | `MCC_medicDamageCoef_index` |\n| Punish Team Kill | Player who died by friendly fire can forgive or punish the killer | Off | `MCC_medicPunishTK` |\n\n### MCC Radio\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Enable MCC Radio System | Radio system uses default ArmA Voice Over IP | Off | `MCC_VonRadio` |\n\n### MCC Radio - Distance\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Global Radio Distance | Radio range in meters. Range 1000 to 5000. | 2000 | `MCC_vonRadioDistanceGlobal` |\n| Side Radio Distance | Radio range in meters. Range 3000 to 7000. | 5000 | `MCC_vonRadioDistanceSide` |\n| Commander Radio Distance | Radio range in meters. Range 8000 to 20000. | 12000 | `MCC_vonRadioDistanceCommander` |\n| Group Radio Distance | Radio range in meters. Range 300 to 5000. | 2500 | `MCC_vonRadioDistanceGroup` |\n\n### MCC Radio - Anti-Abuse\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Kick Hot Mic | Will kick player with hot mic after some time | Off | `MCC_vonRadioKickIdle` |\n| Time Before Kick | Seconds of hot mic before the kick. Range 5 to 60. | 30 | `MCC_vonRadioKickIdleTime` |\n\n### MCC Respawn - Respawn\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Save Gear | Players will respawn with the gear they had when they died | Off | `MCC_saveGearIndex` |\n| Delete players bodies | Automatically delete players bodies | Off | `MCC_deletePlayersBody` |\n| Respawn Menu | Custom MCC respawn menu | On | `MCC_openRespawnMenu` |\n| Respawn Cinematic | Shows a cinematic when a player spawns. | On | `MCC_respawnCinematic` |\n| Respawn On Leader | Allow player to select to respawn on team leader from the MCC respawn menu | Off | `MCC_respawnOnGroupLeader` |\n\n### MCC User Interface\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| View Distance | Sets the view distance. Range 200 to 15000. | 5000 | `MCC_Settings_ViewDistance` |\n| Grass Detail | Sets the terrain grid (grass) detail. Range 1 to 50. | 10 | `MCC_Settings_grassDetail` |\n| Action Menu | Show MCC action in mouse wheel actions | On | `MCC_showActionKey` |\n| Allow 3rd Person | Force first person camera | Always | `MCC_Settings_forceCamera` |\n| PvP Interface | Shows the opposing sides and the tickets left. | Off | `MCC_UIModuleTickets` |\n\n### MCC User Interface - Compass\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Interactive Compass HUD | Compass on the HUD. Options: Only Compass, Show group's units, Disabled. | Disabled | `MCC_Settings_compassEnabled` |\n\n### MCC User Interface - Map\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Group Markers | Group markers show on map | Off | `MCC_groupMarkers` |\n| Unit Markers | Unit markers show on map | Off | `MCC_indevidualMarkers` |\n\n### MCC User Interface - Name Tags\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Name Tags | Show nearby units names | Off | `MCC_nameTags` |\n| Name Tags only when pointing | Show nearby units names only when pointing | Off | `MCC_NameTags_direct` |\n\n### MCC User Interface - suppression\n\n| Setting | What it does | Default | CBA variable |\n|---|---|---|---|\n| Suppression Effects | Client side suppression effects. | Off | `MCC_suppressionOn` |\n| Hit direction Effects | Shows the direction of enemy fire. Options: Realistic, Arcade, Off. | Realistic | `MCC_hitRadar` |\n\n## Keybinds\n\nMCC keybinds are CBA keybinds. Change them in **Options > Controls > Configure Addons**, section **MCC**.\n\n| Action | Default key | Notes |\n|---|---|---|\n| Open Zeus (MCC) | Ctrl+Delete | Only when you have Zeus |\n| Commander Console | Ctrl+End | You must be your side's commander |\n| Teleport to Team | Alt+T | When **Teleport to Team** allows it |\n| Squad Management | P | |\n| Squad Leader PDA | Ctrl+Page Down | You must be a team leader |\n| Interaction | Left Windows key | With **Interaction System** on |\n| Interaction Self | Ctrl+Left Windows key | With **Interaction System** on |\n| Climb Over | Alt+V | With **Vault System** on, at an obstacle |\n| Switch Weapons 1: Primary/handgun | Shift+1 | With **Weapons Binds** on |\n| Switch Weapons 2: Launcher | Shift+2 | With **Weapons Binds** on |\n| Switch Weapons 3: Grenades | Shift+3 | With **Weapons Binds** on |\n| Switch Weapons 4: Utility | Shift+4 | With **Weapons Binds** on |\n\nWithout ACE, MCC shows \"Assing MCC Interaction Key !!!\" on screen until the Interaction key has a binding.\n\n## Notes\n\n- **Ambient Fire**: the description says it needs a restart to disable.\n- **Purchase air drop** and **Purchase CAS**: work only after a mission restart.\n- **Enable MCC Medic System** and **Complex System**: need a mission restart. With ACE loaded, the MCC medical settings module is ignored. See [Mod support](mod-support.md).\n- **Breaching Ammo** and **Non Lethal Ammo**: the default `[\"auto\"]` means every shotgun slug magazine found in your loaded mods. Add your own classes next to \"auto\" to keep both.\n- **Convoy HVT** lists: left at default, RHS and CUP entries are added when those mods are loaded. Add \"auto\" to a custom list to keep them.\n- To see MCC timings and errors, turn on **GAIA Debug**. See [Troubleshooting](troubleshooting.md).\n", "logistics": "# Limited logistics\n\nBy default Arma supply is endless: an ammo truck never runs dry and a fuel crate never empties. In MCC 5, with **limited logistics** on, supply trucks, crates and vehicle service run out, and they refill at your base from your side's resources.\n\nIt is optional and off by default.\n\n## Turn it on\n\nPick a mode in one of these places:\n- Eden: **MCC 5 > MCC 5 Mission Settings... > MCC 5 > Limited Logistics**\n- CBA Addon Options: **MCC Logistics > Limited Logistics**\n- `description.ext`: `MCC_logisticsMode = 2;` (0 Off, 1 Fuel only, 2 Full)\n\n| Mode | What runs out |\n|---|---|\n| **Off** | Nothing. Unlimited supply, as before. |\n| **Fuel only** | Fuel trucks, fuel crates and fuel from vehicle service. |\n| **Full (fuel, ammo, repair)** | Fuel, ammo and repair. |\n\nThe mode can be changed while the mission runs. When you switch it to Off, MCC gives the supply objects their normal cargo back.\n\n## Supply points\n\nA supply point is any vehicle or crate that can rearm, repair or refuel. That means:\n- classes with engine ammo, repair or fuel cargo (ammo trucks, fuel trucks, repair trucks, supply crates),\n- MCC supply crates,\n- with ACE, classes that ACE rearm or ACE refuel treat as a source.\n\nThe server looks for new supply objects every 30 seconds and checks each one every 5 seconds.\n\nEach supply point gets a stock for each type it can supply. The stock is in **resource units**, the same units as side resources.\n\n| Supply object | Stock per type |\n|---|---|\n| Vehicles (trucks) | **Supply Truck Capacity**, default 1000 |\n| MCC crates | 200 |\n| MCC big crates | 800 |\n| Anything else | 200 |\n\n## What things cost\n\nWhen a vehicle near a supply point gains ammo, health or fuel, MCC takes the price from that point's stock. A full service (0 to 100%) costs:\n\n| Vehicle kind | Ammo | Repair | Fuel |\n|---|---|---|---|\n| Plane | 150 | 150 | 100 |\n| Helicopter | 100 | 100 | 60 |\n| Tank | 120 | 120 | 60 |\n| Wheeled APC | 80 | 80 | 40 |\n| Ship | 40 | 40 | 30 |\n| Static weapon | 20 | 20 | 0 |\n| Anything else | 30 | 30 | 20 |\n\nA partial service costs part of that. All prices are multiplied by **Supply Cost Factor** (default 1).\n\nWhen a stock is empty, that supply type is switched off on the object. It works again when it is refilled.\n\n## Refilling at base\n\nA supply vehicle refills when it is parked at its side's base:\n\n- \"At base\" means within **Base Radius** (default 75 m) of the side's **start location**, or of a built **RTS base building** of that side.\n- While parked there, it takes **Base Refill Rate** (default 100) resource units from the side resources every 5 seconds, until it is full.\n\nWithout side resources the trucks stay empty.\n\n## Side resources\n\nEach side has resources: ammo, repair (materials), fuel, food and meds. In MCC 5 they are **server-authoritative**. All changes are made on the server and sent to everyone, so they can't get out of sync.\n\nWays to change them:\n- **Set Resources** module (Eden or Zeus).\n- **Capture Point** modules that yield resources over time.\n- MCC campaign and RTS gameplay.\n\n## Vehicle service\n\nMCC's own vehicle service (the rearm, repair and refuel of the pylon dialog, for example at a **Rearm Area**) also costs side resources when limited logistics is on:\n- **Fuel only** mode: refuelling costs fuel. Repair and rearm stay free.\n- **Full** mode: repair, rearm and refuel all cost.\n- If the side can't pay, the service is refused with \"Not enough ... resources (N needed)\".\n\nWith logistics Off, vehicle service is free, as before.\n\n## Fuel consumption\n\n**Fuel Consumption** (default 1, range 1 to 10) multiplies how fast vehicles burn fuel while limited logistics is on. It uses the Arma 3 2.16+ fuel consumption command. It is applied by whichever machine owns the vehicle, and set back to normal when you turn logistics off.\n\n## Returning crates\n\nWhen a crate is returned at base, its remaining stock counts toward what you get back.\n\n## ACE\n\nWith ACE rearm or ACE refuel loaded:\n- MCC pushes its stock into ACE's own counters (ammo as ACE supply points, fuel as liters).\n- Each check, MCC reads how much ACE used and takes it from the stock.\n- MCC crates without ACE rearm config are made ACE rearm sources first, because ACE ignores normal ammo cargo.\n\n## The Logistics System setting\n\n**Logistics System** (MCC General, default On) is a different feature. It lets players load equipment, vehicles, resources and items into vehicles. It does not limit anything.\n\n## Settings summary\n\n| Setting | Default | Range |\n|---|---|---|\n| Limited Logistics | Off | Off, Fuel only, Full |\n| Supply Truck Capacity | 1000 | 100 to 5000 |\n| Base Refill Rate | 100 | 10 to 1000 |\n| Base Radius | 75 m | 25 to 500 |\n| Supply Cost Factor | 1 | 0.1 to 5 |\n| Fuel Consumption | 1 | 1 to 10 |\n\nAll are in CBA **MCC Logistics > Limited Logistics**, and in MCC 5 Mission Settings. See [Settings](settings.md#mcc-logistics---limited-logistics).\n", "mod-support": "# Mod support: ACE3, RHS, CUP\n\nMCC 5 detects ACE3, RHS and CUP by itself when the game starts. You don't need to set anything. MCC works with or without them.\n\nFor LAMBS and HBQ, see [AI mod compatibility](ai-mod-compatibility.md).\n\n## How detection works\n\nMCC checks which addons are loaded:\n\n| Mod | Checked addon |\n|---|---|\n| CBA | `cba_main` |\n| ACE3 | `ace_common` |\n| ACE medical, cargo, rearm, refuel | `ace_medical`, `ace_cargo`, `ace_rearm`, `ace_refuel` |\n| RHS AFRF, USAF, GREF, SAF | `rhs_main`, `rhsusf_main`, `rhsgref_main`, `rhssaf_main` |\n| CUP Units | `CUP_Creatures_People_Core` or `CUP_Creatures_People_Civil_Russia` |\n| CUP Vehicles | `CUP_Vehicles_Core` or `CUP_AirVehicles_Core` |\n| CUP Weapons | `CUP_Weapons_WeaponsCore` |\n\nThe result is written to the RPT in one line starting with `MCC compat:`, for example:\n\n```\nMCC compat: CBA true | ACE false (medical false, cargo false, rearm false, refuel false) | RHS true (AFRF true, USAF true, GREF false, SAF false) | CUP false (units false, vehicles false, weapons false)\n```\n\n## RHS and CUP: class lists\n\nSeveral MCC settings are lists of classes. When such a list is still at its vanilla default, MCC swaps in a list for your loaded mods.\n\n| Setting | With RHS / CUP |\n|---|---|\n| Mission Wizard HVT (man) | RHS / CUP officers |\n| Mission Wizard Armored Vehicles | RHS / CUP tanks |\n| Mission Wizard Anti-Air | RHS / CUP AA vehicles |\n| Mission Wizard Artillery | RHS / CUP artillery |\n| Convoy HVT and HVT Vehicle | RHS / CUP officers and cars are added to the list |\n| Breaching Ammo, Non Lethal Ammo | every shotgun slug magazine found in your mods |\n\nRules:\n- Only classes that exist in your loaded mod version are used. Missing ones are dropped.\n- For the Mission Wizard lists, mod entries come first. Vanilla entries are only kept for sides the mods don't cover.\n- For the convoy lists, the mod entries are added after the vanilla ones.\n- If you **changed** a list, MCC leaves it alone.\n- Put the word `\"auto\"` in a list to get the detected entries plus your own. Example: `[\"auto\",\"my_magazine_class\"]`.\n- If you change one of these settings during the mission, the mod presets are applied again.\n\nMCC's RTS and spawn groups also have RHS and CUP variants. They are used when that mod is loaded and every class in the variant exists.\n\n## Mission Wizard factions\n\nThe editor Mission Wizard lists every faction from every loaded mod that has soldiers. So RHS and CUP factions show up in the Enemy, Player and Civilian faction lists. See [Mission Wizard](mission-wizard.md#factions).\n\nThe sample missions include RHS campaign versions, for example \"(MCC RHS) Campaign USA vs RU\". They need RHS loaded.\n\nThe **Spawn Ship** LHD type needs CUP.\n\n## ACE3\n\nWhen ACE is loaded, MCC hands several jobs to ACE:\n\n- **Medical**: the MCC medical settings module is ignored. Use ACE medical.\n- **Interaction**: MCC does not ask you to bind its own interaction key. The MCC interaction key then only halts AI and opens doors, and the MCC self-interaction menu is off. Use ACE interaction for the rest. For MCC ammo boxes you get the hint \"Use ACE keys to resupply\".\n- **Captives**: the convoy and Mission Wizard HVTs and hostages use ACE handcuffs. A Kill HVT objective also counts as done when the HVT is handcuffed with ACE.\n- **Cargo**: **Load to Cargo** uses ACE cargo when it is loaded.\n- **Rearm and refuel**: with limited logistics on, MCC syncs its stock with ACE rearm and ACE refuel. See [Limited logistics](logistics.md#ace).\n- Some MCC actions, like resupply, use ACE items (for example field dressings instead of First Aid Kits).\n\nIf something MCC normally does seems missing with ACE loaded, it is usually because ACE does that job.\n", "multiplayer-and-security": "# Multiplayer and security\n\nFor server owners and mission makers who run MCC in multiplayer.\n\n## Dedicated server setup\n\n1. Copy `@mcc_sandbox_a3` to the server.\n2. Start the server with `-mod=@CBA_A3;@mcc_sandbox_a3`.\n3. Give headless clients the same `-mod` line.\n4. The PBO is not signed. With `verifySignatures=2`, turn the check off or sign the PBO with your own key.\n\nMore in [Installation](installation.md#dedicated-server).\n\nGAIA, the Mission Wizard, limited logistics and side resources run on the server. Headless clients take GAIA groups when **Headless Client Balancing** is on. See [GAIA AI](gaia.md#headless-clients).\n\n## Who may use MCC\n\n\"Allowed to use MCC\" decides who gets Zeus, and, in Strict network security, whose MCC requests the server accepts.\n\n| Mission has | Who is allowed |\n|---|---|\n| No Access Rights module | **Everyone** (the default `MCC_allowedPlayers = [\"all\"]`) |\n| An **Access Rights** module | Players whose UID is in the module, players whose unit is synced to it, and logged-in admins if **Admin Access** is ticked |\n\nThe server and the host are always allowed.\n\n### The Access Rights module\n\n1. In Eden, use **MCC 5 > Place MCC Module > Access Rights**. Or find **Access Rights** under **(MCC) General** in the module browser.\n2. In **MCC Operators**, enter player UIDs as an array, for example:\n   ```\n   [\"76561190000000001\",\"76561190000000002\"]\n   ```\n3. And/or sync the module to the playable units (roles) that should have MCC.\n4. Tick **Admin Access** to also allow logged-in admins and the host.\n\nThe server keeps its own copy of this list where clients can't change it. A unit variable that a client could set (`MCC_allowed`) is not trusted.\n\n### Zeus for MCC users\n\nWith **Zeus for MCC Users** on (the default), allowed players get Zeus automatically. Players who are not allowed get nothing. Set it in **MCC 5 Mission Settings** or in CBA **MCC General > Zeus**. See [Zeus tools](zeus-tools.md#who-gets-zeus).\n\nIf you use the vanilla **Game Master** module for some players, MCC leaves those players' Zeus alone.\n\n## Network security\n\nMCC 5 rebuilt its network code:\n- No code is sent over the network any more. Remote calls go to named functions.\n- There is a full remoteExec whitelist for MCC's functions and commands.\n- The mod no longer forces remoteExec mode 2.\n- CBA text settings are read as data, not run as code.\n\nOn top of that you can pick a **Network Security** level for each mission.\n\n### Normal and Strict\n\nSet it in Eden: **MCC 5 > MCC 5 Mission Settings... > MCC 5 > Network Security**.\n\n| Level | What it does |\n|---|---|\n| **Normal** (default) | MCC accepts network requests from any player. This is the old behaviour. |\n| **Strict (recommended for public servers)** | In multiplayer, MCC refuses requests that came over the network from players who are not allowed to use MCC. Requests from the server or the same machine are always fine. |\n\n- Strict has no effect in single player.\n- Without an Access Rights module, everyone is allowed, so Strict changes little. Use Strict together with the Access Rights module.\n- Each refused call is written to the RPT as `MCC network security: refused <function> from owner <id>`.\n- The server tells clients every 10 seconds (and when players join or leave) which players are allowed, so clients can check requests too.\n\nFor a mission without Eden attributes, put this in `description.ext`:\n\n```\nMCC_networkSecurity = 1;\n```\n\n### Engine whitelist (strongest)\n\nFor the strongest lock-down, add an engine remoteExec whitelist to your mission's `description.ext`. It blocks every function and command that is not listed, and keeps MCC working:\n\n```cpp\nclass CfgRemoteExec\n{\n\tclass Functions\n\t{\n\t\tmode = 1;\n\t\tjip = 1;\n\t\t#include \"\\mcc_sandbox_mod\\mcc\\cfg\\CfgRemoteExec.hpp\"\n\t\t#include \"\\mcc_sandbox_mod\\mcc\\radio\\CfgRemoteExec.hpp\"\n\t\t#include \"\\mcc_sandbox_mod\\mcc\\aas\\CfgRemoteExec.hpp\"\n\t};\n\tclass Commands\n\t{\n\t\tmode = 1;\n\t\t#include \"\\mcc_sandbox_mod\\mcc\\cfg\\CfgRemoteExecCommands.hpp\"\n\t};\n};\n```\n\n- If your mission or other mods use their own remoteExec calls, add those classes too.\n- Test the mission in multiplayer after turning this on.\n- Blocked calls show in the server RPT as `remoteExec ... blocked`.\n\nYou can use the Network Security level, the engine whitelist, or both.\n\n## Public server checklist\n\n1. Place an **Access Rights** module with your admins' UIDs (and tick Admin Access if you want).\n2. Set **Network Security** to **Strict**.\n3. Optional: add the engine whitelist above.\n4. Decide if everyone allowed should get Zeus (**Zeus for MCC Users**).\n5. Test with a second, non-admin player.\n\n## Other multiplayer settings\n\n- **Sync Jip** (MCC General, On): players who join in progress sync with the server.\n- **Teleport to Team** (MCC General, JIP Only): when players can teleport to their squad leader.\n- **Kick Hot Mic** (MCC Radio): kicks a player with an open mic after a time. Only with the MCC radio system.\n\nSee [Settings](settings.md).\n\n## License for servers\n\nMCC 5 is under the GPL-3.0, so any server may run it. See [License](license.md).\n", "campaign": "# Campaign\n\nThe MCC campaign is a long game mode. MCC generates one Mission Wizard mission (an \"AO\", area of operations) after another across the map. Players earn resources, push the front line out from their base, and the campaign ends after a set number of missions or when the enemy runs out of places.\n\nIn MCC 5 a campaign can run **up to 3 AOs at the same time**.\n\n## Quick start: sample missions\n\nThe quickest way to try it is with the campaign missions that ship with the mod. In the multiplayer scenario list, look for names like:\n\n- **(MCC) Campaign** and **(MCC) Campaign CSAT** (Altis, Tanoa)\n- **(MCC) Campaign BAF**, **USMC**, **USA**, **RU**, **GU**, **TK** on other maps\n- **(MCC RHS) Campaign USA vs RU**, **CHDKZ vs USA**, **RU vs USA** (need RHS)\n\nSome need the map or mods in their name.\n\n## Set up your own campaign\n\n1. Place a **Start Location** module for the players' side with **Type: Main**. The campaign needs at least one HQ start location.\n2. Place a **Campaign init** module (**MCC 5 > Place MCC Module > Campaign Init**, or under (MCC) General).\n3. Set its options (below).\n4. Optional: turn on Role Selection and time acceleration. The module description recommends them.\n5. Optional: place empty markers with **\"ao\"** in their name where you want AOs. If you place any, MCC uses only those. Without them, MCC picks towns, military places and nature locations from the map that are at least 700 m from the start locations.\n\nYou can also start a campaign in game with the Zeus module **Campaign init**. It asks the same questions. Only one campaign can run at a time (\"Campaign already running\").\n\n## Campaign init options\n\n| Option | What it does | Default |\n|---|---|---|\n| **Players Faction** | Faction class name of the players | `BLU_F` |\n| **Rival Players Side** | A second player side. Rival players gain resources from killing the main faction's players. None, West, East, Independent, Civilian | None |\n| **Enemy Faction** | Faction class name of the enemy | `OPF_F` |\n| **Civilian Faction** | Faction class name of the civilians | `CIV_F` |\n| **Number of Missions** | Missions until the campaign ends: 5, 10, 15 or unlimited | 10 |\n| **Difficulty** | Easy, Medium, Hard | Medium |\n| **Intro** | Cinematic, Pop-Up (the operation screen with or without the camera), None | Pop-Up |\n| **Starting Tickets** | Respawn tickets for each player side | 100 |\n| **Missions Rotation** | After each set of missions MCC picks a new location | 3 |\n| **Tile Size** | MCC divides the map into tiles of this size (meters) | 400 |\n| **Load from DB** | Load saved campaign data from the database | Off |\n\n## Campaign settings\n\nThese are in **MCC 5 Mission Settings > MCC 5** and in CBA **MCC Mission Wizard > Campaign**:\n\n| Setting | What it does | Default |\n|---|---|---|\n| **Campaign: Simultaneous AOs** | How many AOs can be active at once, 1 to 3 | 1 |\n| **Campaign: AO Size** | Objective radius of every AO, in meters | 300 |\n| **Campaign: Ambient Groups Cap** | Max ambient enemy groups kept around players (2 per player, up to this) | 18 |\n| **Mission Wizard: Max Objectives** | Objectives per AO. Above 3, each extra one has a difficulty based chance | 3 |\n| **Mission Wizard: Max Spawned Units** | Cap on the units one AO may spawn | 200 |\n\nThe ambient cap is read every cycle, so you can change it during the campaign.\n\n## What happens during a campaign\n\nAt the start:\n- The time multiplier is raised to at least 12.\n- Each player side gets its starting tickets.\n- The map is split into tiles and shown with markers. The players' base area is painted in their colour.\n- Ambient enemy patrols start around players.\n- The campaign data is saved to the database every 20 minutes.\n\nEach AO:\n- Is its own Mission Wizard mission with its own zones and objectives.\n- About 1 in 5 is a **recon** mission, picked at a random spot.\n- The first missions are easier: no enemy vehicles or artillery in the first 3, no armor in the first 4. After that the chance grows with difficulty.\n- A radio tower objective may be added, more often on higher difficulty.\n\nWhen an AO is done:\n- Rewards are worked out from the objectives done and failed and the tickets lost.\n- The AO's objectives are removed. The area is cleaned up once no player is near.\n- For normal (non recon) AOs, the borders move: tiles turn to the players' colour.\n- A new AO starts.\n\nThe campaign ends when the number of missions is reached, or when no enemy locations are left (a win for everyone).\n\nEach in-game day the campaign also updates tickets, weather and the enemy's behaviour. A **Campaign Evac** vehicle (Evac Vehicle module) respawns each in-game day.\n\n## Tips\n\n- Don't run more AOs than your server can take. Start with 1.\n- Use **Max Spawned Units** to keep each AO light.\n- Headless clients help a lot in long campaigns. See [GAIA AI](gaia.md#headless-clients).\n- For a one-off mission, use the [Mission Wizard](mission-wizard.md) instead.\n\nThe campaign code has more details (resource rewards, day cycle, database) than are covered here. As a mission maker you only set the options above.\n", "troubleshooting": "# Troubleshooting\n\n## The RPT log\n\nMost answers are in the Arma 3 log file (RPT).\n\n- **Your PC**: `%LOCALAPPDATA%\\Arma 3\\` (paste it into the Windows Explorer address bar). Open the newest `.rpt` file.\n- **Dedicated server**: the server's own RPT, in the server's profile or log folder.\n\nGAIA and most MCC logic run on the server. For AI problems in multiplayer, read the **server** RPT.\n\n### Lines to look for\n\n| Line starts with | What it tells you |\n|---|---|\n| `MCC compat:` | Which of CBA, ACE, RHS and CUP MCC found |\n| `GAIA: AI mods detected` | Whether LAMBS Danger, LAMBS Suppression and HBQ were found |\n| `MCC: Eden attribute` | Each MCC 5 Mission Settings value applied at mission start, or why it was not applied |\n| `MCC Zeus: assigned` / `MCC Zeus: removed` | Zeus given to or taken from a player |\n| `MCC Mission Wizard:` | Editor and runtime Mission Wizard messages and errors |\n| `MCC campaign:` | Campaign AOs starting |\n| `GAIA` cycle timings | AI performance (needs GAIA Debug on) |\n| `GAIA tasks:` | Groups following tasks (needs GAIA Debug on) |\n| `MCC network security: refused` | A blocked network call (only in Strict mode) |\n| `remoteExec ... blocked` | A call blocked by the engine remoteExec whitelist |\n\n## Debug settings\n\n- **GAIA Debug** (CBA **MCC GAIA**, or MCC 5 Mission Settings): GAIA timings per phase in the server RPT, GAIA debug markers, support request logs.\n- **Debug markers** in the Zeus Mission Wizard dialog.\n- **General Markers** in the editor Mission Wizard: shows objective zones, roadblocks and enemy positions on the map.\n\n## Common problems\n\n### The mod does not load / no MCC 5 menu in Eden\n\n- Tick both **MCC Sandbox 5** and **CBA_A3** in the launcher.\n- The launcher must point at the `@mcc_sandbox_a3` folder (the one with `addons\\mcc_sandbox_mod.pbo` inside).\n- Use the release zip **ARMA3-MCC5.zip**, not GitHub's source code download.\n- Don't load an older MCC version at the same time.\n- On a server, check the `-mod` line, and `verifySignatures` (the PBO is not signed).\n\nSee [Installation](installation.md#install-problems).\n\n### I don't get Zeus\n\nCheck these in order:\n\n1. **Zeus for MCC Users** must be On (MCC 5 Mission Settings or CBA MCC General > Zeus). It is On by default.\n2. You must be allowed to use MCC. With an **Access Rights** module in the mission, only listed UIDs, synced units and (if ticked) admins are allowed. Without the module, everyone is.\n3. Wait a few seconds after spawning. The server hands out Zeus every 10 seconds, once your client is ready.\n4. If you already have a Zeus from another module (for example Game Master), MCC leaves it alone. Use that one.\n5. Press **Ctrl+Delete** (the MCC keybind) or **Y**. If you get \"MCC: you have no Zeus access\", MCC has not given you a Zeus. Look for `MCC Zeus: assigned` in the server RPT.\n6. The key may be taken by another mod. Change \"Open Zeus (MCC)\" in CBA keybinds (MCC).\n\n### The right-click menu doesn't open in Zeus\n\n- Click the right button, don't hold it. Holding moves the camera.\n- Right-click the soldier himself, not empty ground.\n- With a group selected, right-clicking a unit of another group gives a waypoint instead. Click empty ground to clear the selection, or select the group you right-click.\n- With ZEN loaded, the options are in the ZEN menu under **MCC 5**, and ZEN only opens it when no AI is selected.\n- Groups led by a player don't get the menu.\n\n### The Mission Wizard faction list is empty or a faction is missing\n\n- The list shows factions that have at least one soldier with public scope. Factions without soldiers are not listed.\n- Civilian factions are only in the **Civilian Faction** list. Military factions are only in the Enemy and Player lists.\n- The list is built once per game session. If you loaded a new mod, **restart the game**.\n- A faction saved in the mission whose mod is not loaded now shows as \"(not loaded)\". Load the mod or pick another faction.\n\n### Generate Mission does nothing or shows an error\n\nRead the notification. The common ones are in [Mission Wizard: error messages](mission-wizard.md#error-messages). The full reason is in the RPT under `MCC Mission Wizard:`.\n\n- \"the enemy faction ... and the player faction ... are on the same side\": pick factions on different sides.\n- \"the center of the mission area is in the water\": move the camera, or select a trigger on land.\n- \"Unit cap reached\": raise **Max AI Units**, or lower players, difficulty or size.\n\n### The Zeus Mission Wizard says \"MCC factions are not ready yet\"\n\nMCC is still starting. Wait a little and place the module again. \"MCC is generating a mission, try again later\" means another mission is being built right now.\n\n### AI does not move\n\n- **Is the group under GAIA?** GAIA only commands groups with a zone and behaviour. Use **GAIA: Control Group** or **Assign AI to zone** in Zeus, or the Eden group attribute or **Assign AI to zone** module. See [GAIA AI](gaia.md#putting-groups-under-gaia).\n- **Does the zone exist?** The Eden group attribute needs a zone number that exists when the mission runs. 0 means no GAIA.\n- **Behaviour**: **Fortify** groups stay in buildings on purpose. **Defensive** groups don't leave their zone. Default, BIS Defence and BIS Patrol don't get GAIA's own orders.\n- **Is the leader a player?** GAIA won't take a group led by a player.\n- **LAMBS task waypoint?** GAIA leaves groups on LAMBS task waypoints alone.\n- **Caching**: a cached group far from players is frozen (dynamic simulation) or removed until a player comes close. This is normal.\n- **Mod clash**: try setting **LAMBS Danger Compatibility** or **HBQ Driving AI Compatibility** to Off to test. See [AI mod compatibility](ai-mod-compatibility.md).\n- Turn on **GAIA Debug** and check the server RPT.\n\n### AI vehicles get stuck\n\n- Keep **Unstick Vehicles** on.\n- With HBQ Advanced Driving AI loaded, GAIA leaves unsticking to HBQ.\n- Groups on foot that borrowed a vehicle re-plan after 90 seconds without progress, and walk after 3 tries.\n\n### AI never calls artillery, CAS or reinforcements\n\n- **AI Support Requests** must be On, and the kind you want (Artillery, CAS, Reinforcements).\n- Artillery needs a GAIA mortar or artillery group in range.\n- No artillery or CAS when friendlies are within **Danger Close Distance** (200 m).\n- The contact must reach the **Threat Threshold** and a GAIA group in combat must be within **Contact Range**.\n- Each kind has a cooldown and a budget per mission. CAS has only 2 per side by default.\n- With **CAS Needs Own Aircraft** on, the side needs an armed aircraft.\n\n### My Eden MCC settings don't apply\n\n- Check the RPT for `MCC: Eden attribute ... not applied`. A setting forced in `cba_settings.sqf`, or by the server admin with \"overwrite mission\" priority, wins over the mission value.\n- Values left at \"Use addon setting\" use the CBA value, by design.\n\n### Supply trucks are empty\n\nWith **Limited Logistics** on, supply runs out. Park the truck within **Base Radius** of your side's start location or an RTS base building, and make sure your side has resources. See [Limited logistics](logistics.md).\n\n### Network calls are refused\n\n`MCC network security: refused` means Strict mode blocked a player who is not allowed to use MCC. Add the player to the **Access Rights** module or set Network Security to Normal. See [Multiplayer and security](multiplayer-and-security.md).\n\n## Reporting a problem\n\nPlease send:\n- the RPT log (and the server RPT for multiplayer),\n- which mods were loaded,\n- what you did,\n- what happened, and a screenshot if you can.\n\nMissions made with older MCC versions aren't supported.\n", "license": "# License\n\nMCC Sandbox 5 is free software, released under the **GNU General Public License v3** (GPL-3.0). This is the same license as the original MCC Sandbox by **Shay_gman & Spirit**, which MCC 5 is built on.\n\n## What that means\n\n- You may use MCC 5 for free, in single player, multiplayer and on any server.\n- You may share it.\n- You may change it. If you share a changed version, it must stay under the GPL-3.0, with its source available, and keep the credits.\n- There is no warranty.\n\n## Credit\n\nMCC 5 is built on MCC Sandbox by **Shay_gman & Spirit**. Their credit must stay in place.\n\n## Source code\n\nMCC 5 is open source. The full source is on GitHub: [github.com/haganahzion/Arma3-MCC5](https://github.com/haganahzion/Arma3-MCC5).\n\n## Community rules\n\nThe MCC 5 Discord, our servers and MCC 5 support have their own [community rules](https://github.com/haganahzion/Arma3-MCC5/blob/mcc5/COMMUNITY_RULES.md): no selling it, ask before reuploading, no monetized servers without permission, and keep the credits. Breaking them can get you removed from the community and its support. They don't change what the license allows.\n\n## Full text\n\nThe full license is in `LICENSE.md` in the mod (also inside the release zip), and at [gnu.org/licenses/gpl-3.0](https://www.gnu.org/licenses/gpl-3.0.html).\n\nCommunity and support: [Discord](https://discord.gg/bxwX5EkMEf).\n", "changelog": "# Changelog\n\nA short summary of what changed in MCC 5. The full list is in `MCC_changelog.txt` (sections R34 and R35) in the mod.\n\n\n## v5.0.4\n\n- GAIA task groups put the task first: they march straight to it, return fire on the way, only stop to fight enemies within 150 m, and are no longer sent off to other fights. Lost or stuck groups get their order again.\n- GAIA no longer spawns reinforcements for a side that has players. New setting: Reinforcements For Player Sides (off).\n\n## v5.0.2\n\n- Fixed GAIA Control Group sending groups to the map corner when a task's destination was an object or missing.\n- AI groups that follow tasks now also see the editor Mission Wizard's tasks.\n- Groups the editor Mission Wizard puts in zones are registered with GAIA straight away and can be cached.\n- The Zeus MCC 5 button makes placed modules editable on the server.\n- \"Disable Fatigue\" now works the right way round; Group Radio Distance goes up to 5000 m.\n- Fixed setting labels (View Distance, Grass Detail, IEDs hidden) and the \"Ambient Units\" module name.\n- The cache objective is now spelled \"Destroy Weapon Cache\".\n- The mod's Website button and in-game help link to this wiki.\n\n## v5.0.1\n\nThe full MCC 5 overhaul: a new Eden and Zeus interface, a rewritten GAIA AI commander, an in-editor Mission Wizard, ACE3/RHS/CUP support and optional limited logistics.\n\nThe release notes say this build has not been tested in game yet. Please report problems with your RPT log and a screenshot. See [Troubleshooting](troubleshooting.md).\n\nAlso new: MCC 5 artwork (logo and loading screen).\n\n## R35: the MCC 5 roadmap\n\n### New interface\n- The old MCC main menu (\"--= MCC =--\" action / Ctrl+Del) is gone. MCC users get Zeus automatically (setting \"Zeus for MCC Users\"). Limit it with the Access Rights module.\n- New Zeus modules: Mission Wizard, Artillery, Convoy Spawn / Drive To, Air Drop, CAS Console, Reinforcements, Paradrop, Delete Brush, Jukebox, Hostage, Briefing, Broadcast, Save/Load, Start Location, Mission Start, Arsenal.\n- New Zeus module **GAIA: Control Group**: GAIA takes over any AI group, uses vehicles, works through the side's tasks and then patrols.\n- New Eden modules: Mission Wizard, Convoy, Fire Mission, Music/Sound.\n- New Eden attributes: GAIA control on groups, Zeus editable on objects.\n- Eden scenario attributes for logistics, Mission Wizard, campaign, GAIA support and Zeus access, in the **MCC 5** menu.\n- The editor Mission Wizard: all the old options, up to 8 objectives of all 12 types, factions from a list, and it builds the whole mission as editor objects in an \"MCC Mission Wizard\" layer. See [Mission Wizard](mission-wizard.md).\n\n### GAIA / AI\n- Performance rewrite: group registry, one scheduler, cached classification, no 91 zone limit, dynamic simulation caching.\n- Vehicles: AI borrow empty vehicles for long trips, dismount with the leader at the objective, re-mount after contact, and detect stuck or wrong-way vehicles. Fixed AI driving to the map center.\n- AI call artillery, CAS and reinforcements. Coordinated attack, flank, support-by-fire and reserve roles.\n- Headless client balancing across all headless clients.\n- Works with LAMBS Danger, LAMBS Suppression and HBQ Advanced Driving AI (detected automatically).\n\nSee [GAIA AI](gaia.md).\n\n### Missions\n- Mission Wizard up to 8 objectives, mission size (Small to Huge), unit cap.\n- Campaign with up to 3 AOs at the same time. See [Campaign](campaign.md).\n\n### Mods\n- ACE3, RHS and CUP detected automatically. Class lists switch to the loaded mods. See [Mod support](mod-support.md).\n\n### Logistics\n- Optional limited logistics (Off / Fuel only / Full): supply trucks and crates run out and refill at bases. See [Limited logistics](logistics.md).\n- Side resources are server-authoritative.\n\n## R34: the MCC 5 revamp\n\n### Security\n- All `BIS_fnc_MP` calls replaced with `remoteExec`.\n- No more code sent over the network (`BIS_fnc_spawn`, `compile format`, remoteExec \"call\" or \"addAction\" with code). Named functions instead.\n- Rebuilt remoteExec whitelist (functions and engine commands). The mod no longer forces remoteExec mode 2.\n- New Eden attribute: Network Security (Normal / Strict).\n- `mcc\\cfg\\strictRemoteExec.txt` explains how to lock down public servers.\n- CBA text settings are read as data (`parseSimpleArray`) instead of being run as code.\n\nSee [Multiplayer and security](multiplayer-and-security.md).\n\n### Changed\n- 154 scripts that ran through `execVM` are now compiled once as functions.\n- CBA settings use `CBA_fnc_addSetting`.\n- Wiki links point to mccsandbox.fandom.com.\n\n### Fixed\n- Hidden characters in config.cpp broke the \"Add Valor\" Zeus module entry.\n- A Mission Wizard error message used an invalid remoteExec target.\n\n## Other fixes in MCC 5\n\nFrom the release notes:\n- Broken Add Valor Zeus module.\n- Set Resources swapping ammo and repair.\n- East crates ignored.\n- Settings registered twice.\n- Mission Wizard hanging.\n- Settings modules not applying.\n\n## Coming from an older MCC\n\n- The MCC menu is gone. Use Zeus modules and Eden modules and attributes.\n- Missions made with older MCC versions are not supported.\n- Don't load an older MCC and MCC 5 together.\n"}, "html": {"index": "<h1>MCC Sandbox 5 wiki<\/h1>\n<p>MCC Sandbox 5 (Mission Control Center, version 5.0.4) is an Arma 3 mod for building and running missions. You work in two places:<\/p>\n<ul><li>In the Eden editor, a new <strong>MCC 5<\/strong> menu in the top menu bar holds all mission settings, an editor Mission Wizard that builds a whole mission for you, and quick placement of MCC modules.<\/li><li>In Zeus. Players allowed to use MCC get Zeus in game. Every MCC tool is in the Zeus <strong>Modules<\/strong> tab, and right-clicking an AI soldier gives quick GAIA orders for his group.<\/li><\/ul>\n<p>Behind both sits <strong>GAIA<\/strong>, the MCC AI commander. GAIA moves AI groups around their zones, uses vehicles, coordinates attacks and can call artillery, CAS and reinforcements.<\/p>\n<p>The old MCC main menu is gone. Everything it did is now a Zeus module, an Eden module or an Eden attribute.<\/p>\n<blockquote><p>The release notes say this build has not been tested in game yet. If something breaks, please report it with your RPT log. See <a href=\"troubleshooting.md\">Troubleshooting<\/a>.<\/p><\/blockquote>\n<h2>Quick links<\/h2>\n<ul><li><a href=\"installation.md\">Installation<\/a>: get the mod running, also on a dedicated server<\/li><li><a href=\"getting-started.md\">Getting started<\/a>: your first mission in about 10 minutes<\/li><li><a href=\"eden-editor.md\">Eden editor<\/a>: the MCC 5 menu, Mission Settings, Eden modules and attributes<\/li><li><a href=\"mission-wizard.md\">Mission Wizard<\/a>: generate a mission in the editor, in Zeus, or at mission start<\/li><li><a href=\"zeus-tools.md\">Zeus tools<\/a>: every MCC Zeus module and how to use it<\/li><li><a href=\"gaia.md\">GAIA AI<\/a>: zones, behaviours, vehicles, support requests, caching<\/li><li><a href=\"ai-mod-compatibility.md\">AI mod compatibility<\/a>: LAMBS Danger, LAMBS Suppression, HBQ Advanced Driving AI<\/li><li><a href=\"settings.md\">Settings<\/a>: every MCC setting with its default<\/li><li><a href=\"logistics.md\">Limited logistics<\/a>: finite fuel, ammo and repair<\/li><li><a href=\"mod-support.md\">Mod support<\/a>: ACE3, RHS and CUP<\/li><li><a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a>: servers, Access Rights, network security<\/li><li><a href=\"campaign.md\">Campaign<\/a>: the MCC campaign mode<\/li><li><a href=\"troubleshooting.md\">Troubleshooting<\/a>: logs and common problems<\/li><li><a href=\"changelog.md\">Changelog<\/a>: what changed in MCC 5<\/li><li><a href=\"license.md\">License<\/a><\/li><\/ul>\n<h2>Requirements<\/h2>\n<ul><li>Arma 3 (current version)<\/li><li><strong>CBA_A3<\/strong> (required)<\/li><\/ul>\n<p>Optional mods. MCC detects them on its own and works with or without them:<\/p>\n<ul><li>ACE3<\/li><li>RHS<\/li><li>CUP<\/li><li>LAMBS Danger.fsm<\/li><li>LAMBS Suppression<\/li><li>HBQ Advanced Driving AI<\/li><\/ul>\n<p>Do not load an older MCC version at the same time as MCC 5. Missions made with older MCC versions are not supported.<\/p>\n<h2>Credit<\/h2>\n<p>MCC 5 is built on MCC Sandbox by <strong>Shay_gman &amp; Spirit<\/strong>.<\/p>\n<h2>License<\/h2>\n<p>MCC 5 is free software under the GNU General Public License v3 (GPL-3.0), like the original MCC Sandbox.<\/p>\n<ul><li>You may use it, share it and run it on any server.<\/li><li>You may change it. If you share a changed version, keep it under the GPL-3.0 with its source, and keep the credits.<\/li><li>Keep the credit to Shay_gman &amp; Spirit.<\/li><\/ul>\n<p>Source code: <a href=\"https://github.com/haganahzion/Arma3-MCC5\">GitHub<\/a>. Read more on the <a href=\"license.md\">License<\/a> page. Community and support: <a href=\"https://discord.gg/bxwX5EkMEf\">Discord<\/a>. Get it on the <a href=\"https://steamcommunity.com/sharedfiles/filedetails/?id=3840123393\">Steam Workshop<\/a>.<\/p>", "installation": "<h1>Installation<\/h1>\n<h2>What you need<\/h2>\n<ul><li>Arma 3, current version.<\/li><li><strong>CBA_A3<\/strong>. MCC needs it. Subscribe to it on the Steam Workshop.<\/li><li>Optional: ACE3, RHS, CUP, LAMBS Danger.fsm, LAMBS Suppression, HBQ Advanced Driving AI. MCC finds them by itself.<\/li><\/ul>\n<h2>Steam Workshop (easiest)<\/h2>\n<p>Subscribe to <a href=\"https://steamcommunity.com/sharedfiles/filedetails/?id=3840123393\">MCC Sandbox 5 on the Steam Workshop<\/a>. Steam also subscribes you to CBA_A3. In the Arma 3 Launcher, tick both under <strong>Mods<\/strong> and play. Servers that check signatures need the key from the mod's <code>keys<\/code> folder.<\/p>\n<h2>Manual install: get the right file<\/h2>\n<p>Download <strong>ARMA3-MCC5.zip<\/strong> from the latest GitHub release. Use the release file. GitHub's \"Code &gt; Download ZIP\" button gives you the source code, not the mod.<\/p>\n<p>When you unzip it you get this folder:<\/p>\n<pre><code>@mcc_sandbox_a3\\\n    addons\\mcc_sandbox_mod.pbo\n    mod.cpp\n    INSTALL.md<\/code><\/pre>\n<h2>Install with the Arma 3 Launcher<\/h2>\n<ol><li>Copy the whole <code>@mcc_sandbox_a3<\/code> folder into your Arma 3 folder. For example: <code>C:\\Program Files (x86)\\Steam\\steamapps\\common\\Arma 3\\@mcc_sandbox_a3<\/code> Any folder works. The Arma 3 folder is just the simplest.<\/li><li>Open the <strong>Arma 3 Launcher<\/strong> and go to <strong>Mods<\/strong>.<\/li><li>Use <strong>Add watched folder<\/strong>, or <strong>Local mod<\/strong> in the \"...\" menu, and pick the <code>@mcc_sandbox_a3<\/code> folder.<\/li><li>Tick <strong>MCC Sandbox 5<\/strong> and <strong>CBA_A3<\/strong>. Tick any optional mods you want.<\/li><li>Untick or remove any older <strong>MCC Sandbox<\/strong> version. Two MCC versions loaded together will conflict.<\/li><li>Press <strong>Play<\/strong>.<\/li><\/ol>\n<h2>Dedicated server<\/h2>\n<ol><li>Copy <code>@mcc_sandbox_a3<\/code> into the server folder.<\/li><li>Add it to the server start line together with CBA: ``<code> -mod=@CBA_A3;@mcc_sandbox_a3 <\/code>``<\/li><li>This build is <strong>not signed<\/strong>. If the server uses <code>verifySignatures=2<\/code>, turn signature checks off or sign the PBO with your own key.<\/li><\/ol>\n<p>See <a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a> for access rights and network security on public servers.<\/p>\n<h2>Headless clients<\/h2>\n<p>Give every headless client the same <code>-mod<\/code> line as the server:<\/p>\n<pre><code>-mod=@CBA_A3;@mcc_sandbox_a3<\/code><\/pre>\n<p>GAIA spreads new AI groups across all connected headless clients by itself. This is the <strong>Headless Client Balancing<\/strong> setting, on by default. See <a href=\"gaia.md#headless-clients\">GAIA AI<\/a>.<\/p>\n<h2>Updating<\/h2>\n<ol><li>Close Arma 3 (and stop the server).<\/li><li>Replace the old <code>@mcc_sandbox_a3<\/code> folder with the new one from the new zip.<\/li><li>Keep the same folder location, so the launcher and your <code>-mod<\/code> line still point to it.<\/li><li>Do the same on the server and on every headless client. All machines should run the same version.<\/li><\/ol>\n<h2>Removing MCC or old versions<\/h2>\n<ul><li>To stop using MCC, untick it in the launcher, or remove it from the <code>-mod<\/code> line.<\/li><li>To remove it fully, delete the <code>@mcc_sandbox_a3<\/code> folder.<\/li><li>Remove or untick any older <strong>MCC Sandbox<\/strong> version. Don't run two MCC versions together.<\/li><li>Missions made with older MCC versions are not supported in MCC 5.<\/li><li>Missions that use MCC modules need the mod loaded to work.<\/li><\/ul>\n<h2>Check that it works<\/h2>\n<ol><li>Start the game with MCC and CBA ticked.<\/li><li>Open the <strong>Eden editor<\/strong> on any map.<\/li><li>Look for <strong>MCC 5<\/strong> in the top menu bar. It works with or without 3den Enhanced.<\/li><\/ol>\n<p>If the menu is there, the mod is loaded. Next step: <a href=\"getting-started.md\">Getting started<\/a>.<\/p>\n<h2>Install problems<\/h2>\n<p><strong>No MCC 5 menu in Eden.<\/strong><\/p>\n<ul><li>Check that both <strong>MCC Sandbox 5<\/strong> and <strong>CBA_A3<\/strong> are ticked in the launcher.<\/li><li>Check the folder. The launcher must point to <code>@mcc_sandbox_a3<\/code>, the folder that contains <code>addons\\mcc_sandbox_mod.pbo<\/code>. Pointing at a parent folder or at the zip does not work.<\/li><li>Make sure you used the release zip, not the source code download.<\/li><\/ul>\n<p><strong>Errors or strange behaviour right after install.<\/strong><\/p>\n<ul><li>Make sure no older MCC version is loaded at the same time.<\/li><\/ul>\n<p><strong>Server kicks players or refuses the mod.<\/strong><\/p>\n<ul><li>The PBO is not signed. With <code>verifySignatures=2<\/code> the server refuses it. Turn the check off or sign the PBO yourself.<\/li><\/ul>\n<p><strong>Server runs but MCC does nothing there.<\/strong><\/p>\n<ul><li>Check the server <code>-mod<\/code> line includes both <code>@CBA_A3<\/code> and <code>@mcc_sandbox_a3<\/code>.<\/li><li>Headless clients need the same <code>-mod<\/code> line.<\/li><\/ul>\n<p>For anything else, look at the RPT log. See <a href=\"troubleshooting.md\">Troubleshooting<\/a>.<\/p>", "getting-started": "<h1>Getting started
