li><strong>Is the group under GAIA?<\/strong> GAIA only commands groups with a zone and behaviour. Use <strong>GAIA: Control Group<\/strong> or <strong>Assign AI to zone<\/strong> in Zeus, or the Eden group attribute or <strong>Assign AI to zone<\/strong> module. See <a href=\"gaia.md#putting-groups-under-gaia\">GAIA AI<\/a>.<\/li><li><strong>Does the zone exist?<\/strong> The Eden group attribute needs a zone number that exists when the mission runs. 0 means no GAIA.<\/li><li><strong>Behaviour<\/strong>: <strong>Fortify<\/strong> groups stay in buildings on purpose. <strong>Defensive<\/strong> groups don't leave their zone. Default, BIS Defence and BIS Patrol don't get GAIA's own orders.<\/li><li><strong>Is the leader a player?<\/strong> GAIA won't take a group led by a player.<\/li><li><strong>LAMBS task waypoint?<\/strong> GAIA leaves groups on LAMBS task waypoints alone.<\/li><li><strong>Caching<\/strong>: a cached group far from players is frozen (dynamic simulation) or removed until a player comes close. This is normal.<\/li><li><strong>Mod clash<\/strong>: try setting <strong>LAMBS Danger Compatibility<\/strong> or <strong>HBQ Driving AI Compatibility<\/strong> to Off to test. See <a href=\"ai-mod-compatibility.md\">AI mod compatibility<\/a>.<\/li><li>Turn on <strong>GAIA Debug<\/strong> and check the server RPT.<\/li><\/ul>\n<h3>AI vehicles get stuck<\/h3>\n<ul><li>Keep <strong>Unstick Vehicles<\/strong> on.<\/li><li>With HBQ Advanced Driving AI loaded, GAIA leaves unsticking to HBQ.<\/li><li>Groups on foot that borrowed a vehicle re-plan after 90 seconds without progress, and walk after 3 tries.<\/li><\/ul>\n<h3>AI never calls artillery, CAS or reinforcements<\/h3>\n<ul><li><strong>AI Support Requests<\/strong> must be On, and the kind you want (Artillery, CAS, Reinforcements).<\/li><li>Artillery needs a GAIA mortar or artillery group in range.<\/li><li>No artillery or CAS when friendlies are within <strong>Danger Close Distance<\/strong> (200 m).<\/li><li>The contact must reach the <strong>Threat Threshold<\/strong> and a GAIA group in combat must be within <strong>Contact Range<\/strong>.<\/li><li>Each kind has a cooldown and a budget per mission. CAS has only 2 per side by default.<\/li><li>With <strong>CAS Needs Own Aircraft<\/strong> on, the side needs an armed aircraft.<\/li><\/ul>\n<h3>My Eden MCC settings don't apply<\/h3>\n<ul><li>Check the RPT for <code>MCC: Eden attribute ... not applied<\/code>. A setting forced in <code>cba_settings.sqf<\/code>, or by the server admin with \"overwrite mission\" priority, wins over the mission value.<\/li><li>Values left at \"Use addon setting\" use the CBA value, by design.<\/li><\/ul>\n<h3>Supply trucks are empty<\/h3>\n<p>With <strong>Limited Logistics<\/strong> on, supply runs out. Park the truck within <strong>Base Radius<\/strong> of your side's start location or an RTS base building, and make sure your side has resources. See <a href=\"logistics.md\">Limited logistics<\/a>.<\/p>\n<h3>Network calls are refused<\/h3>\n<p><code>MCC network security: refused<\/code> means Strict mode blocked a player who is not allowed to use MCC. Add the player to the <strong>Access Rights<\/strong> module or set Network Security to Normal. See <a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a>.<\/p>\n<h2>Reporting a problem<\/h2>\n<p>Please send:<\/p>\n<ul><li>the RPT log (and the server RPT for multiplayer),<\/li><li>which mods were loaded,<\/li><li>what you did,<\/li><li>what happened, and a screenshot if you can.<\/li><\/ul>\n<p>Missions made with older MCC versions aren't supported.<\/p>", "license": "<h1>License<\/h1>\n<p>MCC Sandbox 5 is free software, released under the <strong>GNU General Public License v3<\/strong> (GPL-3.0). This is the same license as the original MCC Sandbox by <strong>Shay_gman &amp; Spirit<\/strong>, which MCC 5 is built on.<\/p>\n<h2>What that means<\/h2>\n<ul><li>You may use MCC 5 for free, in single player, multiplayer and on any server.<\/li><li>You may share it.<\/li><li>You may change it. If you share a changed version, it must stay under the GPL-3.0, with its source available, and keep the credits.<\/li><li>There is no warranty.<\/li><\/ul>\n<h2>Credit<\/h2>\n<p>MCC 5 is built on MCC Sandbox by <strong>Shay_gman &amp; Spirit<\/strong>. Their credit must stay in place.<\/p>\n<h2>Source code<\/h2>\n<p>MCC 5 is open source. The full source is on GitHub: <a href=\"https://github.com/haganahzion/Arma3-MCC5\">github.com/haganahzion/Arma3-MCC5<\/a>.<\/p>\n<h2>Community rules<\/h2>\n<p>The MCC 5 Discord, our servers and MCC 5 support have their own <a href=\"https://github.com/haganahzion/Arma3-MCC5/blob/mcc5/COMMUNITY_RULES.md\">community rules<\/a>: no selling it, ask before reuploading, no monetized servers without permission, and keep the credits. Breaking them can get you removed from the community and its support. They don't change what the license allows.<\/p>\n<h2>Full text<\/h2>\n<p>The full license is in <code>LICENSE.md<\/code> in the mod (also inside the release zip), and at <a href=\"https://www.gnu.org/licenses/gpl-3.0.html\">gnu.org/licenses/gpl-3.0<\/a>.<\/p>\n<p>Community and support: <a href=\"https://discord.gg/bxwX5EkMEf\">Discord<\/a>.<\/p>", "changelog": "<h1>Changelog<\/h1>\n<p>A short summary of what changed in MCC 5. The full list is in <code>MCC_changelog.txt<\/code> (sections R34 and R35) in the mod.<\/p>\n<h2>v5.0.4<\/h2>\n<ul><li>GAIA task groups put the task first: they march straight to it, return fire on the way, only stop to fight enemies within 150 m, and are no longer sent off to other fights. Lost or stuck groups get their order again.<\/li><li>GAIA no longer spawns reinforcements for a side that has players. New setting: Reinforcements For Player Sides (off).<\/li><\/ul>\n<h2>v5.0.2<\/h2>\n<ul><li>Fixed GAIA Control Group sending groups to the map corner when a task's destination was an object or missing.<\/li><li>AI groups that follow tasks now also see the editor Mission Wizard's tasks.<\/li><li>Groups the editor Mission Wizard puts in zones are registered with GAIA straight away and can be cached.<\/li><li>The Zeus MCC 5 button makes placed modules editable on the server.<\/li><li>\"Disable Fatigue\" now works the right way round; Group Radio Distance goes up to 5000 m.<\/li><li>Fixed setting labels (View Distance, Grass Detail, IEDs hidden) and the \"Ambient Units\" module name.<\/li><li>The cache objective is now spelled \"Destroy Weapon Cache\".<\/li><li>The mod's Website button and in-game help link to this wiki.<\/li><\/ul>\n<h2>v5.0.1<\/h2>\n<p>The full MCC 5 overhaul: a new Eden and Zeus interface, a rewritten GAIA AI commander, an in-editor Mission Wizard, ACE3/RHS/CUP support and optional limited logistics.<\/p>\n<p>The release notes say this build has not been tested in game yet. Please report problems with your RPT log and a screenshot. See <a href=\"troubleshooting.md\">Troubleshooting<\/a>.<\/p>\n<p>Also new: MCC 5 artwork (logo and loading screen).<\/p>\n<h2>R35: the MCC 5 roadmap<\/h2>\n<h3>New interface<\/h3>\n<ul><li>The old MCC main menu (\"--= MCC =--\" action / Ctrl+Del) is gone. MCC users get Zeus automatically (setting \"Zeus for MCC Users\"). Limit it with the Access Rights module.<\/li><li>New Zeus modules: Mission Wizard, Artillery, Convoy Spawn / Drive To, Air Drop, CAS Console, Reinforcements, Paradrop, Delete Brush, Jukebox, Hostage, Briefing, Broadcast, Save/Load, Start Location, Mission Start, Arsenal.<\/li><li>New Zeus module <strong>GAIA: Control Group<\/strong>: GAIA takes over any AI group, uses vehicles, works through the side's tasks and then patrols.<\/li><li>New Eden modules: Mission Wizard, Convoy, Fire Mission, Music/Sound.<\/li><li>New Eden attributes: GAIA control on groups, Zeus editable on objects.<\/li><li>Eden scenario attributes for logistics, Mission Wizard, campaign, GAIA support and Zeus access, in the <strong>MCC 5<\/strong> menu.<\/li><li>The editor Mission Wizard: all the old options, up to 8 objectives of all 12 types, factions from a list, and it builds the whole mission as editor objects in an \"MCC Mission Wizard\" layer. See <a href=\"mission-wizard.md\">Mission Wizard<\/a>.<\/li><\/ul>\n<h3>GAIA / AI<\/h3>\n<ul><li>Performance rewrite: group registry, one scheduler, cached classification, no 91 zone limit, dynamic simulation caching.<\/li><li>Vehicles: AI borrow empty vehicles for long trips, dismount with the leader at the objective, re-mount after contact, and detect stuck or wrong-way vehicles. Fixed AI driving to the map center.<\/li><li>AI call artillery, CAS and reinforcements. Coordinated attack, flank, support-by-fire and reserve roles.<\/li><li>Headless client balancing across all headless clients.<\/li><li>Works with LAMBS Danger, LAMBS Suppression and HBQ Advanced Driving AI (detected automatically).<\/li><\/ul>\n<p>See <a href=\"gaia.md\">GAIA AI<\/a>.<\/p>\n<h3>Missions<\/h3>\n<ul><li>Mission Wizard up to 8 objectives, mission size (Small to Huge), unit cap.<\/li><li>Campaign with up to 3 AOs at the same time. See <a href=\"campaign.md\">Campaign<\/a>.<\/li><\/ul>\n<h3>Mods<\/h3>\n<ul><li>ACE3, RHS and CUP detected automatically. Class lists switch to the loaded mods. See <a href=\"mod-support.md\">Mod support<\/a>.<\/li><\/ul>\n<h3>Logistics<\/h3>\n<ul><li>Optional limited logistics (Off / Fuel only / Full): supply trucks and crates run out and refill at bases. See <a href=\"logistics.md\">Limited logistics<\/a>.<\/li><li>Side resources are server-authoritative.<\/li><\/ul>\n<h2>R34: the MCC 5 revamp<\/h2>\n<h3>Security<\/h3>\n<ul><li>All <code>BIS_fnc_MP<\/code> calls replaced with <code>remoteExec<\/code>.<\/li><li>No more code sent over the network (<code>BIS_fnc_spawn<\/code>, <code>compile format<\/code>, remoteExec \"call\" or \"addAction\" with code). Named functions instead.<\/li><li>Rebuilt remoteExec whitelist (functions and engine commands). The mod no longer forces remoteExec mode 2.<\/li><li>New Eden attribute: Network Security (Normal / Strict).<\/li><li><code>mcc\\cfg\\strictRemoteExec.txt<\/code> explains how to lock down public servers.<\/li><li>CBA text settings are read as data (<code>parseSimpleArray<\/code>) instead of being run as code.<\/li><\/ul>\n<p>See <a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a>.<\/p>\n<h3>Changed<\/h3>\n<ul><li>154 scripts that ran through <code>execVM<\/code> are now compiled once as functions.<\/li><li>CBA settings use <code>CBA_fnc_addSetting<\/code>.<\/li><li>Wiki links point to mccsandbox.fandom.com.<\/li><\/ul>\n<h3>Fixed<\/h3>\n<ul><li>Hidden characters in config.cpp broke the \"Add Valor\" Zeus module entry.<\/li><li>A Mission Wizard error message used an invalid remoteExec target.<\/li><\/ul>\n<h2>Other fixes in MCC 5<\/h2>\n<p>From the release notes:<\/p>\n<ul><li>Broken Add Valor Zeus module.<\/li><li>Set Resources swapping ammo and repair.<\/li><li>East crates ignored.<\/li><li>Settings registered twice.<\/li><li>Mission Wizard hanging.<\/li><li>Settings modules not applying.<\/li><\/ul>\n<h2>Coming from an older MCC<\/h2>\n<ul><li>The MCC menu is gone. Use Zeus modules and Eden modules and attributes.<\/li><li>Missions made with older MCC versions are not supported.<\/li><li>Don't load an older MCC and MCC 5 together.<\/li><\/ul>"}}</script>
<script>
(function () {
  var data = JSON.parse(document.getElementById("wiki-data").textContent);
  var order = data.order, pages = data.pages, html = data.html;
  var slugs = order.map(function (o) { return o[0]; });
  function slugify(t) { return t.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9 -]/g, "").trim().replace(/\s+/g, "-"); }
  function linkFor(href) {
    var m = /^([a-z0-9-]+)\.md(?:#([a-z0-9-]+))?$/i.exec(href);
    if (m) return "#" + m[1] + (m[2] ? "--" + m[2] : "");
    var a = /^#([a-z0-9-]+)$/i.exec(href);
    return a ? null : href;
  }
  function render(md, slug) {
    var box = document.getElementById("page");
    box.innerHTML = md;
    box.querySelectorAll("h1,h2,h3").forEach(function (h) { h.id = slugify(h.textContent); });
    box.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      var local = /^#([a-z0-9-]+)$/i.exec(href);
      if (local) { a.setAttribute("href", "#" + slug + "--" + local[1]); return; }
      var to = linkFor(href);
      if (to && to.charAt(0) === "#") { a.setAttribute("href", to); }
      else if (/^https?:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; }
    });
    box.querySelectorAll("table").forEach(function (t) {
      var w = document.createElement("div"); w.className = "table-wrap"; t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
  }
  function buildToc(current) {
    var ol = document.getElementById("toc"), ml = document.getElementById("tocmList");
    ol.innerHTML = ""; ml.innerHTML = "";
    order.forEach(function (o) {
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "#" + o[0]; a.textContent = o[1];
      if (o[0] === current) a.setAttribute("aria-current", "page");
      li.appendChild(a); ol.appendChild(li);
      var m = a.cloneNode(true); ml.appendChild(m);
    });
  }
  function pager(slug) {
    var i = slugs.indexOf(slug), p = document.getElementById("pager");
    p.innerHTML = "";
    if (i > 0) { var a = document.createElement("a"); a.href = "#" + slugs[i - 1]; a.textContent = "← " + order[i - 1][1]; p.appendChild(a); } else { p.appendChild(document.createElement("span")); }
    if (i >= 0 && i < slugs.length - 1) { var b = document.createElement("a"); b.href = "#" + slugs[i + 1]; b.textContent = order[i + 1][1] + " →"; p.appendChild(b); }
  }
  function search(q) {
    q = q.trim().toLowerCase();
    var box = document.getElementById("page");
    var hits = [];
    order.forEach(function (o) {
      var text = pages[o[0]], low = text.toLowerCase(), at = low.indexOf(q);
      if (at >= 0) {
        var snip = text.slice(Math.max(0, at - 60), at + 120).replace(/[#*`|>\[\]]/g, " ").replace(/\s+/g, " ");
        hits.push([o, snip]);
      }
    });
    box.innerHTML = "<h1>Search</h1><p>" + hits.length + " page(s) mention “" + q.replace(/[&<]/g, "") + "”.</p>";
    var ul = document.createElement("ul"); ul.className = "results";
    hits.forEach(function (h) {
      var li = document.createElement("li"), a = document.createElement("a");
      a.href = "#" + h[0][0]; a.textContent = h[0][1];
      var s = document.createElement("small"); s.textContent = "…" + h[1] + "…";
      li.appendChild(a); li.appendChild(s); ul.appendChild(li);
    });
    box.appendChild(ul);
    document.getElementById("pager").innerHTML = "";
  }
  function show() {
    var h = (location.hash || "").replace(/^#/, "");
    var parts = h.split("--"), slug = parts[0], sec = parts[1];
    if (slugs.indexOf(slug) < 0) { slug = slugs[0]; sec = null; }
    render(html[slug], slug);
    buildToc(slug); pager(slug);
    document.getElementById("tocm").open = false;
    var target = sec ? document.getElementById(sec) : null;
    if (target) { target.scrollIntoView(); } else { window.scrollTo(0, 0); }
    var title = order[slugs.indexOf(slug)][1];
    document.title = (slug === slugs[0] ? "MCC 5 Wiki" : title + " | MCC 5 Wiki");
  }
  var q = document.getElementById("q"), timer = null;
  q.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { if (q.value.trim().length >= 2) { search(q.value); } else { show(); } }, 180);
  });
  window.addEventListener("hashchange", function () { q.value = ""; show(); });
  show();
})();
</script>
