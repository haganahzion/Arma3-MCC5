nt Budget<\/strong> 2 per mission.<\/td><\/tr><\/tbody><\/table>\n<p>Which one GAIA tries first:<\/p>\n<ul><li>Heavily outnumbered: reinforcements, then artillery, then CAS.<\/li><li>Armoured contact: CAS, then artillery, then reinforcements.<\/li><li>Otherwise: artillery, then CAS, then reinforcements.<\/li><\/ul>\n<p>Reinforcements are only sent to sides with no players on them, so no extra friendly units show up next to you. Turn on <strong>Reinforcements For Player Sides<\/strong> to allow them for every side.<\/p>\n<p>Each kind can be turned off on its own. At most one new support response per side per GAIA cycle. Air contacts are ignored. All settings are on the <a href=\"settings.md#mcc-gaia---support-requests\">Settings<\/a> page and in MCC 5 Mission Settings.<\/p>\n<p>The Mission Wizard turns on reinforcement and artillery requests when you choose reinforcements or artillery.<\/p>\n<h2>Headless clients<\/h2>\n<p>With <strong>Headless Client Balancing<\/strong> on (default), GAIA moves new groups to headless clients:<\/p>\n<ul><li>Groups that join GAIA for the first time after 30 seconds of mission time are queued.<\/li><li>After 5 seconds each is handed to the next headless client in turn.<\/li><li>The list of headless clients is refreshed every 10 seconds, so clients can join or leave.<\/li><\/ul>\n<p>Not moved:<\/p>\n<ul><li>groups with players,<\/li><li>groups already on a headless client,<\/li><li>garrisoned and fortify groups,<\/li><li>groups flagged <code>GAIA_noHC<\/code>, <code>MCC_noHC<\/code> or <code>acex_headless_blacklist<\/code>.<\/li><\/ul>\n<p>Groups placed in Eden and present at the very start are not moved by this. Headless clients run the vehicle logic for their own groups, and mortar fire is passed to the machine that owns the group.<\/p>\n<p>Every headless client needs the same <code>-mod<\/code> line as the server. See <a href=\"installation.md#headless-clients\">Installation<\/a>.<\/p>\n<h2>Caching<\/h2>\n<p>Caching saves performance for groups far from players. It only applies to groups flagged for caching, for example with the Eden group attribute <strong>GAIA Cache<\/strong>.<\/p>\n<ul><li><strong>Stage 1<\/strong>: when no player is within <strong>Cache Distance<\/strong> (default 3000 m), the group is put under the engine's dynamic simulation and freezes. Not for groups in combat, mortar and artillery groups, or groups on a moving order (attack, clear, transport, support).<\/li><li><strong>Stage 2<\/strong>: when no player is within twice the Cache Distance, the group is saved and removed. It comes back when a player gets that close again.<\/li><\/ul>\n<h2>Performance<\/h2>\n<p>The MCC 5 GAIA was rewritten for speed:<\/p>\n<ul><li>One scheduler for all sides, on the server.<\/li><li>Per-group work is spread over frames: 5 groups per frame, each group at most once per second.<\/li><li>Group data is cached. Groups are kept in a registry that is cleaned every 10 seconds.<\/li><li>No zone limit (the old limit was 91 zones).<\/li><li>Far groups can be frozen with dynamic simulation (see Caching).<\/li><\/ul>\n<p>Tips:<\/p>\n<ul><li>Keep the number of AI reasonable. The Mission Wizard has <strong>Max AI Units<\/strong> and <strong>Max spawned units<\/strong> caps.<\/li><li>Use <strong>GAIA Cache<\/strong> on groups far from the action.<\/li><li>Use headless clients on busy servers.<\/li><\/ul>\n<h2>Other GAIA settings<\/h2>\n<ul><li><strong>Target Detection Range<\/strong> (1000 m): how far around each group leader GAIA looks for enemy targets.<\/li><li><strong>GAIA Controls All<\/strong> (Off): GAIA may also give orders to groups it does not control, even players.<\/li><li><strong>AI Skill<\/strong> (overall, aim, spot, command; 1 to 10, default 5).<\/li><li><strong>AI Use Smoke Grenades &amp; flares<\/strong> (Off) and <strong>Smoke/flares Chance<\/strong> (50).<\/li><\/ul>\n<h2>Debug<\/h2>\n<p>Turn on <strong>GAIA Debug<\/strong> in CBA Addon Options (MCC GAIA), or in MCC 5 Mission Settings. Then:<\/p>\n<ul><li>GAIA writes its cycle timings per phase, with the number of groups processed, to the <strong>server<\/strong> RPT.<\/li><li>GAIA debug markers are shown.<\/li><li>Support requests are logged.<\/li><li>Groups following tasks log lines starting with <code>GAIA tasks:<\/code>.<\/li><\/ul>\n<p>At start the RPT also shows <code>GAIA: AI mods detected<\/code> with the AI mods found. See <a href=\"troubleshooting.md\">Troubleshooting<\/a>.<\/p>", "ai-mod-compatibility": "<h1>AI mod compatibility<\/h1>\n<p>GAIA is a commander. It decides where groups go, which vehicle they use and when to call support. It works alongside these AI mods:<\/p>\n<ul><li><strong>LAMBS Danger.fsm<\/strong><\/li><li><strong>LAMBS Suppression<\/strong><\/li><li><strong>HBQ Advanced Driving AI<\/strong><\/li><\/ul>\n<p>MCC detects them when the game starts. You don't need to set anything.<\/p>\n<h2>What is detected<\/h2>\n<p>At start the RPT log shows one line like this:<\/p>\n<pre><code>GAIA: AI mods detected - LAMBS Danger: true, LAMBS Suppression: false, HBQ Advanced Driving AI: false<\/code><\/pre>\n<p>How MCC finds them:<\/p>\n<ul><li>LAMBS Danger: the addon <code>lambs_danger<\/code> is loaded.<\/li><li>LAMBS Suppression: the addon <code>lambs_suppression<\/code> is loaded.<\/li><li>HBQ Advanced Driving AI: any loaded addon whose name contains both \"hbq\" and \"driv\".<\/li><\/ul>\n<h2>LAMBS Danger<\/h2>\n<p>With LAMBS Danger active:<\/p>\n<ul><li>GAIA leaves contact tactics to LAMBS. It does not force group behaviour every cycle while a group is in contact. It only sets it again when it gives a new order.<\/li><li>When GAIA vehicle groups meet the enemy, dismounting in contact is LAMBS's call. GAIA only puts the group back into its vehicle after the fight.<\/li><\/ul>\n<p>Groups running a <strong>LAMBS task waypoint<\/strong> (a scripted waypoint from LAMBS) are left alone by GAIA. GAIA treats them like fortify groups and does not give them new orders.<\/p>\n<h2>LAMBS Suppression<\/h2>\n<p>MCC detects LAMBS Suppression and writes it in the RPT. The code has no further special handling for it, so the two just run side by side.<\/p>\n<p>MCC also has its own <strong>Suppression Effects<\/strong> setting (MCC User Interface, off by default). It is a separate, client side effect.<\/p>\n<h2>HBQ Advanced Driving AI<\/h2>\n<p>With HBQ active, GAIA leaves stuck vehicles and route recovery to HBQ:<\/p>\n<ul><li>GAIA's own \"not getting closer, plan a new route, then go on foot\" check for vehicle groups is turned off.<\/li><li><strong>Unstick Vehicles<\/strong> (flip, re-route, back up, drop the order) is skipped.<\/li><\/ul>\n<p>GAIA still picks rides, dismounts and remounts.<\/p>\n<h2>Auto, On, Off<\/h2>\n<p>Two CBA settings in <strong>MCC GAIA &gt; AI Mod Compatibility<\/strong> let you override detection. They are also in MCC 5 Mission Settings.<\/p>\n<table><thead><tr><th>Setting<\/th><th>Auto (default)<\/th><th>On<\/th><th>Off<\/th><\/tr><\/thead><tbody><tr><td><strong>LAMBS Danger Compatibility<\/strong><\/td><td>Cooperate if LAMBS Danger is loaded<\/td><td>Always act as if LAMBS Danger is loaded<\/td><td>Never, GAIA behaves as without LAMBS<\/td><\/tr><tr><td><strong>HBQ Driving AI Compatibility<\/strong><\/td><td>Cooperate if HBQ is loaded<\/td><td>Always act as if HBQ is loaded<\/td><td>Never, GAIA uses its own unstick logic<\/td><\/tr><\/tbody><\/table>\n<p>When to change them:<\/p>\n<ul><li>Set <strong>Off<\/strong> if you have the mod loaded but want GAIA to keep full control.<\/li><li>Set <strong>On<\/strong> if your version of the mod is not detected. For HBQ the addon name is not documented, so MCC guesses it from the name.<\/li><\/ul>\n<p>There is no override setting for LAMBS Suppression.<\/p>\n<p>See also <a href=\"gaia.md\">GAIA AI<\/a> and <a href=\"settings.md#mcc-gaia---ai-mod-compatibility\">Settings<\/a>.<\/p>", "settings": "<h1>Settings<\/h1>\n<p>Every MCC setting, grouped as in the game, with what it does and its default.<\/p>\n<h2>Where to change settings<\/h2>\n<p>You can change settings in three places, and they all change the same values.<\/p>\n<h3>1. CBA Addon Options<\/h3>\n<p>In the main menu or the pause menu: <strong>Options &gt; Addon Options<\/strong>. Pick an <strong>MCC<\/strong> category, for example \"MCC GAIA\". CBA lets you set values for the server, the mission or the client. These are the \"addon settings\".<\/p>\n<h3>2. MCC 5 Mission Settings (Eden)<\/h3>\n<p>In the editor: <strong>MCC 5 &gt; MCC 5 Mission Settings...<\/strong>. This saves settings <strong>into the mission<\/strong>.<\/p>\n<ul><li>Almost every value starts at <strong>Use addon setting<\/strong> (a drop-down) or an <strong>empty box<\/strong>. That means the CBA addon setting is used.<\/li><li>Only what you change is saved.<\/li><li>Number boxes accept the same range as the CBA slider.<\/li><li>Class list boxes take the same text as the CBA box, for example <code>[\"B_officer_F\",\"O_officer_F\"]<\/code>.<\/li><li>At mission start the server applies your values through CBA, on every machine. The RPT shows <code>MCC: Eden attribute &lt;name&gt; -&gt; CBA setting &lt;variable&gt; = &lt;value&gt;<\/code>.<\/li><li>A setting forced by a mission <code>cba_settings.sqf<\/code> or by the server admin with \"overwrite mission\" priority still wins. The RPT then says the Eden value was not applied.<\/li><\/ul>\n<p>The categories in this window use the CBA names, for example \"MCC GAIA - Support Requests\" is CBA category \"MCC GAIA\", subcategory \"Support Requests\".<\/p>\n<h3>3. Settings modules and description.ext<\/h3>\n<ul><li>The Eden settings modules ((Settings) General, GAIA, Mechanics, Radio System, Medical System, HUD, Role Selection, Mission Wizard) and the Zeus settings modules set some of the same values. See <a href=\"eden-editor.md#settings-modules-general\">Eden editor<\/a> and <a href=\"zeus-tools.md\">Zeus tools<\/a>.<\/li><li>Missions that don't use Eden attributes can put a value in <code>description.ext<\/code>, for example <code>MCC_logisticsMode = 2;<\/code> or <code>MCC_networkSecurity = 1;<\/code>.<\/li><\/ul>\n<h2>MCC 5 (main category)<\/h2>\n<p>These are the first category in MCC 5 Mission Settings. The Eden names are a little different from the CBA names.<\/p>\n<table><thead><tr><th>Eden name<\/th><th>CBA setting (category)<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Limited Logistics<\/td><td>Limited Logistics (MCC Logistics)<\/td><td>Off: unlimited supply, as before. Fuel only: fuel trucks, fuel crates and vehicle service fuel are finite. Full: fuel, ammo and repair are finite. Supply trucks refill at their side's base from side resources. See <a href=\"logistics.md\">Limited logistics<\/a>.<\/td><td>Off<\/td><\/tr><tr><td>Mission Wizard: Max Objectives<\/td><td>Max objectives (MCC Mission Wizard - Mission size)<\/td><td>Objectives per Zeus or runtime Mission Wizard mission, 1 to 8. The dialog sets the first 3, the rest are random types.<\/td><td>3<\/td><\/tr><tr><td>Mission Wizard: Mission Size<\/td><td>Mission size (MCC Mission Wizard - Mission size)<\/td><td>Multiplier on the number of enemies: Small 0.5, Normal 1, Large 1.75, Huge 2.5.<\/td><td>Normal<\/td><\/tr><tr><td>Mission Wizard: Max Spawned Units<\/td><td>Max spawned units (MCC Mission Wizard - Mission size)<\/td><td>Hard cap on the units one Mission Wizard mission or campaign AO may spawn. CBA range 30 to 600; Eden offers 50 to 600.<\/td><td>200<\/td><\/tr><tr><td>Campaign: Simultaneous AOs<\/td><td>Campaign simultaneous AOs (MCC Mission Wizard - Campaign)<\/td><td>How many campaign areas of operation can be active at once, 1 to 3.<\/td><td>1<\/td><\/tr><tr><td>Campaign: AO Size<\/td><td>Campaign AO size (MCC Mission Wizard - Campaign)<\/td><td>Objective radius in meters of every campaign AO. CBA range 150 to 1500.<\/td><td>300<\/td><\/tr><tr><td>Campaign: Ambient Groups Cap<\/td><td>Campaign ambient groups cap (MCC Mission Wizard - Campaign)<\/td><td>Max ambient enemy groups kept around players (2 per player up to this). Range 0 to 60.<\/td><td>18<\/td><\/tr><tr><td>GAIA: AI Support Requests<\/td><td>AI Support Requests (MCC GAIA - Support Requests)<\/td><td>AI commanders call artillery, CAS and reinforcements on strong contacts.<\/td><td>On<\/td><\/tr><tr><td>GAIA: AI Artillery<\/td><td>Artillery Support (MCC GAIA - Support Requests)<\/td><td>GAIA mortar and artillery groups answer support requests.<\/td><td>On<\/td><\/tr><tr><td>GAIA: AI Close Air Support<\/td><td>CAS Support (MCC GAIA - Support Requests)<\/td><td>GAIA calls an off-map CAS run.<\/td><td>On<\/td><\/tr><tr><td>GAIA: AI Reinforcements<\/td><td>Reinforcements (MCC GAIA - Support Requests)<\/td><td>GAIA calls motorized reinforcements when heavily outnumbered or when nothing else is available.<\/td><td>On<\/td><\/tr><tr><td>GAIA: Coordinated Attacks<\/td><td>Coordinated Attacks (MCC GAIA - Coordination)<\/td><td>Groups on the same contact get roles: main attack, flank, support-by-fire, reserve. Off: every group attacks on its own.<\/td><td>On<\/td><\/tr><tr><td>GAIA: Headless Client Balancing<\/td><td>Headless Client Balancing (MCC GAIA - Headless Clients)<\/td><td>GAIA groups spawned during the mission are moved to connected headless clients, in turn.<\/td><td>On<\/td><\/tr><tr><td>Zeus for MCC Users<\/td><td>Zeus for MCC users (MCC General - Zeus)<\/td><td>Every player allowed to use MCC gets Zeus with all MCC modules. Others get nothing.<\/td><td>On<\/td><\/tr><tr><td>Network Security<\/td><td>(Eden only, no CBA setting)<\/td><td>Normal: MCC accepts network requests from any player. Strict: in multiplayer, MCC ignores requests from players not allowed to use MCC. No effect in single player. See <a href=\"multiplayer-and-security.md\">Multiplayer and security<\/a>.<\/td><td>Normal<\/td><\/tr><\/tbody><\/table>\n<h2>CBA settings that are not in the Eden window<\/h2>\n<table><thead><tr><th>Setting (category)<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td>Gain XP automatically (MCC Role Selection - Experience Points)<\/td><td>Players gain XP by killing and doing their role's actions<\/td><td>On<\/td><\/tr><tr><td>Flag west (MCC Role Selection - Flags)<\/td><td>Default flag for the west side<\/td><td><code>\\a3\\Data_f\\Flags\\flag_nato_co.paa<\/code><\/td><\/tr><tr><td>Flag east (MCC Role Selection - Flags)<\/td><td>Default flag for the east side<\/td><td><code>\\a3\\Data_f\\Flags\\flag_CSAT_co.paa<\/code><\/td><\/tr><tr><td>Flag resistance (MCC Role Selection - Flags)<\/td><td>Default flag for the resistance side<\/td><td><code>\\a3\\Data_f\\Flags\\flag_AAF_co.paa<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>All other settings<\/h2>\n<p>The rest of the MCC settings, in the order of the MCC 5 Mission Settings window. The text comes from the setting's own description. \"CBA variable\" is the name to use in <code>cba_settings.sqf<\/code> or <code>description.ext<\/code>.<\/p>\n<p>Long class list defaults are not repeated here. Hover over the setting in Eden or CBA to see the full default.<\/p>\n<h3>MCC Mission Wizard<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>HVT (man)<\/td><td>Unit that will be used as high value target<\/td><td><code>[\"B_officer_F\",\"O_officer_F\",\"I_officer_F\",\"C_Nikos\"]<\/code><\/td><td><code>MCC_MWHVT<\/code><\/td><\/tr><tr><td>Radio Tower (Land)<\/td><td>Object that will be used in destroy radio missions<\/td><td><code>[\"Land_TTowerBig_2_F\"]<\/code><\/td><td><code>MCC_MWRadio<\/code><\/td><\/tr><tr><td>Fuel Tanks (Land)<\/td><td>Object that will be used in destroy fuel tanks missions<\/td><td><code>[\"Land_dp_smallTank_F\",\"Land_ReservoirTank_V1_F\",\"Land_dp_bigTank_F\"]<\/code><\/td><td><code>MCC_MWFuelTanks<\/code><\/td><\/tr><tr><td>Radar (Land)<\/td><td>Object that will be used in destroy radar missions<\/td><td><code>[\"Land_Radar_Small_F\",\"B_Radar_System_01_F\",\"O_Radar_System_02_F\"]<\/code><\/td><td><code>MCC_MWradar<\/code><\/td><\/tr><tr><td>Armored Vehicles (Vehicle)<\/td><td>Vehicle that will be used in destroy armored vehicle missions<\/td><td><code>[\"B_MBT_01_cannon_F\",\"O_MBT_02_cannon_F\"]<\/code><\/td><td><code>MCC_MWTanks<\/code><\/td><\/tr><tr><td>Air Vehicles (Vehicle)<\/td><td>Vehicle that will be used in destroy air vehicle missions<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_MWAir<\/code><\/td><\/tr><tr><td>Anti-Air (Vehicle)<\/td><td>Vehicle that will be used in destroy anti-air missions<\/td><td><code>[\"B_APC_Tracked_01_AA_F\",\"O_APC_Tracked_02_AA_F\",\"I_APC_Wheeled_03_cannon_F\"]<\/code><\/td><td><code>MCC_MWAA<\/code><\/td><\/tr><tr><td>Artillery (Vehicle)<\/td><td>Vehicle that will be used in destroy artillery missions<\/td><td><code>[\"B_MBT_01_arty_F\",\"B_MBT_01_mlrs_F\",\"O_MBT_02_arty_F\",\"O_Mortar_01_F\",\"I_Mortar_01_F\"]<\/code><\/td><td><code>MCC_MWArtillery<\/code><\/td><\/tr><tr><td>Ammo cache (Box)<\/td><td>Ammo box that will be used in destroy cache vehicle missions<\/td><td><code>[\"Box_East_AmmoVeh_F\",\"Land_Pallet_MilBoxes_F\"]<\/code><\/td><td><code>MCC_MWcache<\/code><\/td><\/tr><tr><td>Intel Objects (Small Items)<\/td><td>Object that will be used in find intel missions<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_MWIntelObjects<\/code><\/td><\/tr><tr><td>IED (Small Items)<\/td><td>Object that will be used in disarm IED missions<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_MWIED<\/code><\/td><\/tr><tr><td>Compositions civilians<\/td><td>Will be used as compositions for civilians must be defined in (\"CfgGroups\" &gt;&gt; \"Empty\")<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_MWSITES<\/code><\/td><\/tr><tr><td>Compositions military<\/td><td>Will be used as compositions for military must be defined in (\"CfgGroups\" &gt;&gt; \"Empty\")<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_MWSITESmilitary<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Mission Wizard - Mission size<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Max players<\/td><td>Top of the players slider in the Mission Wizard dialog. Range 10 to 150.<\/td><td>40<\/td><td><code>MCC_MWmaxPlayersSetting<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Role Selection<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Enable Role Selection<\/td><td>Enable role selection menu allows player to gain XP and unlock new weapons and items<\/td><td>Off<\/td><td><code>CP_activated<\/code><\/td><\/tr><tr><td>Unlock All Weapons<\/td><td>Unlock All Weapons ignoring the player level<\/td><td>Off<\/td><td><code>MCC_rsAllWeapons<\/code><\/td><\/tr><tr><td>Role Change<\/td><td>Players can change roles in HQ<\/td><td>On<\/td><td><code>MCC_allowChangingKits<\/code><\/td><\/tr><tr><td>Restrict Weapons<\/td><td>Players using weapons outside of their role (eg rifleman using sniper rifle) will get penalty by increased weapon sway<\/td><td>Off<\/td><td><code>MCC_rsEnableRoleWeapons<\/code><\/td><\/tr><tr><td>Restrict Vehicles<\/td><td>Players can't use vehicles outside of their role (eg rifleman driving a tank) except light vehicles<\/td><td>Off<\/td><td><code>MCC_rsEnableDriversPilots<\/code><\/td><\/tr><tr><td>Group Callsigns<\/td><td>Default groups callsigns<\/td><td><code>[\"Alpha\",\"Bravo\",\"Charlie\",\"Delta\"]<\/code><\/td><td><code>CP_defaultGroups<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Role Selection - Experience Points<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Gain XP notifications<\/td><td>Players will get notifications when gaining XP<\/td><td>On<\/td><td><code>CP_expNotifications<\/code><\/td><\/tr><tr><td>Base Xp<\/td><td>Base Xp needed for each level, Exp will raise by 5% each level. Range 1000 to 10000.<\/td><td>4000<\/td><td><code>CP_XPperLevel<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Classes - IED<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>IEDs small<\/td><td>Array first element is display name, second is the object class<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_ied_small<\/code><\/td><\/tr><tr><td>IEDs medium<\/td><td>Array first element is display name, second is the object class<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_ied_medium<\/code><\/td><\/tr><tr><td>IEDs wrecks<\/td><td>Array first element is display name, second is the object class<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_ied_wrecks<\/code><\/td><\/tr><tr><td>IEDs hidden<\/td><td>Array first element is display name, second is the object class (hidden IED charges)<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_ied_hidden<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Classes - Convoy<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>HVT<\/td><td>High value target, array first element is display name, second is the unit class. Left at default: RHS/CUP officers are added when those mods are loaded. Add \"auto\" to keep them in a custom list.<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_convoyHVT<\/code><\/td><\/tr><tr><td>HVT Vehicle<\/td><td>High value target, array first element is display name, second is the vehicle class. Left at default: RHS/CUP cars are added when those mods are loaded. Add \"auto\" to keep them in a custom list.<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_convoyHVTcar<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Commander Console<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Commander Console Enabled<\/td><td>Player can become a side commander from the MCC respawn screen<\/td><td>On<\/td><td><code>MCC_allowConsole<\/code><\/td><\/tr><tr><td>RTS<\/td><td>Enable Real Time Strategy mod from the commander console, build, expand and conquer<\/td><td>On<\/td><td><code>MCC_allowRTS<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Commander Console - Air support<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Purchase air drop<\/td><td>Commander can trade resources for air Drops - works only on mission restart<\/td><td>On<\/td><td><code>MCC_defaultSupplyDropsEnabled<\/code><\/td><\/tr><tr><td>AC-130 uptime<\/td><td>How long in seconds can an AC-130 stay in the air before he is RTB. Range 0 to 1200.<\/td><td>300<\/td><td><code>MCC_ConsoleACTime<\/code><\/td><\/tr><tr><td>Purchase CAS<\/td><td>Commander can trade resources for close air support - works only on mission restart<\/td><td>On<\/td><td><code>MCC_defaultCASEnabled<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Commander Console - Tracking<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Show units without GPS<\/td><td>Blueforce tracker show units without GPS on commander console<\/td><td>On<\/td><td><code>MCC_ConsoleOnlyShowUnitsWithGPS<\/code><\/td><\/tr><tr><td>Show friendly WP<\/td><td>Show friendly group way points on console<\/td><td>On<\/td><td><code>MCC_ConsolePlayersCanSeeWPonMap<\/code><\/td><\/tr><tr><td>Command AI<\/td><td>Commander can issue order to AI groups given to him by mission maker<\/td><td>On<\/td><td><code>MCC_ConsoleCanCommandAI<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Commander Console - Live Feed<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Restrict live feed<\/td><td>Restrict live feed to vehicles and units wearing one of the specific helmets only<\/td><td>Off<\/td><td><code>MCC_ConsoleLiveFeedHelmetsOnly<\/code><\/td><\/tr><tr><td>Live feed helmets<\/td><td>Restrict live feed to vehicles and units wearing one of the specific helmets only<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_ConsoleLiveFeedHelmets<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC GAIA - AI Skill<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>AI Skill(overall)<\/td><td>General skill of AI units. Range 1 to 10.<\/td><td>5<\/td><td><code>MCC_AI_Skill_Index<\/code><\/td><\/tr><tr><td>AI Skill(Aim)<\/td><td>Aiming skill of AI units. Range 1 to 10.<\/td><td>5<\/td><td><code>MCC_AI_AimIndex<\/code><\/td><\/tr><tr><td>AI Skill(Spot)<\/td><td>Spotting skill of AI units. Range 1 to 10.<\/td><td>5<\/td><td><code>MCC_AI_SpotIndex<\/code><\/td><\/tr><tr><td>AI Skill(Command)<\/td><td>Command skill of AI units. Range 1 to 10.<\/td><td>5<\/td><td><code>MCC_AI_CommandIndex<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC GAIA - AI Smoke &amp; Flares<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>AI Use Smoke Grenades &amp; flares<\/td><td>AI use smoke grenades and flares.<\/td><td>Off<\/td><td><code>MCC_GAIA_AMBIANT<\/code><\/td><\/tr><tr><td>Smoke/flares Chance<\/td><td>How often AI use smoke and flares. Range 20 to 80.<\/td><td>50<\/td><td><code>MCC_GAIA_AMBIANT_CHANCE<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC GAIA<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Cache Distance<\/td><td>How far any player should be from a unit before it cached. Range 1000 to 10000.<\/td><td>3000<\/td><td><code>GAIA_CACHE_STAGE_1<\/code><\/td><\/tr><tr><td>GAIA Controls All<\/td><td>If set to everyone GAIA will give order to all units available even players<\/td><td>Off<\/td><td><code>MCC_GAIA_ATTACKS_FOR_NONGAIA<\/code><\/td><\/tr><tr><td>Target Detection Range<\/td><td>How far around each group leader GAIA looks for enemy targets (nearTargets). Range 300 to 3000.<\/td><td>1000<\/td><td><code>MCC_GAIA_TARGET_RANGE<\/code><\/td><\/tr><tr><td>GAIA Debug<\/td><td>Write GAIA cycle timings (per phase, groups processed) to the server RPT and enable the GAIA debug markers<\/td><td>Off<\/td><td><code>MCC_GAIA_debug<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC GAIA - Vehicles<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Smart Vehicle Use<\/td><td>AI groups borrow empty friendly vehicles for long trips, get out at the objective (leader included) and get back in after a fight<\/td><td>On<\/td><td><code>MCC_GAIA_vehiclesEnabled<\/code><\/td><\/tr><tr><td>Find Ride Distance<\/td><td>Infantry going further than this (meters) look for an empty vehicle. Range 200 to 5000.<\/td><td>500<\/td><td><code>MCC_GAIA_rideDistance<\/code><\/td><\/tr><tr><td>Dismount Distance<\/td><td>Groups get out of their vehicle this far (meters) from the objective. Range 100 to 1500.<\/td><td>400<\/td><td><code>MCC_GAIA_dismountDistance<\/code><\/td><\/tr><tr><td>Vehicle Search Radius<\/td><td>How far (meters) from the leader a group looks for an empty vehicle. Range 50 to 1000.<\/td><td>300<\/td><td><code>MCC_GAIA_rideSearchRadius<\/code><\/td><\/tr><tr><td>Unstick Vehicles<\/td><td>Tanks and armed cars that have not moved for about a minute re-plan their route, back up, then get a new order (off when HBQ Driving AI handles it)<\/td><td>On<\/td><td><code>MCC_GAIA_UNSTICK<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC GAIA - AI Mod Compatibility<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>LAMBS Danger Compatibility<\/td><td>Auto: if LAMBS Danger is loaded GAIA leaves contact tactics to LAMBS and does not override group behaviour in combat<\/td><td>Auto<\/td><td><code>MCC_GAIA_compatLAMBS<\/code><\/td><\/tr><tr><td>HBQ Driving AI Compatibility<\/td><td>Auto: if HBQ Advanced Driving AI is loaded GAIA leaves unstuck and route recovery to HBQ<\/td><td>Auto<\/td><td><code>MCC_GAIA_compatHBQ<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC GAIA - Support Requests<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Threat Threshold<\/td><td>Minimum threat points of an enemy contact before support is called (a rifleman is 4 points, 6 inside a GAIA zone; vehicles more). Range 10 to 300.<\/td><td>40<\/td><td><code>MCC_GAIA_SUPPORT_THRESHOLD<\/code><\/td><\/tr><tr><td>Contact Range<\/td><td>Support is only called when a GAIA group in combat is this close (meters) to the enemy contact. Range 200 to 2000.<\/td><td>600<\/td><td><code>MCC_GAIA_SUPPORT_CONTACT_RANGE<\/code><\/td><\/tr><tr><td>Contact Cooldown<\/td><td>Seconds before the same enemy contact can get another support response. Range 30 to 1800.<\/td><td>180<\/td><td><code>MCC_GAIA_SUPPORT_CA_COOLDOWN<\/code><\/td><\/tr><tr><td>Danger Close Distance<\/td><td>No artillery, mortar or CAS when friendly troops are this close (meters) to the target. Range 50 to 600.<\/td><td>200<\/td><td><code>MCC_GAIA_SUPPORT_DANGERCLOSE<\/code><\/td><\/tr><tr><td>Artillery Cooldown<\/td><td>Seconds between two artillery support calls of one side. Range 0 to 1200.<\/td><td>60<\/td><td><code>MCC_GAIA_SUPPORT_ARTY_COOLDOWN<\/code><\/td><\/tr><tr><td>Artillery Budget<\/td><td>Artillery support calls per side for the whole mission. Range 0 to 100.<\/td><td>20<\/td><td><code>MCC_GAIA_SUPPORT_ARTY_BUDGET<\/code><\/td><\/tr><tr><td>NOFOLLOW Artillery Fires Outside Zone<\/td><td>Mortar / artillery groups with a NOFOLLOW zone may fire at targets outside their own zone<\/td><td>Off<\/td><td><code>MCC_GAIA_ARTY_OUTSIDE_ZONE<\/code><\/td><\/tr><tr><td>CAS Needs Own Aircraft<\/td><td>CAS is only called when the side has an armed aircraft of its own in the mission<\/td><td>Off<\/td><td><code>MCC_GAIA_SUPPORT_CAS_OWNAIR<\/code><\/td><\/tr><tr><td>CAS Cooldown<\/td><td>Seconds between two CAS calls of one side. Range 60 to 3600.<\/td><td>300<\/td><td><code>MCC_GAIA_SUPPORT_CAS_COOLDOWN<\/code><\/td><\/tr><tr><td>CAS Budget<\/td><td>CAS runs per side for the whole mission. Range 0 to 20.<\/td><td>2<\/td><td><code>MCC_GAIA_SUPPORT_CAS_BUDGET<\/code><\/td><\/tr><tr><td>CAS Plane BLUFOR<\/td><td>Plane class for BLUFOR CAS runs (empty: vanilla default)<\/td><td>(empty)<\/td><td><code>MCC_GAIA_SUPPORT_CAS_PLANE_WEST<\/code><\/td><\/tr><tr><td>CAS Plane OPFOR<\/td><td>Plane class for OPFOR CAS runs (empty: vanilla default)<\/td><td>(empty)<\/td><td><code>MCC_GAIA_SUPPORT_CAS_PLANE_EAST<\/code><\/td><\/tr><tr><td>CAS Plane Independent<\/td><td>Plane class for Independent CAS runs (empty: vanilla default)<\/td><td>(empty)<\/td><td><code>MCC_GAIA_SUPPORT_CAS_PLANE_INDEP<\/code><\/td><\/tr><tr><td>Reinforcements For Player Sides<\/td><td>Also send reinforcements to sides that have players (off: only AI sides get new units).<\/td><td>Off<\/td><td><code>MCC_GAIA_SUPPORT_REINF_PLAYERSIDE<\/code><\/td><\/tr><tr><td>Reinforcement Cooldown<\/td><td>Seconds between two reinforcement calls of one side. Range 60 to 3600.<\/td><td>600<\/td><td><code>MCC_GAIA_SUPPORT_REINF_COOLDOWN<\/code><\/td><\/tr><tr><td>Reinforcement Budget<\/td><td>Reinforcement calls per side for the whole mission. Range 0 to 20.<\/td><td>2<\/td><td><code>MCC_GAIA_SUPPORT_REINF_BUDGET<\/code><\/td><\/tr><tr><td>Reinforcement Size<\/td><td>Number of vehicles: small 2, medium 3, large 4<\/td><td>Small<\/td><td><code>MCC_GAIA_SUPPORT_REINF_SIZE<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC General<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Teleport to Team<\/td><td>Players can teleport to squad leader<\/td><td>JIP Only<\/td><td><code>MCC_t2tIndex<\/code><\/td><\/tr><tr><td>MCC Chat<\/td><td>Will show MCC chat<\/td><td>On<\/td><td><code>MCC_MessagesIndex<\/code><\/td><\/tr><tr><td>Sync Jip<\/td><td>Jip players will sync with server<\/td><td>On<\/td><td><code>MCC_syncOn<\/code><\/td><\/tr><tr><td>Time Multiplier<\/td><td>Speed of in-game time (set on the server). Range 0.5 to 24.<\/td><td>1<\/td><td><code>MCC_timeMultiplier_settings<\/code><\/td><\/tr><tr><td>Disable MCC Zeus Edit<\/td><td>Disable the custom MCC interface when editing an object in Zeus<\/td><td>Off<\/td><td><code>MCC_CuratorEditDisabled<\/code><\/td><\/tr><tr><td>Logistics System<\/td><td>Allows player to load equipment, vehicles, resources and items into vehicles<\/td><td>On<\/td><td><code>MCC_allowlogistics<\/code><\/td><\/tr><tr><td>Armed Civilians Weapons<\/td><td>Armed Civilians default Weapons<\/td><td>a class list (see the tooltip)<\/td><td><code>MCC_armedCivilansWeapons<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC General - Ambient Birds<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Ambient Birds<\/td><td>Random flocks of birds will take flight when units are near<\/td><td>On<\/td><td><code>MCC_ambientBirdsSettingIndex<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC General - Ambient Fire<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Ambient Fire<\/td><td>Explosive may cause sporadic fires that will spread with the wind need a restart to disable<\/td><td>On<\/td><td><code>MCC_ambientFireSettingIndex<\/code><\/td><\/tr><tr><td>Vehicle fire chance<\/td><td>Chance a destroyed vehicle will start a fire. Range 0 to 100.<\/td><td>50<\/td><td><code>MCC_fnc_ambientFireInitVehicleBurnChance<\/code><\/td><\/tr><tr><td>Explosives rounds fire chance<\/td><td>Chance an explosive ammunition start a new fire also effect the chance of non explosive ammunition to start a fire. Range 0 to 100.<\/td><td>3<\/td><td><code>MCC_fnc_ambientFireInitExplosivesBurnChance<\/code><\/td><\/tr><tr><td>Burning crew escape chance<\/td><td>Chance of each crew member in a destroyed vehicle's to catch on fire running out of the vehicle. Range 0 to 100.<\/td><td>50<\/td><td><code>MCC_fnc_ambientFireInitCrewBurnChance<\/code><\/td><\/tr><tr><td>Burning crew new fire chance<\/td><td>Chance a burned crew member will start a new fire. Range 0 to 100.<\/td><td>10<\/td><td><code>MCC_fnc_ambientFireInitCrewNewFireChance<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC General - Artillery<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Artillery Computer<\/td><td>Enable/disable BI artillery computer<\/td><td>On<\/td><td><code>MCC_artilleryComputerIndex<\/code><\/td><\/tr><tr><td>Artillery spread<\/td><td>First element display name second spread in meters<\/td><td><code>[[\"On-target\",0], [\"Precise\",100], [\"Tight\",200], [\"Wide\",400]]<\/code><\/td><td><code>MCC_artillerySpreadArray<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC General - Squad Leader PDA<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>SQL PDA Enabled<\/td><td>Any team leader will have access to a PDA that have a Blueforce tracker<\/td><td>On<\/td><td><code>MCC_allowsqlPDA<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Logistics - Limited Logistics<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Supply Truck Capacity<\/td><td>Resource units an ammo/repair/fuel vehicle carries of each supply type (MCC crates: 200, big crates: 800). Range 100 to 5000.<\/td><td>1000<\/td><td><code>MCC_logisticsTruckCapacity<\/code><\/td><\/tr><tr><td>Base Refill Rate<\/td><td>Resource units a supply vehicle takes from the side resources every 5 seconds while parked at its base. Range 10 to 1000.<\/td><td>100<\/td><td><code>MCC_logisticsRefillRate<\/code><\/td><\/tr><tr><td>Base Radius<\/td><td>Distance in meters from the side start location (or an RTS base building) where supply vehicles refill. Range 25 to 500.<\/td><td>75<\/td><td><code>MCC_logisticsBaseRadius<\/code><\/td><\/tr><tr><td>Supply Cost Factor<\/td><td>Multiplies the resource cost of rearming, repairing and refuelling a vehicle (from supply points and from vehicle service). Range 0.1 to 5.<\/td><td>1<\/td><td><code>MCC_logisticsCostFactor<\/code><\/td><\/tr><tr><td>Fuel Consumption<\/td><td>Vehicle fuel consumption multiplier while Limited Logistics is on (1 = normal). Range 1 to 10.<\/td><td>1<\/td><td><code>MCC_logisticsFuelConsumption<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Mechanics<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Weapons Binds<\/td><td>Bind weapon to the 1 - 4 keys<\/td><td>Off<\/td><td><code>MCC_quickWeaponChange<\/code><\/td><\/tr><tr><td>One Man Tanks<\/td><td>Player can operate a tank by his own driving and shooting<\/td><td>Off<\/td><td><code>MCC_arcadeTanks<\/code><\/td><\/tr><tr><td>Disable Fatigue<\/td><td>Turn off the players' fatigue system<\/td><td>Off<\/td><td><code>MCC_disableFatigue<\/code><\/td><\/tr><tr><td>3D Tagging<\/td><td>Squad leader enemy tags and markers will be visible on HUD<\/td><td>On<\/td><td><code>MCC_allow3DSpotting<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Mechanics - Cover<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Cover System<\/td><td>Players will automatically pop up or side out of cover while aiming down sights<\/td><td>Off<\/td><td><code>MCC_cover<\/code><\/td><\/tr><tr><td>Cover System UI<\/td><td>Show icons on HUD when in cover<\/td><td>Off<\/td><td><code>MCC_coverUI<\/code><\/td><\/tr><tr><td>Vault System<\/td><td>Allow players to vault over walls and obstacles - see CBA keybinds<\/td><td>Off<\/td><td><code>MCC_coverVault<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Mechanics - Interaction<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Interaction System<\/td><td>Players can interact with object and themselves - see CBA keybinds<\/td><td>On<\/td><td><code>MCC_interaction<\/code><\/td><\/tr><tr><td>Interaction System UI<\/td><td>Show icons on HUD when interaction is available<\/td><td>On<\/td><td><code>MCC_ingameUI<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Mechanics - Survival<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Survival Mode<\/td><td>Players can loot map objects and need to drink and eat<\/td><td>Disabled<\/td><td><code>MCC_surviveModAllowSearch_index<\/code><\/td><\/tr><tr><td>Load Player Position<\/td><td>Load last known player position on mission start<\/td><td>Off<\/td><td><code>MCC_surviveModPlayerPos<\/code><\/td><\/tr><tr><td>Load Player Gear<\/td><td>Load last known player gear on mission start<\/td><td>Off<\/td><td><code>MCC_surviveModPlayerGear<\/code><\/td><\/tr><tr><td>Load Player Stats<\/td><td>Load last known player stats on mission start<\/td><td>Off<\/td><td><code>MCC_surviveModPlayerStats<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Mechanics - Ammo Type<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Breaching Ammo<\/td><td>Magazine classes. Shooting this ammo from less than 10 meters will unlock doors. \"auto\" = every shotgun slug magazine found in the loaded mods<\/td><td><code>[\"auto\"]<\/code><\/td><td><code>MCC_breacingAmmo<\/code><\/td><\/tr><tr><td>Non Lethal Ammo<\/td><td>Magazine classes. Shooting this ammo at a unit closer than 30 meters stuns it instead of killing it. \"auto\" = every shotgun slug magazine found in the loaded mods<\/td><td><code>[\"auto\"]<\/code><\/td><td><code>MCC_nonLeathalAmmo<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Medical System<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Enable MCC Medic System<\/td><td>Turns on the MCC medical system. Requires mission restart!<\/td><td>Off<\/td><td><code>MCC_medicSystemEnabled<\/code><\/td><\/tr><tr><td>Complex System<\/td><td>Requires mission restart! Complex system replace all the default ArmA items with advanced items such as bandages, epipens exc<\/td><td>Off<\/td><td><code>MCC_medicComplex<\/code><\/td><\/tr><tr><td>Medic Only Heal<\/td><td>Only medics can use FAK to heal others can only use bandages to stop bleeding<\/td><td>Off<\/td><td><code>MCC_medicOnlyMedicHeals<\/code><\/td><\/tr><tr><td>Medic HUD<\/td><td>Show wounded units as a cross on HUD<\/td><td>Off<\/td><td><code>MCC_medicShowWounded<\/code><\/td><\/tr><tr><td>Bleeding<\/td><td>Players and AI will suffer from bleeding effects and will need to stop bleeding or die over time<\/td><td>Off<\/td><td><code>MCC_medicBleedingEnabled<\/code><\/td><\/tr><tr><td>Bleeding Time<\/td><td>How long in seconds it will take for unconscious unit to die from bleeding. Range 30 to 1200.<\/td><td>300<\/td><td><code>MCC_medicBleedingTime<\/code><\/td><\/tr><tr><td>Bulletproof Vests Effectiveness<\/td><td>Players can take more damage than usual. Range 0 to 5.<\/td><td>2<\/td><td><code>MCC_medicDamageCoef_index<\/code><\/td><\/tr><tr><td>Punish Team Kill<\/td><td>Player who died by friendly fire can forgive or punish the killer<\/td><td>Off<\/td><td><code>MCC_medicPunishTK<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Radio<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Enable MCC Radio System<\/td><td>Radio system uses default ArmA Voice Over IP<\/td><td>Off<\/td><td><code>MCC_VonRadio<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Radio - Distance<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Global Radio Distance<\/td><td>Radio range in meters. Range 1000 to 5000.<\/td><td>2000<\/td><td><code>MCC_vonRadioDistanceGlobal<\/code><\/td><\/tr><tr><td>Side Radio Distance<\/td><td>Radio range in meters. Range 3000 to 7000.<\/td><td>5000<\/td><td><code>MCC_vonRadioDistanceSide<\/code><\/td><\/tr><tr><td>Commander Radio Distance<\/td><td>Radio range in meters. Range 8000 to 20000.<\/td><td>12000<\/td><td><code>MCC_vonRadioDistanceCommander<\/code><\/td><\/tr><tr><td>Group Radio Distance<\/td><td>Radio range in meters. Range 300 to 5000.<\/td><td>2500<\/td><td><code>MCC_vonRadioDistanceGroup<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Radio - Anti-Abuse<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Kick Hot Mic<\/td><td>Will kick player with hot mic after some time<\/td><td>Off<\/td><td><code>MCC_vonRadioKickIdle<\/code><\/td><\/tr><tr><td>Time Before Kick<\/td><td>Seconds of hot mic before the kick. Range 5 to 60.<\/td><td>30<\/td><td><code>MCC_vonRadioKickIdleTime<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC Respawn - Respawn<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Save Gear<\/td><td>Players will respawn with the gear they had when they died<\/td><td>Off<\/td><td><code>MCC_saveGearIndex<\/code><\/td><\/tr><tr><td>Delete players bodies<\/td><td>Automatically delete players bodies<\/td><td>Off<\/td><td><code>MCC_deletePlayersBody<\/code><\/td><\/tr><tr><td>Respawn Menu<\/td><td>Custom MCC respawn menu<\/td><td>On<\/td><td><code>MCC_openRespawnMenu<\/code><\/td><\/tr><tr><td>Respawn Cinematic<\/td><td>Shows a cinematic when a player spawns.<\/td><td>On<\/td><td><code>MCC_respawnCinematic<\/code><\/td><\/tr><tr><td>Respawn On Leader<\/td><td>Allow player to select to respawn on team leader from the MCC respawn menu<\/td><td>Off<\/td><td><code>MCC_respawnOnGroupLeader<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC User Interface<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>View Distance<\/td><td>Sets the view distance. Range 200 to 15000.<\/td><td>5000<\/td><td><code>MCC_Settings_ViewDistance<\/code><\/td><\/tr><tr><td>Grass Detail<\/td><td>Sets the terrain grid (grass) detail. Range 1 to 50.<\/td><td>10<\/td><td><code>MCC_Settings_grassDetail<\/code><\/td><\/tr><tr><td>Action Menu<\/td><td>Show MCC action in mouse wheel actions<\/td><td>On<\/td><td><code>MCC_showActionKey<\/code><\/td><\/tr><tr><td>Allow 3rd Person<\/td><td>Force first person camera<\/td><td>Always<\/td><td><code>MCC_Settings_forceCamera<\/code><\/td><\/tr><tr><td>PvP Interface<\/td><td>Shows the opposing sides and the tickets left.<\/td><td>Off<\/td><td><code>MCC_UIModuleTickets<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC User Interface - Compass<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Interactive Compass HUD<\/td><td>Compass on the HUD. Options: Only Compass, Show group's units, Disabled.<\/td><td>Disabled<\/td><td><code>MCC_Settings_compassEnabled<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC User Interface - Map<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Group Markers<\/td><td>Group markers show on map<\/td><td>Off<\/td><td><code>MCC_groupMarkers<\/code><\/td><\/tr><tr><td>Unit Markers<\/td><td>Unit markers show on map<\/td><td>Off<\/td><td><code>MCC_indevidualMarkers<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC User Interface - Name Tags<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Name Tags<\/td><td>Show nearby units names<\/td><td>Off<\/td><td><code>MCC_nameTags<\/code><\/td><\/tr><tr><td>Name Tags only when pointing<\/td><td>Show nearby units names only when pointing<\/td><td>Off<\/td><td><code>MCC_NameTags_direct<\/code><\/td><\/tr><\/tbody><\/table>\n<h3>MCC User Interface - suppression<\/h3>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><th>CBA variable<\/th><\/tr><\/thead><tbody><tr><td>Suppression Effects<\/td><td>Client side suppression effects.<\/td><td>Off<\/td><td><code>MCC_suppressionOn<\/code><\/td><\/tr><tr><td>Hit direction Effects<\/td><td>Shows the direction of enemy fire. Options: Realistic, Arcade, Off.<\/td><td>Realistic<\/td><td><code>MCC_hitRadar<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>Keybinds<\/h2>\n<p>MCC keybinds are CBA keybinds. Change them in <strong>Options &gt; Controls &gt; Configure Addons<\/strong>, section <strong>MCC<\/strong>.<\/p>\n<table><thead><tr><th>Action<\/th><th>Default key<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Open Zeus (MCC)<\/td><td>Ctrl+Delete<\/td><td>Only when you have Zeus<\/td><\/tr><tr><td>Commander Console<\/td><td>Ctrl+End<\/td><td>You must be your side's commander<\/td><\/tr><tr><td>Teleport to Team<\/td><td>Alt+T<\/td><td>When <strong>Teleport to Team<\/strong> allows it<\/td><\/tr><tr><td>Squad Management<\/td><td>P<\/td><td><\/td><\/tr><tr><td>Squad Leader PDA<\/td><td>Ctrl+Page Down<\/td><td>You must be a team leader<\/td><\/tr><tr><td>Interaction<\/td><td>Left Windows key<\/td><td>With <strong>Interaction System<\/strong> on<\/td><\/tr><tr><td>Interaction Self<\/td><td>Ctrl+Left Windows key<\/td><td>With <strong>Interaction System<\/strong> on<\/td><\/tr><tr><td>Climb Over<\/td><td>Alt+V<\/td><td>With <strong>Vault System<\/strong> on, at an obstacle<\/td><\/tr><tr><td>Switch Weapons 1: Primary/handgun<\/td><td>Shift+1<\/td><td>With <strong>Weapons Binds<\/strong> on<\/td><\/tr><tr><td>Switch Weapons 2: Launcher<\/td><td>Shift+2<\/td><td>With <strong>Weapons Binds<\/strong> on<\/td><\/tr><tr><td>Switch Weapons 3: Grenades<\/td><td>Shift+3<\/td><td>With <strong>Weapons Binds<\/strong> on<\/td><\/tr><tr><td>Switch Weapons 4: Utility<\/td><td>Shift+4<\/td><td>With <strong>Weapons Binds<\/strong> on<\/td><\/tr><\/tbody><\/table>\n<p>Without ACE, MCC shows \"Assing MCC Interaction Key !!!\" on screen until the Interaction key has a binding.<\/p>\n<h2>Notes<\/h2>\n<ul><li><strong>Ambient Fire<\/strong>: the description says it needs a restart to disable.<\/li><li><strong>Purchase air drop<\/strong> and <strong>Purchase CAS<\/strong>: work only after a mission restart.<\/li><li><strong>Enable MCC Medic System<\/strong> and <strong>Complex System<\/strong>: need a mission restart. With ACE loaded, the MCC medical settings module is ignored. See <a href=\"mod-support.md\">Mod support<\/a>.<\/li><li><strong>Breaching Ammo<\/strong> and <strong>Non Lethal Ammo<\/strong>: the default <code>[\"auto\"]<\/code> means every shotgun slug magazine found in your loaded mods. Add your own classes next to \"auto\" to keep both.<\/li><li><strong>Convoy HVT<\/strong> lists: left at default, RHS and CUP entries are added when those mods are loaded. Add \"auto\" to a custom list to keep them.<\/li><li>To see MCC timings and errors, turn on <strong>GAIA Debug<\/strong>. See <a href=\"troubleshooting.md\">Troubleshooting<\/a>.<\/li><\/ul>", "logistics": "<h1>Limited logistics<\/h1>\n<p>By default Arma supply is endless: an ammo truck never runs dry and a fuel crate never empties. In MCC 5, with <strong>limited logistics<\/strong> on, supply trucks, crates and vehicle service run out, and they refill at your base from your side's resources.<\/p>\n<p>It is optional and off by default.<\/p>\n<h2>Turn it on<\/h2>\n<p>Pick a mode in one of these places:<\/p>\n<ul><li>Eden: <strong>MCC 5 &gt; MCC 5 Mission Settings... &gt; MCC 5 &gt; Limited Logistics<\/strong><\/li><li>CBA Addon Options: <strong>MCC Logistics &gt; Limited Logistics<\/strong><\/li><li><code>description.ext<\/code>: <code>MCC_logisticsMode = 2;<\/code> (0 Off, 1 Fuel only, 2 Full)<\/li><\/ul>\n<table><thead><tr><th>Mode<\/th><th>What runs out<\/th><\/tr><\/thead><tbody><tr><td><strong>Off<\/strong><\/td><td>Nothing. Unlimited supply, as before.<\/td><\/tr><tr><td><strong>Fuel only<\/strong><\/td><td>Fuel trucks, fuel crates and fuel from vehicle service.<\/td><\/tr><tr><td><strong>Full (fuel, ammo, repair)<\/strong><\/td><td>Fuel, ammo and repair.<\/td><\/tr><\/tbody><\/table>\n<p>The mode can be changed while the mission runs. When you switch it to Off, MCC gives the supply objects their normal cargo back.<\/p>\n<h2>Supply points<\/h2>\n<p>A supply point is any vehicle or crate that can rearm, repair or refuel. That means:<\/p>\n<ul><li>classes with engine ammo, repair or fuel cargo (ammo trucks, fuel trucks, repair trucks, supply crates),<\/li><li>MCC supply crates,<\/li><li>with ACE, classes that ACE rearm or ACE refuel treat as a source.<\/li><\/ul>\n<p>The server looks for new supply objects every 30 seconds and checks each one every 5 seconds.<\/p>\n<p>Each supply point gets a stock for each type it can supply. The stock is in <strong>resource units<\/strong>, the same units as side resources.<\/p>\n<table><thead><tr><th>Supply object<\/th><th>Stock per type<\/th><\/tr><\/thead><tbody><tr><td>Vehicles (trucks)<\/td><td><strong>Supply Truck Capacity<\/strong>, default 1000<\/td><\/tr><tr><td>MCC crates<\/td><td>200<\/td><\/tr><tr><td>MCC big crates<\/td><td>800<\/td><\/tr><tr><td>Anything else<\/td><td>200<\/td><\/tr><\/tbody><\/table>\n<h2>What things cost<\/h2>\n<p>When a vehicle near a supply point gains ammo, health or fuel, MCC takes the price from that point's stock. A full service (0 to 100%) costs:<\/p>\n<table><thead><tr><th>Vehicle kind<\/th><th>Ammo<\/th><th>Repair<\/th><th>Fuel<\/th><\/tr><\/thead><tbody><tr><td>Plane<\/td><td>150<\/td><td>150<\/td><td>100<\/td><\/tr><tr><td>Helicopter<\/td><td>100<\/td><td>100<\/td><td>60<\/td><\/tr><tr><td>Tank<\/td><td>120<\/td><td>120<\/td><td>60<\/td><\/tr><tr><td>Wheeled APC<\/td><td>80<\/td><td>80<\/td><td>40<\/td><\/tr><tr><td>Ship<\/td><td>40<\/td><td>40<\/td><td>30<\/td><\/tr><tr><td>Static weapon<\/td><td>20<\/td><td>20<\/td><td>0<\/td><\/tr><tr><td>Anything else<\/td><td>30<\/td><td>30<\/td><td>20<\/td><\/tr><\/tbody><\/table>\n<p>A partial service costs part of that. All prices are multiplied by <strong>Supply Cost Factor<\/strong> (default 1).<\/p>\n<p>When a stock is empty, that supply type is switched off on the object. It works again when it is refilled.<\/p>\n<h2>Refilling at base<\/h2>\n<p>A supply vehicle refills when it is parked at its side's base:<\/p>\n<ul><li>\"At base\" means within <strong>Base Radius<\/strong> (default 75 m) of the side's <strong>start location<\/strong>, or of a built <strong>RTS base building<\/strong> of that side.<\/li><li>While parked there, it takes <strong>Base Refill Rate<\/strong> (default 100) resource units from the side resources every 5 seconds, until it is full.<\/li><\/ul>\n<p>Without side resources the trucks stay empty.<\/p>\n<h2>Side resources<\/h2>\n<p>Each side has resources: ammo, repair (materials), fuel, food and meds. In MCC 5 they are <strong>server-authoritative<\/strong>. All changes are made on the server and sent to everyone, so they can't get out of sync.<\/p>\n<p>Ways to change them:<\/p>\n<ul><li><strong>Set Resources<\/strong> module (Eden or Zeus).<\/li><li><strong>Capture Point<\/strong> modules that yield resources over time.<\/li><li>MCC campaign and RTS gameplay.<\/li><\/ul>\n<h2>Vehicle service<\/h2>\n<p>MCC's own vehicle service (the rearm, repair and refuel of the pylon dialog, for example at a <strong>Rearm Area<\/strong>) also costs side resources when limited logistics is on:<\/p>\n<ul><li><strong>Fuel only<\/strong> mode: refuelling costs fuel. Repair and rearm stay free.<\/li><li><strong>Full<\/strong> mode: repair, rearm and refuel all cost.<\/li><li>If the side can't pay, the service is refused with \"Not enough ... resources (N needed)\".<\/li><\/ul>\n<p>With logistics Off, vehicle service is free, as before.<\/p>\n<h2>Fuel consumption<\/h2>\n<p><strong>Fuel Consumption<\/strong> (default 1, range 1 to 10) multiplies how fast vehicles burn fuel while limited logistics is on. It uses the Arma 3 2.16+ fuel consumption command. It is applied by whichever machine owns the vehicle, and set back to normal when you turn logistics off.<\/p>\n<h2>Returning crates<\/h2>\n<p>When a crate is returned at base, its remaining stock counts toward what you get back.<\/p>\n<h2>ACE<\/h2>\n<p>With ACE rearm or ACE refuel loaded:<\/p>\n<ul><li>MCC pushes its stock into ACE's own counters (ammo as ACE supply points, fuel as liters).<\/li><li>Each check, MCC reads how much ACE used and takes it from the stock.<\/li><li>MCC crates without ACE rearm config are made ACE rearm sources first, because ACE ignores normal ammo cargo.<\/li><\/ul>\n<h2>The Logistics System setting<\/h2>\n<p><strong>Logistics System<\/strong> (MCC General, default On) is a different feature. It lets players load equipment, vehicles, resources and items into vehicles. It does not limit anything.<\/p>\n<h2>Settings summary<\/h2>\n<table><thead><tr><th>Setting<\/th><th>Default<\/th><th>Range<\/th><\/tr><\/thead><tbody><tr><td>Limited Logistics<\/td><td>Off<\/td><td>Off, Fuel only, Full<\/td><\/tr><tr><td>Supply Truck Capacity<\/td><td>1000<\/td><td>100 to 5000<\/td><\/tr><tr><td>Base Refill Rate<\/td><td>100<\/td><td>10 to 1000<\/td><\/tr><tr><td>Base Radius<\/td><td>75 m<\/td><td>25 to 500<\/td><\/tr><tr><td>Supply Cost Factor<\/td><td>1<\/td><td>0.1 to 5<\/td><\/tr><tr><td>Fuel Consumption<\/td><td>1<\/td><td>1 to 10<\/td><\/tr><\/tbody><\/table>\n<p>All are in CBA <strong>MCC Logistics &gt; Limited Logistics<\/strong>, and in MCC 5 Mission Settings. See <a href=\"settings.md#mcc-logistics---limited-logistics\">Settings<\/a>.<\/p>", "mod-support": "<h1>Mod support: ACE3, RHS, CUP<\/h1>\n<p>MCC 5 detects ACE3, RHS and CUP by itself when the game starts. You don't need to set anything. MCC works with or without them.<\/p>\n<p>For LAMBS and HBQ, see <a href=\"ai-mod-compatibility.md\">AI mod compatibility<\/a>.<\/p>\n<h2>How detection works<\/h2>\n<p>MCC checks which addons are loaded:<\/p>\n<table><thead><tr><th>Mod<\/th><th>Checked addon<\/th><\/tr><\/thead><tbody><tr><td>CBA<\/td><td><code>cba_main<\/code><\/td><\/tr><tr><td>ACE3<\/td><td><code>ace_common<\/code><\/td><\/tr><tr><td>ACE medical, cargo, rearm, refuel<\/td><td><code>ace_medical<\/code>, <code>ace_cargo<\/code>, <code>ace_rearm<\/code>, <code>ace_refuel<\/code><\/td><\/tr><tr><td>RHS AFRF, USAF, GREF, SAF<\/td><td><code>rhs_main<\/code>, <code>rhsusf_main<\/code>, <code>rhsgref_main<\/code>, <code>rhssaf_main<\/code><\/td><\/tr><tr><td>CUP Units<\/td><td><code>CUP_Creatures_People_Core<\/code> or <code>CUP_Creatures_People_Civil_Russia<\/code><\/td><\/tr><tr><td>CUP Vehicles<\/td><td><code>CUP_Vehicles_Core<\/code> or <code>CUP_AirVehicles_Core<\/code><\/td><\/tr><tr><td>CUP Weapons<\/td><td><code>CUP_Weapons_WeaponsCore<\/code><\/td><\/tr><\/tbody><\/table>\n<p>The result is written to the RPT in one line starting with <code>MCC compat:<\/code>, for example:<\/p>\n<pre><code>MCC compat: CBA true | ACE false (medical false, cargo false, rearm false, refuel false) | RHS true (AFRF true, USAF true, GREF false, SAF false) | CUP false (units false, vehicles false, weapons false)<\/code><\/pre>\n<h2>RHS and CUP: class lists<\/h2>\n<p>Several MCC settings are lists of classes. When such a list is still at its vanilla default, MCC swaps in a list for your loaded mods.<\/p>\n<table><thead><tr><th>Setting<\/th><th>With RHS / CUP<\/th><\/tr><\/thead><tbody><tr><td>Mission Wizard HVT (man)<\/td><td>RHS / CUP officers<\/td><\/tr><tr><td>Mission Wizard Armored Vehicles<\/td><td>RHS / CUP tanks<\/td><\/tr><tr><td>Mission Wizard Anti-Air<\/td><td>RHS / CUP AA vehicles<\/td><\/tr><tr><td>Mission Wizard Artillery<\/td><td>RHS / CUP artillery<\/td><\/tr><tr><td>Convoy HVT and HVT Vehicle<\/td><td>RHS / CUP officers and cars are added to the list<\/td><\/tr><tr><td>Breaching Ammo, Non Lethal Ammo<\/td><td>every shotgun slug magazine found in your mods<\/td><\/tr><\/tbody><\/table>\n<p>Rules:<\/p>\n<ul><li>Only classes that exist in your loaded mod version are used. Missing ones are dropped.<\/li><li>For the Mission Wizard lists, mod entries come first. Vanilla entries are only kept for sides the mods don't cover.<\/li><li>For the convoy lists, the mod entries are added after the vanilla ones.<\/li><li>If you <strong>changed<\/strong> a list, MCC leaves it alone.<\/li><li>Put the word <code>\"auto\"<\/code> in a list to get the detected entries plus your own. Example: <code>[\"auto\",\"my_magazine_class\"]<\/code>.<\/li><li>If you change one of these settings during the mission, the mod presets are applied again.<\/li><\/ul>\n<p>MCC's RTS and spawn groups also have RHS and CUP variants. They are used when that mod is loaded and every class in the variant exists.<\/p>\n<h2>Mission Wizard factions<\/h2>\n<p>The editor Mission Wizard lists every faction from every loaded mod that has soldiers. So RHS and CUP factions show up in the Enemy, Player and Civilian faction lists. See <a href=\"mission-wizard.md#factions\">Mission Wizard<\/a>.<\/p>\n<p>The sample missions include RHS campaign versions, for example \"(MCC RHS) Campaign USA vs RU\". They need RHS loaded.<\/p>\n<p>The <strong>Spawn Ship<\/strong> LHD type needs CUP.<\/p>\n<h2>ACE3<\/h2>\n<p>When ACE is loaded, MCC hands several jobs to ACE:<\/p>\n<ul><li><strong>Medical<\/strong>: the MCC medical settings module is ignored. Use ACE medical.<\/li><li><strong>Interaction<\/strong>: MCC does not ask you to bind its own interaction key. The MCC interaction key then only halts AI and opens doors, and the MCC self-interaction menu is off. Use ACE interaction for the rest. For MCC ammo boxes you get the hint \"Use ACE keys to resupply\".<\/li><li><strong>Captives<\/strong>: the convoy and Mission Wizard HVTs and hostages use ACE handcuffs. A Kill HVT objective also counts as done when the HVT is handcuffed with ACE.<\/li><li><strong>Cargo<\/strong>: <strong>Load to Cargo<\/strong> uses ACE cargo when it is loaded.<\/li><li><strong>Rearm and refuel<\/strong>: with limited logistics on, MCC syncs its stock with ACE rearm and ACE refuel. See <a href=\"logistics.md#ace\">Limited logistics<\/a>.<\/li><li>Some MCC actions, like resupply, use ACE items (for example field dressings instead of First Aid Kits).<\/li><\/ul>\n<p>If something MCC normally does seems missing with ACE loaded, it is usually because ACE does that job.<\/p>", "multiplayer-and-security": "<h1>Multiplayer and security<\/h1>\n<p>For server owners and mission makers who run MCC in multiplayer.<\/p>\n<h2>Dedicated server setup<\/h2>\n<ol><li>Copy <code>@mcc_sandbox_a3<\/code> to the server.<\/li><li>Start the server with <code>-mod=@CBA_A3;@mcc_sandbox_a3<\/code>.<\/li><li>Give headless clients the same <code>-mod<\/code> line.<\/li><li>The PBO is not signed. With <code>verifySignatures=2<\/code>, turn the check off or sign the PBO with your own key.<\/li><\/ol>\n<p>More in <a href=\"installation.md#dedicated-server\">Installation<\/a>.<\/p>\n<p>GAIA, the Mission Wizard, limited logistics and side resources run on the server. Headless clients take GAIA groups when <strong>Headless Client Balancing<\/strong> is on. See <a href=\"gaia.md#headless-clients\">GAIA AI<\/a>.<\/p>\n<h2>Who may use MCC<\/h2>\n<p>\"Allowed to use MCC\" decides who gets Zeus, and, in Strict network security, whose MCC requests the server accepts.<\/p>\n<table><thead><tr><th>Mission has<\/th><th>Who is allowed<\/th><\/tr><\/thead><tbody><tr><td>No Access Rights module<\/td><td><strong>Everyone<\/strong> (the default <code>MCC_allowedPlayers = [\"all\"]<\/code>)<\/td><\/tr><tr><td>An <strong>Access Rights<\/strong> module<\/td><td>Players whose UID is in the module, players whose unit is synced to it, and logged-in admins if <strong>Admin Access<\/strong> is ticked<\/td><\/tr><\/tbody><\/table>\n<p>The server and the host are always allowed.<\/p>\n<h3>The Access Rights module<\/h3>\n<ol><li>In Eden, use <strong>MCC 5 &gt; Place MCC Module &gt; Access Rights<\/strong>. Or find <strong>Access Rights<\/strong> under <strong>(MCC) General<\/strong> in the module browser.<\/li><li>In <strong>MCC Operators<\/strong>, enter player UIDs as an array, for example: ``<code> [\"76561190000000001\",\"76561190000000002\"] <\/code>``<\/li><li>And/or sync the module to the playable units (roles) that should have MCC.<\/li><li>Tick <strong>Admin Access<\/strong> to also allow logged-in admins and the host.<\/li><\/ol>\n<p>The server keeps its own copy of this list where clients can't change it. A unit variable that a client could set (<code>MCC_allowed<\/code>) is not trusted.<\/p>\n<h3>Zeus for MCC users<\/h3>\n<p>With <strong>Zeus for MCC Users<\/strong> on (the default), allowed players get Zeus automatically. Players who are not allowed get nothing. Set it in <strong>MCC 5 Mission Settings<\/strong> or in CBA <strong>MCC General &gt; Zeus<\/strong>. See <a href=\"zeus-tools.md#who-gets-zeus\">Zeus tools<\/a>.<\/p>\n<p>If you use the vanilla <strong>Game Master<\/strong> module for some players, MCC leaves those players' Zeus alone.<\/p>\n<h2>Network security<\/h2>\n<p>MCC 5 rebuilt its network code:<\/p>\n<ul><li>No code is sent over the network any more. Remote calls go to named functions.<\/li><li>There is a full remoteExec whitelist for MCC's functions and commands.<\/li><li>The mod no longer forces remoteExec mode 2.<\/li><li>CBA text settings are read as data, not run as code.<\/li><\/ul>\n<p>On top of that you can pick a <strong>Network Security<\/strong> level for each mission.<\/p>\n<h3>Normal and Strict<\/h3>\n<p>Set it in Eden: <strong>MCC 5 &gt; MCC 5 Mission Settings... &gt; MCC 5 &gt; Network Security<\/strong>.<\/p>\n<table><thead><tr><th>Level<\/th><th>What it does<\/th><\/tr><\/thead><tbody><tr><td><strong>Normal<\/strong> (default)<\/td><td>MCC accepts network requests from any player. This is the old behaviour.<\/td><\/tr><tr><td><strong>Strict (recommended for public servers)<\/strong><\/td><td>In multiplayer, MCC refuses requests that came over the network from players who are not allowed to use MCC. Requests from the server or the same machine are always fine.<\/td><\/tr><\/tbody><\/table>\n<ul><li>Strict has no effect in single player.<\/li><li>Without an Access Rights module, everyone is allowed, so Strict changes little. Use Strict together with the Access Rights module.<\/li><li>Each refused call is written to the RPT as <code>MCC network security: refused &lt;function&gt; from owner &lt;id&gt;<\/code>.<\/li><li>The server tells clients every 10 seconds (and when players join or leave) which players are allowed, so clients can check requests too.<\/li><\/ul>\n<p>For a mission without Eden attributes, put this in <code>description.ext<\/code>:<\/p>\n<pre><code>MCC_networkSecurity = 1;<\/code><\/pre>\n<h3>Engine whitelist (strongest)<\/h3>\n<p>For the strongest lock-down, add an engine remoteExec whitelist to your mission's <code>description.ext<\/code>. It blocks every function and command that is not listed, and keeps MCC working:<\/p>\n<pre><code>class CfgRemoteExec\n{\n\tclass Functions\n\t{\n\t\tmode = 1;\n\t\tjip = 1;\n\t\t#include \"\\mcc_sandbox_mod\\mcc\\cfg\\CfgRemoteExec.hpp\"\n\t\t#include \"\\mcc_sandbox_mod\\mcc\\radio\\CfgRemoteExec.hpp\"\n\t\t#include \"\\mcc_sandbox_mod\\mcc\\aas\\CfgRemoteExec.hpp\"\n\t};\n\tclass Commands\n\t{\n\t\tmode = 1;\n\t\t#include \"\\mcc_sandbox_mod\\mcc\\cfg\\CfgRemoteExecCommands.hpp\"\n\t};\n};<\/code><\/pre>\n<ul><li>If your mission or other mods use their own remoteExec calls, add those classes too.<\/li><li>Test the mission in multiplayer after turning this on.<\/li><li>Blocked calls show in the server RPT as <code>remoteExec ... blocked<\/code>.<\/li><\/ul>\n<p>You can use the Network Security level, the engine whitelist, or both.<\/p>\n<h2>Public server checklist<\/h2>\n<ol><li>Place an <strong>Access Rights<\/strong> module with your admins' UIDs (and tick Admin Access if you want).<\/li><li>Set <strong>Network Security<\/strong> to <strong>Strict<\/strong>.<\/li><li>Optional: add the engine whitelist above.<\/li><li>Decide if everyone allowed should get Zeus (<strong>Zeus for MCC Users<\/strong>).<\/li><li>Test with a second, non-admin player.<\/li><\/ol>\n<h2>Other multiplayer settings<\/h2>\n<ul><li><strong>Sync Jip<\/strong> (MCC General, On): players who join in progress sync with the server.<\/li><li><strong>Teleport to Team<\/strong> (MCC General, JIP Only): when players can teleport to their squad leader.<\/li><li><strong>Kick Hot Mic<\/strong> (MCC Radio): kicks a player with an open mic after a time. Only with the MCC radio system.<\/li><\/ul>\n<p>See <a href=\"settings.md\">Settings<\/a>.<\/p>\n<h2>License for servers<\/h2>\n<p>MCC 5 is under the GPL-3.0, so any server may run it. See <a href=\"license.md\">License<\/a>.<\/p>", "campaign": "<h1>Campaign<\/h1>\n<p>The MCC campaign is a long game mode. MCC generates one Mission Wizard mission (an \"AO\", area of operations) after another across the map. Players earn resources, push the front line out from their base, and the campaign ends after a set number of missions or when the enemy runs out of places.<\/p>\n<p>In MCC 5 a campaign can run <strong>up to 3 AOs at the same time<\/strong>.<\/p>\n<h2>Quick start: sample missions<\/h2>\n<p>The quickest way to try it is with the campaign missions that ship with the mod. In the multiplayer scenario list, look for names like:<\/p>\n<ul><li><strong>(MCC) Campaign<\/strong> and <strong>(MCC) Campaign CSAT<\/strong> (Altis, Tanoa)<\/li><li><strong>(MCC) Campaign BAF<\/strong>, <strong>USMC<\/strong>, <strong>USA<\/strong>, <strong>RU<\/strong>, <strong>GU<\/strong>, <strong>TK<\/strong> on other maps<\/li><li><strong>(MCC RHS) Campaign USA vs RU<\/strong>, <strong>CHDKZ vs USA<\/strong>, <strong>RU vs USA<\/strong> (need RHS)<\/li><\/ul>\n<p>Some need the map or mods in their name.<\/p>\n<h2>Set up your own campaign<\/h2>\n<ol><li>Place a <strong>Start Location<\/strong> module for the players' side with <strong>Type: Main<\/strong>. The campaign needs at least one HQ start location.<\/li><li>Place a <strong>Campaign init<\/strong> module (<strong>MCC 5 &gt; Place MCC Module &gt; Campaign Init<\/strong>, or under (MCC) General).<\/li><li>Set its options (below).<\/li><li>Optional: turn on Role Selection and time acceleration. The module description recommends them.<\/li><li>Optional: place empty markers with <strong>\"ao\"<\/strong> in their name where you want AOs. If you place any, MCC uses only those. Without them, MCC picks towns, military places and nature locations from the map that are at least 700 m from the start locations.<\/li><\/ol>\n<p>You can also start a campaign in game with the Zeus module <strong>Campaign init<\/strong>. It asks the same questions. Only one campaign can run at a time (\"Campaign already running\").<\/p>\n<h2>Campaign init options<\/h2>\n<table><thead><tr><th>Option<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td><strong>Players Faction<\/strong><\/td><td>Faction class name of the players<\/td><td><code>BLU_F<\/code><\/td><\/tr><tr><td><strong>Rival Players Side<\/strong><\/td><td>A second player side. Rival players gain resources from killing the main faction's players. None, West, East, Independent, Civilian<\/td><td>None<\/td><\/tr><tr><td><strong>Enemy Faction<\/strong><\/td><td>Faction class name of the enemy<\/td><td><code>OPF_F<\/code><\/td><\/tr><tr><td><strong>Civilian Faction<\/strong><\/td><td>Faction class name of the civilians<\/td><td><code>CIV_F<\/code><\/td><\/tr><tr><td><strong>Number of Missions<\/strong><\/td><td>Missions until the campaign ends: 5, 10, 15 or unlimited<\/td><td>10<\/td><\/tr><tr><td><strong>Difficulty<\/strong><\/td><td>Easy, Medium, Hard<\/td><td>Medium<\/td><\/tr><tr><td><strong>Intro<\/strong><\/td><td>Cinematic, Pop-Up (the operation screen with or without the camera), None<\/td><td>Pop-Up<\/td><\/tr><tr><td><strong>Starting Tickets<\/strong><\/td><td>Respawn tickets for each player side<\/td><td>100<\/td><\/tr><tr><td><strong>Missions Rotation<\/strong><\/td><td>After each set of missions MCC picks a new location<\/td><td>3<\/td><\/tr><tr><td><strong>Tile Size<\/strong><\/td><td>MCC divides the map into tiles of this size (meters)<\/td><td>400<\/td><\/tr><tr><td><strong>Load from DB<\/strong><\/td><td>Load saved campaign data from the database<\/td><td>Off<\/td><\/tr><\/tbody><\/table>\n<h2>Campaign settings<\/h2>\n<p>These are in <strong>MCC 5 Mission Settings &gt; MCC 5<\/strong> and in CBA <strong>MCC Mission Wizard &gt; Campaign<\/strong>:<\/p>\n<table><thead><tr><th>Setting<\/th><th>What it does<\/th><th>Default<\/th><\/tr><\/thead><tbody><tr><td><strong>Campaign: Simultaneous AOs<\/strong><\/td><td>How many AOs can be active at once, 1 to 3<\/td><td>1<\/td><\/tr><tr><td><strong>Campaign: AO Size<\/strong><\/td><td>Objective radius of every AO, in meters<\/td><td>300<\/td><\/tr><tr><td><strong>Campaign: Ambient Groups Cap<\/strong><\/td><td>Max ambient enemy groups kept around players (2 per player, up to this)<\/td><td>18<\/td><\/tr><tr><td><strong>Mission Wizard: Max Objectives<\/strong><\/td><td>Objectives per AO. Above 3, each extra one has a difficulty based chance<\/td><td>3<\/td><\/tr><tr><td><strong>Mission Wizard: Max Spawned Units<\/strong><\/td><td>Cap on the units one AO may spawn<\/td><td>200<\/td><\/tr><\/tbody><\/table>\n<p>The ambient cap is read every cycle, so you can change it during the campaign.<\/p>\n<h2>What happens during a campaign<\/h2>\n<p>At the start:<\/p>\n<ul><li>The time multiplier is raised to at least 12.<\/li><li>Each player side gets its starting tickets.<\/li><li>The map is split into tiles and shown with markers. The players' base area is painted in their colour.<\/li><li>Ambient enemy patrols start around players.<\/li><li>The campaign data is saved to the database every 20 minutes.<\/li><\/ul>\n<p>Each AO:<\/p>\n<ul><li>Is its own Mission Wizard mission with its own zones and objectives.<\/li><li>About 1 in 5 is a <strong>recon<\/strong> mission, picked at a random spot.<\/li><li>The first missions are easier: no enemy vehicles or artillery in the first 3, no armor in the first 4. After that the chance grows with difficulty.<\/li><li>A radio tower objective may be added, more often on higher difficulty.<\/li><\/ul>\n<p>When an AO is done:<\/p>\n<ul><li>Rewards are worked out from the objectives done and failed and the tickets lost.<\/li><li>The AO's objectives are removed. The area is cleaned up once no player is near.<\/li><li>For normal (non recon) AOs, the borders move: tiles turn to the players' colour.<\/li><li>A new AO starts.<\/li><\/ul>\n<p>The campaign ends when the number of missions is reached, or when no enemy locations are left (a win for everyone).<\/p>\n<p>Each in-game day the campaign also updates tickets, weather and the enemy's behaviour. A <strong>Campaign Evac<\/strong> vehicle (Evac Vehicle module) respawns each in-game day.<\/p>\n<h2>Tips<\/h2>\n<ul><li>Don't run more AOs than your server can take. Start with 1.<\/li><li>Use <strong>Max Spawned Units<\/strong> to keep each AO light.<\/li><li>Headless clients help a lot in long campaigns. See <a href=\"gaia.md#headless-clients\">GAIA AI<\/a>.<\/li><li>For a one-off mission, use the <a href=\"mission-wizard.md\">Mission Wizard<\/a> instead.<\/li><\/ul>\n<p>The campaign code has more details (resource rewards, day cycle, database) than are covered here. As a mission maker you only set the options above.<\/p>", "troubleshooting": "<h1>Troubleshooting<\/h1>\n<h2>The RPT log<\/h2>\n<p>Most answers are in the Arma 3 log file (RPT).<\/p>\n<ul><li><strong>Your PC<\/strong>: <code>%LOCALAPPDATA%\\Arma 3\\<\/code> (paste it into the Windows Explorer address bar). Open the newest <code>.rpt<\/code> file.<\/li><li><strong>Dedicated server<\/strong>: the server's own RPT, in the server's profile or log folder.<\/li><\/ul>\n<p>GAIA and most MCC logic run on the server. For AI problems in multiplayer, read the <strong>server<\/strong> RPT.<\/p>\n<h3>Lines to look for<\/h3>\n<table><thead><tr><th>Line starts with<\/th><th>What it tells you<\/th><\/tr><\/thead><tbody><tr><td><code>MCC compat:<\/code><\/td><td>Which of CBA, ACE, RHS and CUP MCC found<\/td><\/tr><tr><td><code>GAIA: AI mods detected<\/code><\/td><td>Whether LAMBS Danger, LAMBS Suppression and HBQ were found<\/td><\/tr><tr><td><code>MCC: Eden attribute<\/code><\/td><td>Each MCC 5 Mission Settings value applied at mission start, or why it was not applied<\/td><\/tr><tr><td><code>MCC Zeus: assigned<\/code> / <code>MCC Zeus: removed<\/code><\/td><td>Zeus given to or taken from a player<\/td><\/tr><tr><td><code>MCC Mission Wizard:<\/code><\/td><td>Editor and runtime Mission Wizard messages and errors<\/td><\/tr><tr><td><code>MCC campaign:<\/code><\/td><td>Campaign AOs starting<\/td><\/tr><tr><td><code>GAIA<\/code> cycle timings<\/td><td>AI performance (needs GAIA Debug on)<\/td><\/tr><tr><td><code>GAIA tasks:<\/code><\/td><td>Groups following tasks (needs GAIA Debug on)<\/td><\/tr><tr><td><code>MCC network security: refused<\/code><\/td><td>A blocked network call (only in Strict mode)<\/td><\/tr><tr><td><code>remoteExec ... blocked<\/code><\/td><td>A call blocked by the engine remoteExec whitelist<\/td><\/tr><\/tbody><\/table>\n<h2>Debug settings<\/h2>\n<ul><li><strong>GAIA Debug<\/strong> (CBA <strong>MCC GAIA<\/strong>, or MCC 5 Mission Settings): GAIA timings per phase in the server RPT, GAIA debug markers, support request logs.<\/li><li><strong>Debug markers<\/strong> in the Zeus Mission Wizard dialog.<\/li><li><strong>General Markers<\/strong> in the editor Mission Wizard: shows objective zones, roadblocks and enemy positions on the map.<\/li><\/ul>\n<h2>Common problems<\/h2>\n<h3>The mod does not load / no MCC 5 menu in Eden<\/h3>\n<ul><li>Tick both <strong>MCC Sandbox 5<\/strong> and <strong>CBA_A3<\/strong> in the launcher.<\/li><li>The launcher must point at the <code>@mcc_sandbox_a3<\/code> folder (the one with <code>addons\\mcc_sandbox_mod.pbo<\/code> inside).<\/li><li>Use the release zip <strong>ARMA3-MCC5.zip<\/strong>, not GitHub's source code download.<\/li><li>Don't load an older MCC version at the same time.<\/li><li>On a server, check the <code>-mod<\/code> line, and <code>verifySignatures<\/code> (the PBO is not signed).<\/li><\/ul>\n<p>See <a href=\"installation.md#install-problems\">Installation<\/a>.<\/p>\n<h3>I don't get Zeus<\/h3>\n<p>Check these in order:<\/p>\n<ol><li><strong>Zeus for MCC Users<\/strong> must be On (MCC 5 Mission Settings or CBA MCC General &gt; Zeus). It is On by default.<\/li><li>You must be allowed to use MCC. With an <strong>Access Rights<\/strong> module in the mission, only listed UIDs, synced units and (if ticked) admins are allowed. Without the module, everyone is.<\/li><li>Wait a few seconds after spawning. The server hands out Zeus every 10 seconds, once your client is ready.<\/li><li>If you already have a Zeus from another module (for example Game Master), MCC leaves it alone. Use that one.<\/li><li>Press <strong>Ctrl+Delete<\/strong> (the MCC keybind) or <strong>Y<\/strong>. If you get \"MCC: you have no Zeus access\", MCC has not given you a Zeus. Look for <code>MCC Zeus: assigned<\/code> in the server RPT.<\/li><li>The key may be taken by another mod. Change \"Open Zeus (MCC)\" in CBA keybinds (MCC).<\/li><\/ol>\n<h3>The right-click menu doesn't open in Zeus<\/h3>\n<ul><li>Click the right button, don't hold it. Holding moves the camera.<\/li><li>Right-click the soldier himself, not empty ground.<\/li><li>With a group selected, right-clicking a unit of another group gives a waypoint instead. Click empty ground to clear the selection, or select the group you right-click.<\/li><li>With ZEN loaded, the options are in the ZEN menu under <strong>MCC 5<\/strong>, and ZEN only opens it when no AI is selected.<\/li><li>Groups led by a player don't get the menu.<\/li><\/ul>\n<h3>The Mission Wizard faction list is empty or a faction is missing<\/h3>\n<ul><li>The list shows factions that have at least one soldier with public scope. Factions without soldiers are not listed.<\/li><li>Civilian factions are only in the <strong>Civilian Faction<\/strong> list. Military factions are only in the Enemy and Player lists.<\/li><li>The list is built once per game session. If you loaded a new mod, <strong>restart the game<\/strong>.<\/li><li>A faction saved in the mission whose mod is not loaded now shows as \"(not loaded)\". Load the mod or pick another faction.<\/li><\/ul>\n<h3>Generate Mission does nothing or shows an error<\/h3>\n<p>Read the notification. The common ones are in <a href=\"mission-wizard.md#error-messages\">Mission Wizard: error messages<\/a>. The full reason is in the RPT under <code>MCC Mission Wizard:<\/code>.<\/p>\n<ul><li>\"the enemy faction ... and the player faction ... are on the same side\": pick factions on different sides.<\/li><li>\"the center of the mission area is in the water\": move the camera, or select a trigger on land.<\/li><li>\"Unit cap reached\": raise <strong>Max AI Units<\/strong>, or lower players, difficulty or size.<\/li><\/ul>\n<h3>The Zeus Mission Wizard says \"MCC factions are not ready yet\"<\/h3>\n<p>MCC is still starting. Wait a little and place the module again. \"MCC is generating a mission, try again later\" means another mission is being built right now.<\/p>\n<h3>AI does not move<\/h3>\n<ul><
